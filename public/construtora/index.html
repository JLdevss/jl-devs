<style>
/* ==========================================================================
   Tokens. As 4 cores vêm do CONFIG.cores; o resto é derivado delas.
   primaria = tom sóbrio e escuro (grafite, azul-petróleo, verde-escuro): faixas escuras, títulos de destaque
   destaque = a cor de acento (botões principais, progresso da obra)
   ========================================================================== */
:root{
  --primaria:#1F2A30; --destaque:#C8962E; --fundo:#F4F5F4; --texto:#1A1F23;
  --destaque-texto:#1A1F23; --primaria-texto:#F4F5F4;

  --primaria-clara:color-mix(in oklab,var(--primaria) 82%,var(--fundo));
  --destaque-escuro:color-mix(in oklab,var(--destaque) 82%,#000);
  --superficie:color-mix(in oklab,var(--primaria) 6%,var(--fundo));
  --cartao:color-mix(in oklab,var(--fundo) 30%,#fff);
  --tinta:var(--texto);
  --tinta-suave:color-mix(in oklab,var(--texto) 72%,var(--fundo));
  --linha:color-mix(in oklab,var(--texto) 13%,var(--fundo));
  --linha-forte:color-mix(in oklab,var(--texto) 30%,var(--fundo));
  --claro-suave:color-mix(in oklab,var(--primaria-texto) 78%,var(--primaria));
  --foco:var(--primaria);

  --fonte:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --gutter:clamp(1.25rem,5vw,3rem);
  --max:1240px;
  --sec:clamp(4.5rem,9vw,7.5rem);
  --raio:4px;
}

/* ==========================================================================
   Base
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:5rem;accent-color:var(--primaria);color-scheme:light}
body{margin:0;background:var(--fundo);color:var(--tinta);font:400 1.0625rem/1.62 var(--fonte);font-stretch:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scrollbar-color:color-mix(in oklab,var(--primaria) 50%,var(--fundo)) var(--superficie)}
img,svg{display:block;max-width:100%}
img{height:auto}
h1,h2,h3,p,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em}
button,input,select{font:inherit;color:inherit}
::selection{background:var(--destaque);color:var(--destaque-texto)}
input,select{caret-color:var(--primaria)}
:focus-visible{outline:3px solid var(--foco);outline-offset:3px;border-radius:2px}
section[id]{scroll-margin-top:4.75rem}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pular{position:fixed;left:1rem;top:-4rem;z-index:100;background:var(--tinta);color:var(--fundo);padding:.75rem 1.1rem;transition:top .2s var(--ease)}
.pular:focus{top:1rem}
.container{width:min(100% - 2*var(--gutter),var(--max));margin-inline:auto}
.ico{display:inline-flex;width:1.2em;height:1.2em;flex:none}
.ico svg{width:100%;height:100%}
.tnum{font-variant-numeric:tabular-nums}

h1,h2,h3{font-family:var(--fonte);font-weight:700;font-stretch:112%;text-wrap:balance;color:var(--tinta);letter-spacing:-.02em}
h1 em,h2 em{font-style:normal;color:var(--destaque-escuro)}
h2{font-size:clamp(1.9rem,1.2rem + 2.7vw,3.2rem);line-height:1.04}
h3{font-size:1.2rem;line-height:1.25;font-stretch:106%}
p{text-wrap:pretty}
.ilus{font-size:.78rem;letter-spacing:.02em;color:var(--tinta-suave)}

/* ==========================================================================
   Botões — cantos retos, sólidos
   ========================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:3.25rem;padding:.8rem 1.5rem;border-radius:var(--raio);border:1.5px solid transparent;font-family:var(--fonte);font-weight:600;font-size:1rem;line-height:1.2;text-align:center;text-decoration:none;cursor:pointer;transition:background-color .2s var(--ease),color .2s,border-color .2s,transform .2s var(--ease)}
.btn .ico{width:1.3em;height:1.3em}
.btn--cta{background:var(--destaque);color:var(--destaque-texto)}
.btn--escuro{background:var(--primaria);color:var(--primaria-texto)}
.btn--linha{background:transparent;border-color:var(--linha-forte);color:var(--tinta)}
.btn--linha-clara{background:transparent;border-color:color-mix(in oklab,var(--primaria-texto) 45%,transparent);color:var(--primaria-texto)}
.btn--sm{min-height:2.75rem;padding:.5rem 1rem;font-size:.95rem}
.btn--lg{min-height:3.5rem;padding:.95rem 1.75rem;font-size:1.04rem}
.btn--bloco{width:100%}
.btn:active{transform:scale(.985)}
@media (hover:hover){
  .btn--cta:hover{background:var(--destaque-escuro);color:var(--primaria-texto)}
  .btn--escuro:hover{background:color-mix(in oklab,var(--primaria) 80%,#000)}
  .btn--linha:hover{border-color:var(--primaria)}
  .btn--linha-clara:hover{border-color:var(--primaria-texto)}
}
.link-seta{display:inline-flex;align-items:center;gap:.45rem;font-weight:600;text-decoration:none;border:0;background:none;padding:.35rem 0;cursor:pointer;border-bottom:1.5px solid currentColor;color:inherit}
.link-seta .ico{width:1em;height:1em;transition:transform .3s var(--ease)}
@media (hover:hover){.link-seta:hover .ico{transform:translateX(4px)}}

/* ==========================================================================
   Cabeçalho
   ========================================================================== */
.topo{position:fixed;inset:0 0 auto 0;z-index:50;background:color-mix(in oklab,var(--fundo) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:box-shadow .3s var(--ease)}
.topo[data-solido]{box-shadow:0 1px 0 var(--linha)}
.topo-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:4.25rem}
.marca{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1 1 auto;font-weight:700;font-stretch:115%;font-size:1.1rem;letter-spacing:-.01em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.marca .nome{overflow:hidden;text-overflow:ellipsis}
.marca .selo{flex:none;display:grid;place-items:center;width:2.1rem;height:2.1rem;background:var(--primaria);color:var(--destaque)}
.marca .selo .ico{width:1.2rem;height:1.2rem}
.nav{display:none;gap:1.75rem;font-size:.95rem;font-weight:500}
.nav a{text-decoration:none;color:var(--tinta-suave);padding:.4rem 0;border-bottom:1.5px solid transparent;transition:color .2s,border-color .2s}
@media (hover:hover){.nav a:hover{color:var(--tinta);border-bottom-color:var(--destaque)}}
.topo .btn{white-space:nowrap;flex:none}
@media (max-width:380px){.marca{font-size:.95rem}.marca .selo{display:none}.topo .btn--sm{padding-inline:.8rem;gap:.45rem}}
@media (min-width:1080px){.nav{display:flex}.marca{flex:0 1 auto}}

/* ==========================================================================
   Hero — render/foto grande; painel sólido ancorado no canto
   ========================================================================== */
.hero{position:relative;padding-top:4.25rem;background:var(--primaria)}
.hero-media{position:relative;aspect-ratio:4/3;max-height:40svh;width:100%;overflow:hidden;background:var(--primaria)}
.hero-media img{width:100%;height:100%;object-fit:cover}
.hero-ilus{position:absolute;right:.75rem;bottom:.6rem;padding:.2rem .5rem;background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;letter-spacing:.02em}
.hero-painel{background:var(--primaria);color:var(--primaria-texto);--foco:var(--primaria-texto);padding:clamp(1.75rem,5vw,3rem) var(--gutter) clamp(2.25rem,5vw,3.25rem)}
.hero-painel h1{color:var(--primaria-texto);font-size:clamp(2rem,1.2rem + 3.3vw,3.7rem);line-height:1.02;letter-spacing:-.03em;font-stretch:108%;max-width:17ch;hyphens:auto;-webkit-hyphens:auto}
.hero-painel h1 em{color:var(--destaque)}
.hero-lead{margin-top:1.2rem;font-size:clamp(1.05rem,1rem + .3vw,1.18rem);color:var(--claro-suave);max-width:44ch}
.hero-acoes{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.5rem;margin-top:1.75rem}
.hero-acoes .link-seta{color:var(--primaria-texto)}
.hero-regua{display:flex;flex-wrap:wrap;gap:.5rem 1.75rem;margin-top:2rem;padding-top:1.25rem;border-top:1px solid color-mix(in oklab,var(--primaria-texto) 22%,transparent);font-size:.92rem;color:var(--claro-suave)}
.hero-regua strong{color:var(--primaria-texto);font-weight:600}
@media (max-width:560px){.hero-acoes .btn--cta{width:100%}}
@media (min-width:960px){
  .hero{min-height:min(100svh,58rem);display:grid;padding-top:0}
  .hero-media{position:absolute;inset:0;aspect-ratio:auto;max-height:none}
  .hero-painel{position:relative;align-self:end;justify-self:start;margin:7rem 0 clamp(2.5rem,5vw,4rem) max(var(--gutter),calc((100vw - var(--max))/2));width:min(46rem,100% - 2*var(--gutter));padding:3rem 3rem 2.75rem}
}
@media (prefers-reduced-motion:no-preference){
  .hero-media img{animation:assentar 1.8s var(--ease) both}
  .hero-painel{animation:subir 1s var(--ease) both .2s}
  @keyframes assentar{from{transform:scale(1.07)}to{transform:none}}
  @keyframes subir{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
}

/* ==========================================================================
   Seções
   ========================================================================== */
.sec{padding-block:var(--sec)}
.sec--tinta{background:var(--superficie)}
.sec--escura{background:var(--primaria);color:var(--primaria-texto);--foco:var(--primaria-texto)}
.sec--escura h2,.sec--escura h3{color:var(--primaria-texto)}
.sec--escura h2 em{color:var(--destaque)}
.sec-head{display:grid;gap:1rem;max-width:48rem;margin-bottom:clamp(2rem,4.5vw,3.25rem)}
.sec-head .lead{color:var(--tinta-suave);font-size:1.08rem;max-width:56ch}
.sec--escura .sec-head .lead{color:var(--claro-suave)}

/* Filtros */
.filtros{display:flex;flex-wrap:wrap;align-items:end;gap:1rem 1.25rem;margin-bottom:1.25rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.chip span{display:inline-flex;align-items:center;min-height:2.6rem;padding:.4rem 1rem;border:1.5px solid var(--linha-forte);border-radius:var(--raio);font-weight:500;font-size:.95rem;cursor:pointer;background:var(--cartao);transition:background-color .2s,border-color .2s,color .2s}
.chip input:checked+span{background:var(--primaria);border-color:var(--primaria);color:var(--primaria-texto)}
.chip input:focus-visible+span{outline:3px solid var(--foco);outline-offset:2px}
@media (hover:hover){.chip span:hover{border-color:var(--primaria)}}
.campo{display:grid;gap:.35rem;min-width:0}
.campo label,.grupo legend{font-size:.85rem;font-weight:600}
.campo select,.campo input{width:100%;min-width:0;min-height:2.9rem;padding:.5rem .8rem;background:var(--cartao);border:1.5px solid var(--linha-forte);border-radius:var(--raio);transition:border-color .2s}
.campo select:hover,.campo input:hover{border-color:var(--primaria)}
.grupo{border:0;margin:0;padding:0;min-width:0}
.grupo legend{padding:0;margin-bottom:.35rem}
.filtros .campo{min-width:11rem;flex:1 1 11rem;max-width:16rem}
.barra-res{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem;margin-bottom:1.5rem;font-weight:600}
.limpar{border:0;background:none;padding:.4rem 0;color:var(--tinta);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:.2em}
.limpar[hidden]{display:none}

/* Cartões de empreendimento / obra */
.grade{display:grid;gap:clamp(1.5rem,3vw,2.25rem);grid-template-columns:repeat(auto-fill,minmax(min(100%,21rem),1fr))}
.card{display:flex;flex-direction:column;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
@media (hover:hover){.card:hover{box-shadow:0 22px 40px -26px rgba(0,0,0,.4);transform:translateY(-2px)}}
.card-foto{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--superficie);display:block;width:100%;padding:0;margin:0;border:0}
button.card-foto{cursor:pointer}
.card-foto img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
@media (hover:hover){button.card-foto:hover img{transform:scale(1.04)}}
.card-foto .hero-ilus{font-size:.68rem}
.status{position:absolute;top:.8rem;left:.8rem;display:inline-flex;align-items:center;gap:.4rem;min-height:1.75rem;padding:.2rem .65rem;font-size:.8rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;background:var(--fundo);color:var(--tinta)}
.status--lancamento{background:var(--destaque);color:var(--destaque-texto)}
.status--obras{background:var(--primaria);color:var(--primaria-texto)}
.status--obras::before{content:"";width:.5rem;height:.5rem;background:var(--destaque)}
.card-corpo{display:flex;flex-direction:column;gap:.6rem;padding:1.25rem 1.35rem 1.35rem;flex:1}
.card-corpo h3{font-size:1.3rem}
.local-tag{display:flex;align-items:center;gap:.4rem;color:var(--tinta-suave);font-size:.95rem}
.local-tag .ico{color:var(--primaria)}
.ficha{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem 1rem;padding-block:.85rem;margin-block:.25rem;border-block:1px solid var(--linha);font-size:.92rem}
.ficha div{display:grid;gap:.05rem}
.ficha dt{font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-suave)}
.ficha dd{font-weight:500}
.preco{font-weight:700;font-stretch:108%;font-size:1.25rem;letter-spacing:-.01em}
.preco small{display:block;font-weight:400;font-stretch:100%;font-size:.82rem;color:var(--tinta-suave);letter-spacing:0;margin-top:.15rem}
.card-acoes{display:grid;gap:.5rem;margin-top:auto;padding-top:.6rem}
.revisao{display:flex;gap:.6rem;align-items:flex-start;padding:.75rem .9rem;background:#fff3c4;color:#4a3800;font-size:.85rem;line-height:1.4;border-left:0}
.revisao .ico{color:#8a6a00;margin-top:.1em}
.exemplo{font-size:.8rem;color:var(--tinta-suave)}

/* Vazio */
.vazio{display:grid;justify-items:center;gap:1rem;text-align:center;padding:clamp(2.5rem,6vw,4rem) 1.5rem;border:1.5px dashed var(--linha-forte);background:var(--cartao)}
.vazio[hidden]{display:none}
.vazio h3{font-size:1.4rem}
.vazio p{color:var(--tinta-suave);max-width:46ch}

/* Painel (detalhe) */
.painel{border:0;padding:0;width:min(1180px,100% - 2rem);max-width:none;max-height:92vh;border-radius:var(--raio);background:var(--fundo);color:var(--tinta);overflow:auto;box-shadow:0 40px 80px -30px rgba(0,0,0,.55)}
.painel::backdrop{background:rgba(10,14,17,.66)}
.p-topo{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem 1rem .7rem 1.5rem;background:color-mix(in oklab,var(--fundo) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.p-topo p{font-weight:600;font-stretch:108%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fechar{display:grid;place-items:center;width:2.75rem;height:2.75rem;border:1px solid var(--linha-forte);border-radius:50%;background:var(--cartao);cursor:pointer;flex:none}
.fechar:hover{border-color:var(--primaria)}
.p-corpo{display:grid;gap:2.25rem;padding:1.5rem}
@media (min-width:900px){.p-corpo{padding:2rem 2.25rem 2.5rem}}
.p-intro{display:grid;gap:1.5rem 2.5rem}
@media (min-width:900px){.p-intro{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start}}
.p-info{display:grid;gap:1rem;align-content:start}
.p-info h2{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.4rem)}
.p-bloco{display:grid;gap:1rem;padding-top:1.75rem;border-top:1px solid var(--linha)}
.p-bloco h3{font-size:1.3rem}
.p-desc{color:var(--tinta-suave)}
.difs{display:grid;gap:.55rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr))}
.difs li{display:flex;gap:.6rem;align-items:flex-start}
.difs .ico{color:var(--destaque-escuro);margin-top:.15em}
.p-acoes{display:grid;gap:.6rem}
@media (max-width:640px){
  .painel{width:100%;max-height:none;height:100%;border-radius:0}
  .p-acoes--fixa{position:sticky;bottom:0;z-index:2;background:var(--fundo);padding:.75rem 1.5rem;margin-inline:-1.5rem;border-top:1px solid var(--linha)}
}

/* Galeria */
.gal{display:grid;gap:.55rem;align-content:start;min-width:0}
.gal-principal{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--superficie)}
.gal-principal img{width:100%;height:100%;object-fit:cover}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:2.75rem;height:2.75rem;border-radius:50%;border:0;background:color-mix(in oklab,var(--fundo) 92%,transparent);cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.gal-nav--ant{left:.75rem}.gal-nav--prox{right:.75rem}
.gal-cont{position:absolute;right:.75rem;top:.75rem;padding:.15rem .55rem;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem}
.gal-legenda{min-height:1.2em}
.minis{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem;scrollbar-width:thin}
.mini{flex:none;width:5.5rem;aspect-ratio:4/3;overflow:hidden;border:2px solid transparent;padding:0;background:var(--superficie);cursor:pointer;opacity:.72;transition:opacity .2s,border-color .2s}
.mini img{width:100%;height:100%;object-fit:cover}
.mini[aria-current="true"]{border-color:var(--primaria);opacity:1}

/* Plantas */
.plantas-abas{display:flex;flex-wrap:wrap;gap:.4rem}
.planta-aba{min-height:2.6rem;padding:.4rem 1rem;border:1.5px solid var(--linha-forte);border-radius:var(--raio);background:var(--cartao);font-weight:500;cursor:pointer}
.planta-aba[aria-selected="true"]{background:var(--primaria);border-color:var(--primaria);color:var(--primaria-texto)}
.planta-corpo{display:grid;gap:1rem 2rem;align-items:start}
@media (min-width:760px){.planta-corpo{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
.planta-img{aspect-ratio:4/3;background:#fff;border:1px solid var(--linha);overflow:hidden}
.planta-img img{width:100%;height:100%;object-fit:contain}

/* Linha do tempo da obra */
.obras-lista{display:grid;gap:clamp(2rem,4vw,3rem)}
.obra{display:grid;gap:1.5rem;padding:clamp(1.25rem,3vw,2rem);background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio)}
.sec--escura .obra{background:color-mix(in oklab,var(--primaria) 85%,#fff);border-color:transparent;color:var(--primaria-texto)}
.obra-topo{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.5rem 1.5rem}
.obra-data{font-size:.9rem;opacity:.85}
.progresso{display:grid;gap:.5rem}
.progresso-barra{height:.75rem;background:color-mix(in oklab,currentColor 14%,transparent);overflow:hidden}
.progresso-barra span{display:block;height:100%;background:var(--destaque);transform-origin:left}
@media (prefers-reduced-motion:no-preference){.progresso-barra span{animation:encher 1.4s var(--ease) both .2s}@keyframes encher{from{transform:scaleX(0)}to{transform:scaleX(1)}}}
.progresso p{font-weight:600;font-stretch:108%}
.etapas{display:grid;gap:0;position:relative}
.etapa{position:relative;display:grid;grid-template-columns:auto 1fr;gap:.15rem 1rem;padding:0 0 1.35rem}
.etapa:last-child{padding-bottom:0}
.etapa::before{content:"";position:absolute;left:.9rem;top:1.9rem;bottom:0;width:2px;background:color-mix(in oklab,currentColor 18%,transparent);transform:translateX(-50%)}
.etapa:last-child::before{display:none}
.etapa--concluida::before{background:var(--destaque)}
.etapa-marca{grid-row:span 2;display:grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;border:2px solid color-mix(in oklab,currentColor 30%,transparent);background:inherit;position:relative;z-index:1}
.etapa--concluida .etapa-marca{background:var(--destaque);border-color:var(--destaque);color:var(--destaque-texto)}
.etapa--andamento .etapa-marca{border-color:var(--destaque);box-shadow:inset 0 0 0 4px var(--cartao)}
.etapa--andamento .etapa-marca::after{content:"";width:.7rem;height:.7rem;border-radius:50%;background:var(--destaque)}
.etapa-marca .ico{width:1rem;height:1rem}
.etapa-nome{font-weight:600;font-stretch:106%}
.etapa-st{font-size:.88rem;opacity:.78}
@media (min-width:860px){
  .etapas{grid-template-columns:repeat(var(--n,5),minmax(0,1fr))}
  .etapa{grid-template-columns:1fr;justify-items:start;padding:0 1rem 0 0;gap:.6rem}
  .etapa::before{left:1.8rem;right:0;top:.9rem;bottom:auto;width:auto;height:2px;transform:translateY(-50%)}
  .etapa-marca{grid-row:auto}
}
.obra-fotos{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,11rem),1fr))}
.obra-fotos figure{display:grid;gap:.35rem}
.obra-foto{aspect-ratio:4/3;overflow:hidden;background:var(--superficie)}
.obra-foto img{width:100%;height:100%;object-fit:cover}
.obra-fotos figcaption{font-size:.85rem;font-weight:500}

/* Legal do empreendimento */
.legal{display:grid;gap:.35rem;padding:1rem 1.15rem;background:var(--superficie);font-size:.88rem;color:var(--tinta-suave)}
.legal strong{color:var(--tinta);font-weight:600}

/* Serviços */
.servs{display:grid;gap:1px;background:var(--linha);border:1px solid var(--linha);grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr))}
.serv{display:grid;gap:.75rem;align-content:start;padding:1.75rem 1.5rem;background:var(--cartao)}
.serv-ico{display:grid;place-items:center;width:3rem;height:3rem;background:var(--primaria);color:var(--destaque);margin-bottom:.25rem}
.serv-ico .ico{width:1.5rem;height:1.5rem}
.serv p{color:var(--tinta-suave)}

/* Como trabalhamos */
.passos{display:grid;gap:1.5rem;counter-reset:p}
.passo{display:grid;gap:.55rem;align-content:start;padding-top:1.25rem;border-top:3px solid var(--primaria)}
.sec--escura .passo{border-top-color:var(--destaque)}
.passo-n{font-weight:800;font-stretch:120%;font-size:2.4rem;line-height:1;color:var(--destaque-escuro)}
.sec--escura .passo-n{color:var(--destaque)}
.passo p{color:var(--tinta-suave);max-width:34ch}
.sec--escura .passo p{color:var(--claro-suave)}
@media (min-width:860px){.passos{grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:2rem}}

/* Orçamento (monta a mensagem do WhatsApp) */
.orc{display:grid;gap:1.5rem 3rem;padding:clamp(1.5rem,4vw,2.75rem);background:var(--primaria);color:var(--primaria-texto);--foco:var(--primaria-texto)}
.orc h2{color:var(--primaria-texto);font-size:clamp(1.7rem,1.2rem + 1.8vw,2.5rem)}
.orc .lead{color:var(--claro-suave);margin-top:.75rem;max-width:40ch}
.orc .nota{display:flex;gap:.5rem;margin-top:1rem;font-size:.88rem;color:var(--claro-suave)}
.orc-form{display:grid;gap:1rem}
.orc .campo label{color:var(--primaria-texto)}
.orc .campo select,.orc .campo input{background:var(--fundo);color:var(--texto);border-color:transparent}
.orc-linha{display:grid;gap:1rem}
@media (min-width:640px){.orc-linha{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:960px){.orc{grid-template-columns:minmax(0,4fr) minmax(0,6fr);align-items:start}.orc-form .btn{justify-self:start}}

/* Sobre, equipe, RT */
.sobre-grid{display:grid;gap:clamp(2rem,5vw,4.5rem);align-items:start}
.sobre-foto{aspect-ratio:4/3;overflow:hidden;background:var(--superficie)}
.sobre-foto img{width:100%;height:100%;object-fit:cover}
.sobre-texto{display:grid;gap:1.1rem;max-width:60ch}
.sobre-texto p{color:var(--tinta-suave);font-size:1.08rem}
.valores{display:flex;flex-wrap:wrap;gap:.5rem}
.valores li{padding:.35rem .8rem;border:1.5px solid var(--linha-forte);font-weight:500;font-size:.93rem}
.rt{display:flex;gap:.9rem;align-items:center;padding:.9rem 1.1rem .9rem .9rem;border:1px solid var(--linha);background:var(--cartao)}
.rt>.ico{width:2.6rem;height:2.6rem;padding:.55rem;background:var(--primaria);color:var(--destaque)}
.rt div{display:grid}
.rt span{font-size:.85rem;color:var(--tinta-suave)}
@media (min-width:900px){.sobre-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
.equipe{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,14rem),1fr));margin-top:clamp(2.5rem,5vw,3.5rem)}
.membro{display:grid;gap:.25rem}
.membro-foto{aspect-ratio:1/1;overflow:hidden;background:var(--superficie);margin-bottom:.75rem}
.membro-foto img{width:100%;height:100%;object-fit:cover}
.membro span{color:var(--tinta-suave);font-size:.93rem}

/* Diferenciais */
.difs-sec{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));border-top:1px solid color-mix(in oklab,var(--primaria-texto) 22%,transparent)}
.dif{display:grid;gap:.6rem;align-content:start;padding:1.6rem 1.5rem 1.6rem 0;border-bottom:1px solid color-mix(in oklab,var(--primaria-texto) 22%,transparent)}
.dif p{color:var(--claro-suave)}
.sec:not(.sec--escura) .difs-sec{border-top-color:var(--linha-forte)}
.sec:not(.sec--escura) .dif{border-bottom-color:var(--linha)}
.sec:not(.sec--escura) .dif p{color:var(--tinta-suave)}

/* Avaliações */
.avals{display:grid;gap:clamp(1rem,3vw,1.75rem);grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr))}
.aval{display:grid;gap:1rem;align-content:space-between;padding:1.5rem;border:1px solid var(--linha);background:var(--cartao)}
.aval cite{font-style:normal;font-size:.93rem;color:var(--tinta-suave)}

/* FAQ */
.faq-grid{display:grid;gap:2rem clamp(2rem,6vw,5rem)}
@media (min-width:960px){.faq-grid{grid-template-columns:minmax(0,4fr) minmax(0,7fr);align-items:start}.faq-grid .sec-head{margin-bottom:0;position:sticky;top:6.5rem}}
.faq-lista{border-bottom:1px solid var(--linha-forte)}
.faq-lista details{border-top:1px solid var(--linha-forte)}
.faq-lista summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:1.5rem;min-height:3.6rem;padding-block:1rem;font-weight:600;font-size:1.06rem}
.faq-lista summary::-webkit-details-marker{display:none}
.faq-lista summary::after{content:"";flex:none;width:1rem;height:1rem;background:
  linear-gradient(var(--tinta),var(--tinta)) center/100% 2px no-repeat,
  linear-gradient(var(--tinta),var(--tinta)) center/2px 100% no-repeat;transition:transform .4s var(--ease)}
.faq-lista details[open] summary::after{transform:rotate(135deg)}
.faq-resp{padding:0 2.5rem 1.3rem 0;color:var(--tinta-suave);max-width:62ch}

/* Localização */
.local{display:grid;gap:clamp(2rem,5vw,4rem)}
@media (min-width:960px){.local{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
.dados{display:grid}
.dados>div{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;padding-block:1.05rem;border-top:1px solid var(--linha)}
.dados>div:last-child{border-bottom:1px solid var(--linha)}
.dados .ico{width:1.4rem;height:1.4rem;color:var(--primaria);grid-row:span 2;margin-top:.1rem}
.dados dt{font-weight:600}
.dados dd{color:var(--tinta-suave)}
.horas{display:grid;gap:.2rem}
.horas>span{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;max-width:24rem}
.local-acoes{margin-top:1.75rem;display:flex;flex-wrap:wrap;gap:.75rem}
.mapa{aspect-ratio:4/3;overflow:hidden;background:var(--superficie);display:grid;place-items:center;text-align:center;padding:1.25rem;color:var(--tinta-suave)}
.sec--tinta .mapa{background:var(--cartao)}
.mapa--vazio{border:1.5px dashed var(--linha-forte)}
.mapa:has(iframe){padding:0}
.mapa iframe{width:100%;height:100%;border:0;display:block}
.p-mapa{aspect-ratio:16/9;overflow:hidden;background:var(--superficie)}
.p-mapa iframe{width:100%;height:100%;border:0;display:block}
.refs{display:grid;gap:.4rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr))}
.refs li{display:flex;gap:.5rem;align-items:flex-start;color:var(--tinta-suave)}
.refs .ico{color:var(--primaria);margin-top:.15em}
@media (max-width:959px){.mapa{aspect-ratio:1/1}}

/* Chamada final */
.final-in{display:grid;gap:1.4rem;justify-items:start}
.final h2{font-size:clamp(2rem,1.3rem + 3.2vw,3.8rem);line-height:1.02;max-width:18ch}
.final p{max-width:48ch;font-size:1.1rem;color:var(--claro-suave)}
.final-contato{display:flex;flex-wrap:wrap;gap:.5rem 2rem}
.final-contato a{display:inline-flex;gap:.5rem;align-items:center}

/* Rodapé */
.rodape{background:color-mix(in oklab,var(--primaria) 80%,#000);color:color-mix(in oklab,var(--primaria-texto) 80%,transparent);padding-block:clamp(3rem,6vw,4.5rem) 2rem;font-size:.97rem;--foco:var(--primaria-texto)}
.rodape-grid{display:grid;gap:2.25rem clamp(2rem,5vw,4rem)}
@media (min-width:860px){.rodape-grid{grid-template-columns:minmax(0,4fr) minmax(0,3fr) minmax(0,4fr)}}
.rodape .logo{font-weight:700;font-stretch:115%;font-size:1.3rem;text-transform:uppercase;color:var(--primaria-texto);margin-bottom:.6rem}
.rodape h2{font-size:.8rem;font-weight:600;font-stretch:100%;letter-spacing:.12em;text-transform:uppercase;color:var(--primaria-texto);margin-bottom:.9rem;line-height:1.3}
.rodape ul{display:grid;gap:.55rem}
.rodape li{display:flex;gap:.6rem;align-items:flex-start}
.rodape .ico{width:1.1em;height:1.1em;margin-top:.25em}
.rodape a{text-decoration-color:color-mix(in oklab,var(--primaria-texto) 40%,transparent)}
.rt-rodape{margin-top:clamp(2.25rem,5vw,3.25rem);padding-top:1.25rem;border-top:1px solid color-mix(in oklab,var(--primaria-texto) 20%,transparent);display:flex;flex-wrap:wrap;gap:.35rem 1.5rem;color:var(--primaria-texto)}
.rodape-legal{margin-top:1rem;display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between;font-size:.88rem;color:color-mix(in oklab,var(--primaria-texto) 70%,transparent)}

/* Botão flutuante (celular) */
.flutuante{position:fixed;z-index:60;right:max(1rem,env(safe-area-inset-right));bottom:max(1rem,env(safe-area-inset-bottom));transform:translateY(160%);transition:transform .6s var(--ease);box-shadow:0 14px 28px -12px rgba(0,0,0,.5)}
.flutuante[data-visivel]{transform:none}
@media (min-width:900px){.flutuante{display:none}}
@media (max-width:899px){.rodape{padding-bottom:6rem}}

/* Entrada ao rolar */
.rev-on .rev{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:calc(var(--i,0)*60ms)}
.rev-on .rev.in{opacity:1;transform:none}
@media print{.rev-on .rev{opacity:1!important;transform:none!important}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}.rev-on .rev{opacity:1;transform:none}}

/* ==========================================================================
   Ferramentas de prévia (somem com ?limpo ou modoPrevia:false)
   ========================================================================== */
.pend{display:inline-block;margin-right:.45em;padding:.18em .5em .14em;background:#ffe36e;color:#1b1b1b;font:700 .6rem/1 var(--fonte);letter-spacing:.06em;text-transform:uppercase;vertical-align:.2em;font-style:normal;white-space:nowrap}
.previa{position:fixed;z-index:90;left:max(.75rem,env(safe-area-inset-left));bottom:max(.75rem,env(safe-area-inset-bottom));display:flex;gap:.6rem;align-items:center;max-width:calc(100vw - 1.5rem);padding:.6rem .9rem;border:0;background:#17201f;color:#fff;font:600 .78rem/1.25 var(--fonte);cursor:pointer;text-align:left;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
.previa i{flex:none;width:.6rem;height:.6rem;border-radius:50%;background:#ffe36e}
.previa:focus-visible{outline-color:#ffe36e}
@media (max-width:600px){.previa-longo{display:none}}
@media (max-width:899px){.previa{bottom:calc(max(1rem,env(safe-area-inset-bottom)) + 4.5rem)}}
.pend-foco{outline:3px solid #ffe36e;outline-offset:6px}
</style>
</head>

<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<main id="conteudo"></main>
<footer class="rodape" id="rodape"></footer>

<a class="btn btn--cta btn--lg flutuante" id="flutuante" target="_blank" rel="noopener noreferrer" hidden></a>

<dialog class="painel" id="painel" aria-labelledby="p-titulo"></dialog>

<noscript>
  <p style="padding:2rem;font-family:sans-serif">[TROCAR] Este site precisa de JavaScript para mostrar o conteúdo. Fale com a equipe pelo WhatsApp: (00) 00000-0000.</p>
</noscript>

<script>
/* ==========================================================================
   CONFIG — TUDO que muda de cliente fica aqui. Procure por [TROCAR].
   Dica: no título, *palavra* ganha a cor de destaque.
   Tokens aceitos nos textos: {nome} {cidade} {uf}

   REGRAS (já respeitadas pelo template — mantenha nos textos do cliente):
   - nada de "oportunidade única", "abaixo do mercado", "valorização garantida", "melhor investimento";
   - valor só "a partir de" quando informado, sempre com condições e data de referência;
   - prazo só como "previsão", do jeito que a construtora informar;
   - renders, plantas e imagens de empreendimento na planta mostram "Imagem meramente ilustrativa";
   - empreendimento em lançamento/obras só é publicado com incorporadora, CNPJ, registro de incorporação
     e matrícula preenchidos (Lei 4.591/64, art. 32). Faltando, o site mostra aviso de revisão na prévia
     e esconde o empreendimento no site publicado;
   - fotos de obra com pessoas identificáveis só com autorização.
   ========================================================================== */
const CONFIG = {

  /* "empreendimentos" = venda de unidades | "servicos" = obras sob contrato e orçamento */
  modo: "empreendimentos",

  /* Prévia: mostra a etiqueta amarela [TROCAR], avisos de revisão e o contador de pendências.
     Para mostrar ao cliente sem as etiquetas, abra o link com ?limpo no final. */
  modoPrevia: true,

  negocio: {
    nome: "[TROCAR] Nome da Construtora",
    nicho: "Construtora",
    tipoSchema: "GeneralContractor",   // GeneralContractor | HomeAndConstructionBusiness
    cidade: "[TROCAR] Cidade",
    uf: "[TROCAR] UF",
    bairro: "[TROCAR] Bairro",
    rua: "[TROCAR] Rua Exemplo, 000 — sala 00",

    tipoEndereco: "Escritório",        // "Escritório" | "Estande de vendas"
    coordenadas: null
  },

  /* OBRIGATÓRIO: responsável técnico (engenheiro ou arquiteto). Aparece em Sobre e no rodapé. */
  responsavelTecnico: {
    nome: "[TROCAR] Nome do responsável técnico",
    profissao: "[TROCAR] Engenheiro civil",
    registro: "[TROCAR] CREA-UF 000000000"      // ou "CAU A00000-0"
  },

  /* Opcional: imobiliária parceira que faz as vendas. Vazio = não aparece. */
  parceiraVendas: { nome: "", creci: "" },

  contato: {
    telefone: "[TROCAR] (00) 0000-0000",
    email: "[TROCAR] contato@seudominio.com.br"
  },

  whatsapp: {
    numero: "5500000000000",           // [TROCAR] só dígitos, com 55 + DDD + número
    mensagem: "[TROCAR] Olá! Vi o site da {nome} e gostaria de falar com a equipe.",
    // Tokens: {empreendimento} {planta} (a planta só entra se o visitante escolher uma) {link}
    mensagemEmpreendimento: "[TROCAR] Olá! Quero saber mais sobre o empreendimento {empreendimento}.{planta} {link}",
    mensagemUnidade: "[TROCAR] Olá! Tenho interesse em uma unidade do {empreendimento}. Pode me passar mais informações?",
    // Modo serviços — {detalhes} recebe as respostas do bloco de orçamento
    mensagemOrcamento: "[TROCAR] Olá! Gostaria de pedir um orçamento para a {nome}.{detalhes}",
    mensagemObra: "[TROCAR] Olá! Vi a obra {obra} no site e gostaria de conversar sobre um projeto parecido."
  },

  horarios: [
    { dias: "[TROCAR] Segunda a sexta", horas: "[TROCAR] 8h às 18h" },
    { dias: "[TROCAR] Sábado", horas: "[TROCAR] 9h às 13h" }
  ],
  horariosSchema: [],                  // opcional. Ex.: [{ dias:["Monday"], abre:"08:00", fecha:"18:00" }]

  links: {
    instagram: "",                     // [TROCAR] (vazio = não mostra)
    googleMaps: "",                    // [TROCAR] link do Maps do escritório/estande. Vazio = busca pelo endereço
    mapaEmbed: ""                      // [TROCAR] só a URL do src do iframe "Incorporar mapa"
  },

  seo: {
    titulo: "[TROCAR] Nome da Construtora — Construtora em {cidade}/{uf}",
    descricao: "[TROCAR] Construtora em {cidade}/{uf}. Conheça os empreendimentos e as obras e fale com a equipe pelo WhatsApp.",
    urlSite: "",                       // [TROCAR] https://www.dominio.com.br/ — também vira o link do empreendimento na mensagem
    imagemOg: ""
  },

  /* Cores em HEX. Sugestões (copie e cole):
     GRAFITE       → primaria #1F2A30  destaque #C8962E  fundo #F4F5F4  texto #1A1F23
     AZUL-PETRÓLEO → primaria #123B47  destaque #D08A3C  fundo #F3F5F5  texto #142026
     VERDE-ESCURO  → primaria #1E3A2F  destaque #C9A227  fundo #F4F5F2  texto #18201B
     A primária precisa ser bem escura (recebe texto claro). O destaque é a cor dos botões e do progresso. */
  cores: { primaria: "#1F2A30", destaque: "#C8962E", fundo: "#F4F5F4", texto: "#1A1F23" },

  textos: {
    /* Tom sólido e transparente. Sem pressa, sem exagero de adjetivos. */
    hero: {
      empreendimentos: { titulo: "[TROCAR] Empreendimentos em *{cidade}*, do projeto à entrega", subtitulo: "[TROCAR] Conheça os lançamentos, acompanhe as obras e fale direto com a equipe da construtora." },
      servicos: { titulo: "[TROCAR] Obras residenciais e comerciais em *{cidade}*", subtitulo: "[TROCAR] Do orçamento à entrega, com acompanhamento em cada etapa. Conte o que você precisa." }
    },
    heroFoto: { src: "", alt: "[TROCAR] Descreva: fachada ou render do empreendimento principal", ilustrativa: true },

    botaoPrincipal: { empreendimentos: "Falar com a equipe pelo WhatsApp", servicos: "Pedir orçamento pelo WhatsApp" },
    botaoCurto: { empreendimentos: "Falar com a equipe", servicos: "Pedir orçamento" },

    botaoVerEmpreendimento: "Ver empreendimento",

    empreendimentosTitulo: "Nossos *empreendimentos*",
    empreendimentosIntro: "[TROCAR] Lançamentos, obras em andamento e imóveis prontos para morar.",
    vazioTitulo: "Nenhum empreendimento com esses filtros",
    vazioTexto: "Fale com a equipe e conte o que você procura.",
    catalogoVazioTitulo: "Novos empreendimentos em breve",
    catalogoVazioTexto: "[TROCAR] Fale com a equipe para saber dos próximos lançamentos.",

    obraTitulo: "Acompanhe a *obra*",
    obraIntro: "[TROCAR] Etapas e fotos atualizadas pela equipe técnica.",

    servicosTitulo: "O que a construtora *faz*",
    servicosIntro: "[TROCAR] Só os serviços que a empresa executa.",
    portfolioTitulo: "Obras *realizadas*",
    portfolioIntro: "[TROCAR] Obras exibidas com autorização dos clientes.",
    comoTitulo: "Como *trabalhamos*",
    comoIntro: "Quatro etapas, do primeiro contato à entrega.",

  el.append(waIcon(), h('span', null, porModo(tx.botaoCurto)), h('span', { class: 'vh' }, ' (abre o WhatsApp em outra aba)'));
  const heroEl = $('#hero');
  if ('IntersectionObserver' in window && heroEl) new IntersectionObserver(([e]) => { if (e.isIntersecting) el.removeAttribute('data-visivel'); else el.setAttribute('data-visivel', ''); }, { threshold: 0.1 }).observe(heroEl);
  else el.setAttribute('data-visivel', '');
}

/* ---------- painel: fechar, voltar, link direto ---------- */
function iniciarPainel() {
  const d = dlg();
  d.addEventListener('click', e => { if (e.target === d) d.close(); });
  d.addEventListener('keydown', e => {
    if (e.target.closest('input,select,textarea,[role=tab]')) return;
    if (e.key === 'ArrowRight') { const b = d.querySelector('.gal-nav--prox'); if (b) b.click(); }
    if (e.key === 'ArrowLeft') { const b = d.querySelector('.gal-nav--ant'); if (b) b.click(); }
  });
  d.addEventListener('close', () => {
    if (history.state && history.state.painel) history.back();
    else if (location.hash.startsWith('#empreendimento-')) history.replaceState(null, '', location.pathname + location.search);
    waDinamicos.splice(0, waDinamicos.length, ...waDinamicos.filter(l => document.body.contains(l.a) && !d.contains(l.a)));
  });
  const doHash = () => {
    const m = location.hash.match(/^#empreendimento-(.+)$/);
    if (m && MODO === 'empreendimentos') { const e = empreendimentosBase().find(x => slugEmp(x) === m[1]); if (e) abrirEmp(e, { semHistorico: true }); }
    else if (d.open) d.close();
  };
  addEventListener('popstate', doHash);
  doHash();
}

/* ---------- SEO: head + JSON-LD ---------- */
function metaSet(sel, attr, val) { const m = $(sel); if (m && val) m.setAttribute(attr, val); }
function seo() {
  const s = C.seo, titulo = fill(s.titulo), desc = fill(s.descricao);
  document.title = titulo;
  metaSet('meta[name="description"]', 'content', desc);
  metaSet('meta[property="og:title"]', 'content', titulo);
  metaSet('meta[property="og:description"]', 'content', desc);
  metaSet('meta[property="og:site_name"]', 'content', C.negocio.nome);
  if (s.urlSite) { metaSet('link[rel="canonical"]', 'href', s.urlSite); metaSet('meta[property="og:url"]', 'content', s.urlSite); }
  if (s.imagemOg) metaSet('meta[property="og:image"]', 'content', s.imagemOg);
}
function jsonld() {
  const n = C.negocio, abs = u => /^https?:\/\//.test(u || '') ? u : undefined;
  const horas = (C.horariosSchema || []).filter(x => x && x.abre && x.fecha && (x.dias || []).length).map(x => ({ '@type': 'OpeningHoursSpecification', dayOfWeek: x.dias, opens: x.abre, closes: x.fecha }));
  const empresa = {
    '@type': n.tipoSchema || 'GeneralContractor', '@id': (abs(C.seo.urlSite) || '') + '#construtora',
    name: n.nome, description: fill(C.seo.descricao), url: abs(C.seo.urlSite), image: abs(C.seo.imagemOg) || abs((tx.heroFoto || {}).src),
    telephone: numeroPendente ? undefined : '+' + numero, email: C.contato.email ? limpo(C.contato.email) : undefined,
    address: { '@type': 'PostalAddress', streetAddress: n.rua, addressLocality: n.cidade, addressRegion: n.uf, postalCode: n.cep, addressCountry: 'BR' },
    geo: n.coordenadas ? { '@type': 'GeoCoordinates', latitude: n.coordenadas.lat, longitude: n.coordenadas.lng } : undefined,
    hasMap: mapsUrl(), openingHoursSpecification: horas.length ? horas : undefined, sameAs: [C.links.instagram].filter(Boolean),
    makesOffer: MODO === 'servicos' && on('jsonLdItens') ? (C.servicos || []).filter(s => s && s.oferece !== false).map(s => ({ '@type': 'Offer', itemOffered: { '@type': 'Service', name: s.nome } })) : undefined
  };
  if (!empresa.sameAs.length) delete empresa.sameAs;
  const grafo = [empresa];
  if (MODO === 'empreendimentos' && on('jsonLdItens')) empreendimentosBase().filter(e => !e.exemplo && !legalPendente(e)).forEach(e => {
    const imgs = (e.imagens || []).map(i => abs(i && i.src)).filter(Boolean);
    const p = { '@type': 'Product', name: limpo(e.nome), description: limpo(e.descricao) || undefined, category: TIPOLOGIA[e.tipologia] || limpo(e.tipologia), image: imgs.length ? imgs : undefined, url: linkEmp(e) || undefined,
      brand: { '@id': empresa['@id'] },
      additionalProperty: [['Bairro', e.bairro], ['Cidade', e.cidade], ['Status', STATUS[e.status]], ['Previsão de entrega', e.status !== 'pronto' ? e.previsaoEntrega : '']].filter(x => limpo(x[1])).map(([k, v]) => ({ '@type': 'PropertyValue', name: k, value: limpo(v) })) };
    if (e.valor && numOk(e.valor.aPartirDe)) p.offers = { '@type': 'Offer', price: e.valor.aPartirDe, priceCurrency: 'BRL', description: limpo(e.valor.condicoes) || undefined, availability: 'https://schema.org/InStock', seller: { '@id': empresa['@id'] } };
    grafo.push(p);
  });
  const s = h('script', { type: 'application/ld+json' }); s.textContent = JSON.stringify({ '@context': 'https://schema.org', '@graph': grafo }); document.head.append(s);
}

/* ---------- comportamentos ---------- */
function comportamentos() {
  const t = $('#topo');
  let rafId = 0;
  const atualiza = () => { rafId = 0; if (window.scrollY > 12) t.setAttribute('data-solido', ''); else t.removeAttribute('data-solido'); };
  atualiza();
  addEventListener('scroll', () => { if (!rafId) rafId = requestAnimationFrame(atualiza); }, { passive: true });
  const els = document.querySelectorAll('.rev');
  if ('IntersectionObserver' in window && !reduzMovimento && els.length) {
    document.documentElement.classList.add('rev-on');
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -6% 0px', threshold: 0.05 });
    els.forEach(el => io.observe(el));
  }
}

/* ---------- pendências [TROCAR] ---------- */
function nosComMarca(raiz) {
  const w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement && /^(SCRIPT|STYLE|NOSCRIPT|OPTION)$/.test(n.parentElement.tagName) ? NodeFilter.FILTER_REJECT : MARCA.test(n.nodeValue) ? (MARCA.lastIndex = 0, NodeFilter.FILTER_ACCEPT) : NodeFilter.FILTER_SKIP) });
  const nos = []; while (w.nextNode()) nos.push(w.currentNode); return nos;
}
function marcarPendencias(raiz) {
  nosComMarca(raiz).forEach(n => {
    const partes = n.nodeValue.split(MARCA), f = document.createDocumentFragment();
    partes.forEach((p, i) => { if (i) f.append(h('mark', { class: 'pend' }, 'Trocar')); if (p) f.append(p.replace(/^ /, i ? '' : ' ')); });
    n.replaceWith(f);
  });
}
function limparMarcas(raiz) { nosComMarca(raiz).forEach(n => { n.nodeValue = n.nodeValue.replace(MARCA, '').replace(/^\s+/, ''); }); }
function pendencias() {
  const total = nosComMarca(document.body).reduce((s, n) => s + n.nodeValue.split(MARCA).length - 1, 0);
  if (modoLimpo) { limparMarcas(document.body); document.title = limpo(document.title); }
  else if (previa) marcarPendencias(document.body);
  [gradeEmp, gradeObras].filter(Boolean).forEach(g => { if (previa || modoLimpo) new MutationObserver(() => { previa ? marcarPendencias(g) : limparMarcas(g); }).observe(g, { childList: true }); });
  const lista = MODO === 'empreendimentos' ? (C.empreendimentos || []) : (C.obras || []);
  const exemplos = lista.filter(x => x && x.exemplo).length;
  const bloqueados = MODO === 'empreendimentos' ? (C.empreendimentos || []).filter(e => e && legalPendente(e)).length : 0;
  const numPend = numeroPendente ? 1 : 0;
  const fotos = document.querySelectorAll('img[data-pendente]').length;
  if (total || fotos || numPend || exemplos) {
    console.warn('[template] Pendências antes de publicar →', { textos: total, imagens: fotos, whatsapp: numPend, exemplos, empreendimentosSemRegistro: bloqueados });
    document.head.append(h('meta', { name: 'robots', content: 'noindex, nofollow' }));
  }
  if (previa) {
    let k = -1;
    const partes = [total + ' [TROCAR]', fotos + ' imagens', exemplos ? exemplos + ' exemplos' : '', bloqueados ? bloqueados + ' sem registro' : '', numPend ? 'WhatsApp' : ''].filter(Boolean);
    const bt = h('button', { type: 'button', class: 'previa', 'aria-label': 'Prévia do template: ir para a próxima pendência' }, h('i'),
      h('span', null, 'Prévia (' + (MODO === 'servicos' ? 'serviços' : 'empreendimentos') + '): ' + partes.join(' · '), h('span', { class: 'previa-longo' }, ' — toque para ir à próxima')));
    bt.addEventListener('click', () => {
      const m = [...document.querySelectorAll('main mark.pend, footer mark.pend')].filter(x => x.offsetParent); if (!m.length) return;
      document.querySelectorAll('.pend-foco').forEach(x => x.classList.remove('pend-foco'));
      k = (k + 1) % m.length; const alvo = m[k];
      alvo.scrollIntoView({ block: 'center', behavior: reduzMovimento ? 'auto' : 'smooth' });
      alvo.parentElement && alvo.parentElement.classList.add('pend-foco');
      setTimeout(() => alvo.parentElement && alvo.parentElement.classList.remove('pend-foco'), 1800);
    });
    document.body.append(bt);
  }
}

/* ---------- montagem ---------- */
function montar() {
  aplicarTema(); seo();
  const main = $('#conteudo');
  const partes = MODO === 'empreendimentos'
    ? [hero(), secEmpreendimentos(), secAcompanheObra(), secDiferenciais(), secSobre(), secAvaliacoes(), secFaq(), secLocal(), ctaFinal()]
    : [hero(), secServicos(), secPortfolio(), secComoTrabalhamos(), secOrcamento(), secDiferenciais(), secSobre(), secAvaliacoes(), secFaq(), secLocal(), ctaFinal()];
  let alt = false;
  partes.filter(Boolean).forEach(p => { const t = p.dataset && p.dataset.tom; if (t === 'auto') { if (alt) p.classList.add('sec--tinta'); alt = !alt; } else if (t) alt = false; main.append(p); });
  const navMap = MODO === 'empreendimentos'
    ? [['empreendimentos', 'empreendimentos'], ['obra', 'obra'], ['sobre', 'sobre'], ['perguntas', 'faq']]
    : [['servicos', 'servicos'], ['portfolio', 'portfolio'], ['sobre', 'sobre'], ['perguntas', 'faq']];
  cabecalho(navMap.filter(([id]) => $('#' + id)).map(([id, k]) => ({ id, label: tx.nav[k] })));
  rodape(); flutuante();
  if (gradeEmp) renderEmp();
  if (gradeObras) renderObras();
  jsonld(); comportamentos(); pendencias(); iniciarPainel();
}
if (numeroPendente) console.warn('[template] CONFIG.whatsapp.numero ainda é o número de exemplo.');
montar();
})();
</script>
