<style>
/* ==========================================================================
   Tokens. As 4 cores vêm do CONFIG.cores; o resto é derivado delas.
   primaria = azul, verde ou terroso (botões, destaques). secundaria = tom claro de apoio (fundos).
   ========================================================================== */
:root{
  --primaria:#1D4F6E; --secundaria:#EAF0F3; --fundo:#FFFFFF; --texto:#16212B;
  --cta-texto:#FFFFFF;

  --primaria-escura:color-mix(in oklab,var(--primaria) 72%,#000);
  --superficie:color-mix(in oklab,var(--secundaria) 70%,var(--fundo));
  --tinta:var(--texto);
  --tinta-suave:color-mix(in oklab,var(--texto) 72%,var(--fundo));
  --linha:color-mix(in oklab,var(--texto) 12%,var(--fundo));
  --linha-forte:color-mix(in oklab,var(--texto) 28%,var(--fundo));
  --foco:var(--primaria);

  --display:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --gutter:clamp(1.25rem,5vw,3rem);
  --max:1240px;
  --sec:clamp(4rem,8vw,7rem);
  --raio:14px;
}

/* ==========================================================================
   Base
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:5rem;accent-color:var(--primaria);color-scheme:light}
body{margin:0;background:var(--fundo);color:var(--tinta);font:400 1.0625rem/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scrollbar-color:color-mix(in oklab,var(--primaria) 45%,var(--fundo)) var(--superficie)}
img,svg{display:block;max-width:100%}
img{height:auto}
h1,h2,h3,p,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em}
button,input,select{font:inherit;color:inherit}
::selection{background:var(--primaria);color:var(--cta-texto)}
input,select{caret-color:var(--primaria)}
:focus-visible{outline:3px solid var(--foco);outline-offset:3px;border-radius:6px}
section[id]{scroll-margin-top:4.75rem}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pular{position:fixed;left:1rem;top:-4rem;z-index:100;background:var(--tinta);color:var(--fundo);padding:.75rem 1.1rem;border-radius:10px;transition:top .2s var(--ease)}
.pular:focus{top:1rem}
.container{width:min(100% - 2*var(--gutter),var(--max));margin-inline:auto}
.ico{display:inline-flex;width:1.2em;height:1.2em;flex:none}
.ico svg{width:100%;height:100%}
.tnum{font-variant-numeric:tabular-nums}

h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;color:var(--tinta);letter-spacing:-.02em}
h1 em,h2 em{font-style:normal;color:var(--primaria)}
h2{font-size:clamp(1.85rem,1.25rem + 2.3vw,2.9rem);line-height:1.1}
h3{font-size:1.15rem;line-height:1.3;letter-spacing:-.01em}
p{text-wrap:pretty}

/* ==========================================================================
   Botões
   ========================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:3.1rem;padding:.75rem 1.4rem;border-radius:10px;border:1.5px solid transparent;font-family:var(--sans);font-weight:600;font-size:1rem;line-height:1.2;text-align:center;text-decoration:none;cursor:pointer;transition:background-color .2s var(--ease),color .2s,border-color .2s,transform .2s var(--ease)}
.btn .ico{width:1.3em;height:1.3em}
.btn--cta{background:var(--primaria);color:var(--cta-texto)}
.btn--claro{background:var(--fundo);color:var(--primaria-escura)}
.btn--linha{background:transparent;border-color:var(--linha-forte);color:var(--tinta)}
.btn--sm{min-height:2.75rem;padding:.5rem 1rem;font-size:.95rem}
.btn--lg{min-height:3.5rem;padding:.95rem 1.75rem;font-size:1.04rem}
.btn--bloco{width:100%}
.btn:active{transform:scale(.985)}
@media (hover:hover){
  .btn--cta:hover{background:var(--primaria-escura)}
  .btn--claro:hover{background:var(--secundaria)}
  .btn--linha:hover{border-color:var(--primaria);color:var(--primaria)}
}
.link-seta{display:inline-flex;align-items:center;gap:.45rem;font-weight:600;color:var(--primaria);text-decoration:none;border:0;background:none;padding:.35rem 0;cursor:pointer;border-bottom:1.5px solid currentColor}
.link-seta .ico{width:1em;height:1em;transition:transform .3s var(--ease)}
@media (hover:hover){.link-seta:hover .ico{transform:translateX(4px)}}

/* ==========================================================================
   Cabeçalho
   ========================================================================== */
.topo{position:fixed;inset:0 0 auto 0;z-index:50;background:color-mix(in oklab,var(--fundo) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:box-shadow .3s var(--ease)}
.topo[data-solido]{box-shadow:0 1px 0 var(--linha)}
.topo-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:4.25rem}
.marca{display:flex;align-items:center;gap:.6rem;min-width:0;flex:1 1 auto;font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:-.02em;text-decoration:none;white-space:nowrap}
.marca .nome{overflow:hidden;text-overflow:ellipsis}
.marca .selo{flex:none;display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:9px;background:var(--primaria);color:var(--cta-texto)}
.marca .selo .ico{width:1.15rem;height:1.15rem}
.nav{display:none;gap:1.75rem;font-size:.97rem;font-weight:500}
.nav a{text-decoration:none;color:var(--tinta-suave);padding:.4rem 0;border-bottom:1.5px solid transparent;transition:color .2s,border-color .2s}
@media (hover:hover){.nav a:hover{color:var(--tinta);border-bottom-color:var(--primaria)}}
.topo .btn{white-space:nowrap;flex:none}
@media (max-width:380px){.marca{font-size:1rem}.marca .selo{display:none}.topo .btn--sm{padding-inline:.8rem;gap:.45rem}}
@media (min-width:1080px){.nav{display:flex}.marca{flex:0 1 auto}}

/* ==========================================================================
   Hero — curto, para o catálogo aparecer logo
   ========================================================================== */
.hero{background:var(--superficie);padding-top:calc(4.25rem + clamp(2.25rem,5vw,4.5rem));padding-bottom:clamp(2.75rem,6vw,4.5rem)}
.hero-in{display:grid;gap:1.4rem;justify-items:start}
.hero h1{font-size:clamp(2.3rem,1.4rem + 3.8vw,4.2rem);line-height:1.04;letter-spacing:-.035em;max-width:19ch}
.hero-lead{font-size:clamp(1.08rem,1rem + .35vw,1.22rem);color:var(--tinta-suave);max-width:46ch}
.hero-acoes{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.5rem;margin-top:.25rem}
.atalhos{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem}
.hero-resp{font-size:.92rem;color:var(--tinta-suave)}
@media (max-width:560px){.hero-acoes .btn--cta{width:100%}}
@media (prefers-reduced-motion:no-preference){
  .hero-in>*{animation:subir .8s var(--ease) both}
  .hero-in>:nth-child(2){animation-delay:.08s}
  .hero-in>:nth-child(3){animation-delay:.16s}
  .hero-in>:nth-child(4){animation-delay:.24s}
  @keyframes subir{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
}

/* ==========================================================================
   Seções
   ========================================================================== */
.sec{padding-block:var(--sec)}
.sec--tinta{background:var(--superficie)}
.sec--escura{background:var(--primaria);color:var(--cta-texto);--foco:var(--cta-texto)}
.sec--escura h2{color:var(--cta-texto)}
.sec-head{display:grid;gap:.9rem;max-width:46rem;margin-bottom:clamp(2rem,4vw,3rem)}
.sec-head .lead{color:var(--tinta-suave);font-size:1.08rem;max-width:54ch}

/* Filtros */
.filtros-barra{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem 1.5rem;margin-bottom:1.25rem}
.abre-filtros{display:none}
.abre-wrap{margin-bottom:1rem}
@media (min-width:760px){.abre-wrap{display:none}}
.vazio[hidden]{display:none}
.filtros{display:grid;gap:1rem 1.25rem;padding:1.25rem;border:1px solid var(--linha);border-radius:var(--raio);background:var(--fundo);margin-bottom:1.5rem}
.sec--tinta .filtros{border-color:transparent}
.filtros-grid{display:grid;gap:1rem 1.25rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr));align-items:end}
.filtros-grid>.grupo{grid-column:1/-1}
@media (max-width:759px){.filtros-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.filtros-grid{grid-template-columns:minmax(16rem,1.3fr) repeat(5,minmax(0,1fr))}.filtros-grid>.grupo{grid-column:auto}}
.campo{display:grid;gap:.35rem;min-width:0}
.campo label,.grupo legend{font-size:.85rem;font-weight:600;color:var(--tinta)}
.campo select{width:100%;min-width:0;min-height:2.9rem;padding:.5rem .8rem;background:var(--fundo);border:1.5px solid var(--linha-forte);border-radius:10px;transition:border-color .2s}
.campo select:hover:not(:disabled){border-color:var(--primaria)}
.campo select:disabled{opacity:.55;cursor:not-allowed}
.grupo{border:0;margin:0;padding:0;min-width:0}
.grupo legend{padding:0;margin-bottom:.35rem}
.seg{display:flex;background:var(--superficie);border-radius:10px;padding:.25rem;gap:.25rem}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.seg span{display:flex;align-items:center;justify-content:center;min-height:2.4rem;padding:.35rem .6rem;border-radius:8px;font-weight:500;font-size:.95rem;cursor:pointer;color:var(--tinta-suave);transition:background-color .2s,color .2s}
.seg input:checked+span{background:var(--fundo);color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:3px solid var(--foco);outline-offset:1px}
.dica{font-size:.85rem;color:var(--tinta-suave);grid-column:1/-1}
.contador{font-weight:600}
.limpar{border:0;background:none;padding:.4rem 0;color:var(--primaria);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:.2em}
.limpar[hidden]{display:none}
@media (max-width:759px){
  .abre-filtros{display:inline-flex}
  .filtros[data-fechado]{display:none}
}

/* Cartões de imóvel */
.grade{display:grid;gap:clamp(1.5rem,3vw,2.25rem);grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr))}
.imovel{display:flex;flex-direction:column;background:var(--fundo);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
.sec--tinta .imovel{border-color:transparent}
@media (hover:hover){.imovel:hover{box-shadow:0 18px 36px -22px rgba(0,0,0,.35);transform:translateY(-2px)}}
.imovel-foto{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--superficie);display:block;width:100%;border:0;padding:0;margin:0}
button.imovel-foto{cursor:pointer}
.imovel-foto img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
@media (hover:hover){button.imovel-foto:hover img{transform:scale(1.04)}}
.selos{position:absolute;top:.75rem;left:.75rem;display:flex;flex-wrap:wrap;gap:.35rem}
.selo-tag{display:inline-flex;align-items:center;min-height:1.6rem;padding:.15rem .6rem;border-radius:6px;font-size:.78rem;font-weight:600;letter-spacing:.02em;background:var(--fundo);color:var(--tinta)}
.selo-tag--fin{background:var(--primaria);color:var(--cta-texto)}
.selo-tag--status{background:var(--tinta);color:var(--fundo)}
.imovel-corpo{display:flex;flex-direction:column;gap:.55rem;padding:1.15rem 1.25rem 1.25rem;flex:1}
.valor{font-family:var(--display);font-weight:700;font-size:1.45rem;letter-spacing:-.01em;color:var(--tinta);font-variant-numeric:proportional-nums;font-feature-settings:"tnum" 0}
.valor small{font-family:var(--sans);font-weight:500;font-size:.9rem;color:var(--tinta-suave);letter-spacing:0}
.taxas{font-size:.88rem;color:var(--tinta-suave)}
.imovel h3{font-family:var(--sans);font-weight:600;font-size:1.05rem;letter-spacing:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.local-tag{display:flex;align-items:center;gap:.4rem;font-size:.95rem;color:var(--tinta-suave)}
.local-tag .ico{color:var(--primaria)}
.carac{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;padding-block:.7rem;margin-block:.2rem;border-block:1px solid var(--linha);font-size:.93rem}
.carac li{display:inline-flex;align-items:center;gap:.4rem}
.carac .ico{color:var(--tinta-suave)}
.ident{font-size:.82rem;color:var(--tinta-suave)}
.imovel-acoes{display:grid;gap:.5rem;margin-top:auto;padding-top:.5rem}
.imovel--indisp{opacity:.62}
.imovel--indisp .imovel-foto img{filter:grayscale(.8)}
.indisp-txt{font-weight:600;color:var(--tinta-suave);text-align:center;padding:.6rem;border:1.5px dashed var(--linha-forte);border-radius:10px}
.exemplo{font-size:.8rem;color:var(--tinta-suave)}

/* Vazio */
.vazio{display:grid;justify-items:center;gap:1rem;text-align:center;padding:clamp(2.5rem,6vw,4rem) 1.5rem;border:1.5px dashed var(--linha-forte);border-radius:var(--raio);background:var(--fundo)}
.vazio h3{font-size:1.4rem}
.vazio p{color:var(--tinta-suave);max-width:44ch}

/* Destaques */
.destaques{display:grid;gap:clamp(1.5rem,3vw,2.25rem);grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr))}
.destaques .imovel-foto{aspect-ratio:16/10}
.destaques .valor{font-size:1.7rem}

/* Detalhe do imóvel */
.detalhe{border:0;padding:0;width:min(1120px,100% - 2rem);max-width:none;max-height:92vh;border-radius:18px;background:var(--fundo);color:var(--tinta);overflow:auto;box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
.detalhe::backdrop{background:rgba(10,16,22,.62)}
.det-topo{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem 1rem .75rem 1.5rem;background:color-mix(in oklab,var(--fundo) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.det-topo .ident{font-size:.9rem}
.fechar{display:grid;place-items:center;width:2.75rem;height:2.75rem;border-radius:50%;border:1px solid var(--linha-forte);background:var(--fundo);cursor:pointer;flex:none}
.fechar:hover{border-color:var(--primaria)}
.det-grid{display:grid;gap:1.5rem 2.5rem;padding:1.5rem}
@media (min-width:900px){.det-grid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);padding:2rem}}
.galeria-det{display:grid;gap:.6rem;align-content:start}
.gal-principal{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--superficie)}
.gal-principal img{width:100%;height:100%;object-fit:cover}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:2.75rem;height:2.75rem;border-radius:50%;border:0;background:color-mix(in oklab,var(--fundo) 90%,transparent);color:var(--tinta);cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.gal-nav--ant{left:.75rem}.gal-nav--prox{right:.75rem}
.gal-cont{position:absolute;right:.75rem;bottom:.75rem;padding:.2rem .6rem;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-size:.82rem}
.miniaturas{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem;scrollbar-width:thin}
.mini{flex:none;width:5.5rem;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--superficie);cursor:pointer;opacity:.75;transition:opacity .2s,border-color .2s}
.mini img{width:100%;height:100%;object-fit:cover}
.mini[aria-current="true"]{border-color:var(--primaria);opacity:1}
.det-info{display:grid;gap:1rem;align-content:start}
.det-info h2{font-size:clamp(1.4rem,1.2rem + .8vw,1.9rem)}
.det-info .valor{font-size:2rem}
.det-carac{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem 1rem;padding:1rem 0;border-block:1px solid var(--linha)}
.det-carac div{display:flex;align-items:center;gap:.55rem}
.det-carac .ico{color:var(--primaria);width:1.35rem;height:1.35rem}
.det-desc{color:var(--tinta-suave)}
.det-local{display:grid;gap:.75rem;padding-top:.5rem}
.det-local h3{font-size:1rem}
.det-mapa{aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--superficie)}
.det-mapa iframe{width:100%;height:100%;border:0;display:block}
.det-acoes{display:grid;gap:.6rem}
@media (max-width:640px){
  .detalhe{width:100%;max-height:none;height:100%;border-radius:0}
  .det-acoes{position:sticky;bottom:0;background:var(--fundo);padding:.75rem 0;margin-inline:-1.5rem;padding-inline:1.5rem;border-top:1px solid var(--linha)}
}

/* Como funciona */
.passos{display:grid;gap:1rem}
.passo{display:grid;gap:.6rem;align-content:start;padding:1.6rem;border-radius:var(--raio);background:var(--superficie)}
.sec--tinta .passo{background:var(--fundo)}
.passo-n{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--primaria);color:var(--cta-texto);font-family:var(--display);font-weight:700;margin-bottom:.35rem}
.passo p{color:var(--tinta-suave);max-width:36ch}
@media (min-width:860px){.passos{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Proprietário */
.dono{display:grid;gap:1.5rem 3rem;align-items:center}
.dono p{color:color-mix(in oklab,var(--cta-texto) 85%,transparent);max-width:52ch;font-size:1.08rem}
@media (min-width:900px){.dono{grid-template-columns:minmax(0,1.4fr) auto}}

/* Sobre */
.sobre-grid{display:grid;gap:clamp(2rem,5vw,4rem);align-items:center}
.sobre-foto{aspect-ratio:4/5;border-radius:var(--raio);overflow:hidden;max-width:24rem;background:var(--superficie)}
.sobre-foto img{width:100%;height:100%;object-fit:cover}
.sobre-texto{display:grid;gap:1.1rem;max-width:58ch}
.sobre-texto p{color:var(--tinta-suave);font-size:1.08rem}
.creci{display:inline-flex;gap:.5rem;align-items:center;padding:.5rem .9rem;border-radius:8px;background:var(--superficie);font-weight:600;width:fit-content}
.sec--tinta .creci{background:var(--fundo)}
.creci .ico{color:var(--primaria)}
@media (min-width:900px){.sobre-grid{grid-template-columns:minmax(0,4fr) minmax(0,7fr)}}

/* Bairros */
.bairros{display:flex;flex-wrap:wrap;gap:.6rem}
.bairro{display:inline-flex;align-items:center;gap:.45rem;min-height:2.75rem;padding:.45rem 1.05rem;border-radius:999px;border:1.5px solid var(--linha-forte);background:var(--fundo);font-weight:500;color:var(--tinta)}
button.bairro{cursor:pointer;transition:border-color .2s,color .2s}
@media (hover:hover){button.bairro:hover{border-color:var(--primaria);color:var(--primaria)}}
.bairro .ico{color:var(--primaria)}

/* Avaliações */

.faq-lista summary::after{content:"";flex:none;width:1rem;height:1rem;background:
  linear-gradient(var(--primaria),var(--primaria)) center/100% 2px no-repeat,
  linear-gradient(var(--primaria),var(--primaria)) center/2px 100% no-repeat;transition:transform .4s var(--ease)}

@media (hover:hover){.faq-lista summary:hover{color:var(--primaria)}}

/* ---------- construtor de DOM (escapa tudo, sem innerHTML com dados) ---------- */

/* ---------- cores: tema, contraste ---------- */
const HEX = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
const rgb = x => { let s = x.replace('#', ''); if (s.length === 3) s = [...s].map(c => c + c).join(''); const n = parseInt(s, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const lum = a => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(a[0]) + .7152 * f(a[1]) + .0722 * f(a[2]); };
const ratio = (a, b) => { const x = lum(rgb(a)), y = lum(rgb(b)); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const toHex = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return toHex(A.map((v, i) => v * (1 - t) + B[i] * t)); };
const cor = { primaria: '#1D4F6E', secundaria: '#EAF0F3', fundo: '#FFFFFF', texto: '#16212B' };
Object.keys(cor).forEach(k => { if (HEX.test(C.cores[k] || '')) cor[k] = C.cores[k]; else console.error('[template] cor inválida em CONFIG.cores.' + k + ' — use HEX, ex. #1D4F6E'); });
const textoSobre = bg => ratio(bg, cor.fundo) >= ratio(bg, cor.texto) ? cor.fundo : cor.texto;

function aplicarTema() {
  const r = document.documentElement.style;
  r.setProperty('--primaria', cor.primaria); r.setProperty('--secundaria', cor.secundaria);
  r.setProperty('--fundo', cor.fundo); r.setProperty('--texto', cor.texto);
  const ctaTxt = textoSobre(cor.primaria);
  r.setProperty('--cta-texto', ctaTxt);
  const sup = mix(cor.fundo, cor.secundaria, .7), suave = mix(cor.fundo, cor.texto, .72);
  const avisos = [];
  if (ratio(cor.texto, cor.fundo) < 4.5) avisos.push('texto x fundo');
  if (ratio(cor.primaria, ctaTxt) < 4.5) avisos.push('botões (primária) — escureça a primária');
  if (ratio(cor.primaria, cor.fundo) < 4.5) avisos.push('links na primária sobre o fundo');
  if (ratio(suave, sup) < 4.5) avisos.push('texto secundário sobre a secundária — clareie a secundária');
  if (avisos.length) console.warn('[template] Contraste abaixo de 4,5:1 em: ' + avisos.join('; '));
  const tc = $('meta[name="theme-color"]'); if (tc) tc.content = cor.primaria;
  const fav = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${cor.primaria}"/><path d="M16 32 32 18l16 14v15H38V37H26v10H16z" fill="${ctaTxt}"/></svg>`;
  const link = $('link[rel="icon"]'); if (link) link.href = 'data:image/svg+xml,' + encodeURIComponent(fav);
}

  el.append(waIcon(), h('span', null, C.textos.botaoCurto), h('span', { class: 'vh' }, ' (abre o WhatsApp em outra aba)'));
  const heroEl = $('#hero');
  if ('IntersectionObserver' in window && heroEl) new IntersectionObserver(([e]) => { if (e.isIntersecting) el.removeAttribute('data-visivel'); else el.setAttribute('data-visivel', ''); }, { threshold: 0.1 }).observe(heroEl);
  else el.setAttribute('data-visivel', '');
}

/* ---------- SEO: head + JSON-LD (empresa + cada imóvel disponível) ---------- */
function metaSet(sel, attr, val) { const m = $(sel); if (m && val) m.setAttribute(attr, val); }
function seo() {
  const s = C.seo, titulo = fill(s.titulo), desc = fill(s.descricao);
  document.title = titulo;
  metaSet('meta[name="description"]', 'content', desc);
  metaSet('meta[property="og:title"]', 'content', titulo);
  metaSet('meta[property="og:description"]', 'content', desc);
  metaSet('meta[property="og:site_name"]', 'content', C.negocio.nome);
  if (s.urlSite) { metaSet('link[rel="canonical"]', 'href', s.urlSite); metaSet('meta[property="og:url"]', 'content', s.urlSite); }
  if (s.imagemOg) metaSet('meta[property="og:image"]', 'content', s.imagemOg);
}
function jsonld() {
  const n = C.negocio, abs = u => /^https?:\/\//.test(u || '') ? u : undefined;
  const horas = (C.horariosSchema || []).filter(x => x && x.abre && x.fecha && (x.dias || []).length)
    .map(x => ({ '@type': 'OpeningHoursSpecification', dayOfWeek: x.dias, opens: x.abre, closes: x.fecha }));
  const agente = {
    '@type': 'RealEstateAgent', '@id': (abs(C.seo.urlSite) || '') + '#imobiliaria',
    name: n.nome, description: fill(C.seo.descricao), url: abs(C.seo.urlSite), image: abs(C.seo.imagemOg),
    telephone: numeroPendente ? undefined : '+' + numero, email: C.contato.email ? limpo(C.contato.email) : undefined,
    address: { '@type': 'PostalAddress', streetAddress: n.rua, addressLocality: n.cidade, addressRegion: n.uf, postalCode: n.cep, addressCountry: 'BR' },
    geo: n.coordenadas ? { '@type': 'GeoCoordinates', latitude: n.coordenadas.lat, longitude: n.coordenadas.lng } : undefined,
    hasMap: mapsUrl(), openingHoursSpecification: horas.length ? horas : undefined,
    sameAs: [C.links.instagram].filter(Boolean)
  };
  if (!agente.sameAs.length) delete agente.sameAs;
  const grafo = [agente];
  if (on('jsonLdImoveis') && on('catalogo')) baseCatalogo().filter(im => disponivel(im) && !im.exemplo).forEach(im => {
    const fotos = (im.fotos || []).map(f => abs(f && f.src)).filter(Boolean);
    const p = { '@type': 'Product', name: limpo(im.titulo), sku: limpo(im.codigo), description: limpo(im.descricao) || undefined, category: tipoNome(im.tipo), image: fotos.length ? fotos : undefined, url: linkImovel(im) || undefined };
    if (numOk(im.valor)) p.offers = { '@type': 'Offer', price: im.valor, priceCurrency: 'BRL', availability: im.status === 'reservado' ? 'https://schema.org/LimitedAvailability' : 'https://schema.org/InStock',
      businessFunction: im.finalidade === 'aluguel' ? 'http://purl.org/goodrelations/v1#LeaseOut' : 'http://purl.org/goodrelations/v1#Sell',
      priceSpecification: im.finalidade === 'aluguel' ? { '@type': 'UnitPriceSpecification', price: im.valor, priceCurrency: 'BRL', unitText: 'mês' } : undefined,
      seller: { '@id': agente['@id'] } };
    grafo.push(p);
  });
  const s = h('script', { type: 'application/ld+json' }); s.textContent = JSON.stringify({ '@context': 'https://schema.org', '@graph': grafo }); document.head.append(s);
}

/* ---------- comportamentos ---------- */
function comportamentos() {
  const t = $('#topo');
  let rafId = 0;
  const atualiza = () => { rafId = 0; if (window.scrollY > 12) t.setAttribute('data-solido', ''); else t.removeAttribute('data-solido'); };
  atualiza();
  addEventListener('scroll', () => { if (!rafId) rafId = requestAnimationFrame(atualiza); }, { passive: true });
  const els = document.querySelectorAll('.rev');
  if ('IntersectionObserver' in window && !reduzMovimento && els.length) {
    document.documentElement.classList.add('rev-on');
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -6% 0px', threshold: 0.05 });
    els.forEach(el => io.observe(el));
  }
}

/* ---------- pendências [TROCAR] ---------- */
function nosComMarca(raiz) {
  const w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement && /^(SCRIPT|STYLE|NOSCRIPT|OPTION)$/.test(n.parentElement.tagName) ? NodeFilter.FILTER_REJECT : MARCA.test(n.nodeValue) ? (MARCA.lastIndex = 0, NodeFilter.FILTER_ACCEPT) : NodeFilter.FILTER_SKIP) });
  const nos = []; while (w.nextNode()) nos.push(w.currentNode); return nos;
}
function marcarPendencias(raiz) {
  nosComMarca(raiz).forEach(n => {
    const partes = n.nodeValue.split(MARCA), f = document.createDocumentFragment();
    partes.forEach((p, i) => { if (i) f.append(h('mark', { class: 'pend' }, 'Trocar')); if (p) f.append(p.replace(/^ /, i ? '' : ' ')); });
    n.replaceWith(f);
  });
}
function limparMarcas(raiz) { nosComMarca(raiz).forEach(n => { n.nodeValue = n.nodeValue.replace(MARCA, '').replace(/^\s+/, ''); }); }
function pendencias() {
  const total = nosComMarca(document.body).reduce((s, n) => s + n.nodeValue.split(MARCA).length - 1, 0);
  if (modoLimpo) { limparMarcas(document.body); document.title = limpo(document.title); }
  else if (previa) marcarPendencias(document.body);
  // Novos cartões (filtros) também recebem as marcas
  if (grade && (previa || modoLimpo)) new MutationObserver(() => { previa ? marcarPendencias(grade) : limparMarcas(grade); }).observe(grade, { childList: true });
  const exemplos = (C.imoveis || []).filter(im => im && im.exemplo).length;
  const numPend = numeroPendente ? 1 : 0;
  const fotos = document.querySelectorAll('img[data-pendente]').length;
  if (total || fotos || numPend || exemplos) {
    console.warn('[template] Pendências antes de publicar →', { textos: total, fotos, whatsapp: numPend, imoveisExemplo: exemplos });
    document.head.append(h('meta', { name: 'robots', content: 'noindex, nofollow' }));
  }
  if (previa) {
    let k = -1;
    const bt = h('button', { type: 'button', class: 'previa', 'aria-label': 'Prévia do template: ir para a próxima pendência' }, h('i'),
      h('span', null, 'Prévia: ' + total + ' [TROCAR] · ' + fotos + ' fotos' + (exemplos ? ' · ' + exemplos + ' imóveis de exemplo' : '') + (numPend ? ' · WhatsApp' : ''), h('span', { class: 'previa-longo' }, ' — toque para ir à próxima')));
    bt.addEventListener('click', () => {
      const m = [...document.querySelectorAll('main mark.pend, footer mark.pend')].filter(x => x.offsetParent); if (!m.length) return;
      document.querySelectorAll('.pend-foco').forEach(x => x.classList.remove('pend-foco'));
      k = (k + 1) % m.length; const alvo = m[k];
      alvo.scrollIntoView({ block: 'center', behavior: reduzMovimento ? 'auto' : 'smooth' });
      alvo.parentElement && alvo.parentElement.classList.add('pend-foco');
      setTimeout(() => alvo.parentElement && alvo.parentElement.classList.remove('pend-foco'), 1800);
    });
    document.body.append(bt);
  }
}

/* ---------- montagem ---------- */
function montar() {
  aplicarTema(); seo();
  const main = $('#conteudo');
  const partes = [hero(), destaques(), catalogo(), comoFunciona(), proprietario(), sobre(), bairros(), avaliacoes(), faq(), localizacao(), ctaFinal()].filter(Boolean);
  let alt = false;
  partes.forEach(p => { const t = p.dataset && p.dataset.tom; if (t === 'auto') { if (alt) p.classList.add('sec--tinta'); alt = !alt; } else if (t) alt = false; main.append(p); });
  const nav = [['catalogo', 'catalogo'], ['como-funciona', 'comoFunciona'], ['anunciar', 'anunciar'], ['perguntas', 'faq']]
    .filter(([id]) => $('#' + id)).map(([id, k]) => ({ id, label: C.textos.nav[k] }));
  cabecalho(nav); rodape(); flutuante();
  if (grade) renderGrade();
  jsonld(); comportamentos(); pendencias();
  if (on('detalhe')) iniciarDetalhe();
}
if (numeroPendente) console.warn('[template] CONFIG.whatsapp.numero ainda é o número de exemplo.');
montar();
})();
</script>
