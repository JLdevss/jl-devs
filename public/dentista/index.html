:root {
  --primaria: #21463d;
  --secundaria: #d8e7d6;
  --fundo: #f8f6ef;
  --texto: #1c352f;
  --cta-texto: #fff;
  --tinta: color-mix(in srgb, var(--secundaria) 66%, var(--fundo));
  --papel: color-mix(in srgb, var(--fundo) 50%, white);
  --linha: color-mix(in srgb, var(--texto) 23%, var(--fundo));
  --suave: color-mix(in srgb, var(--texto) 82%, var(--fundo));
  --serif: 'Instrument Serif', Georgia, serif;
  --sans: 'Bricolage Grotesque', system-ui, sans-serif;
  --margem: clamp(1.15rem, 4.5vw, 4.25rem);
  --secao: clamp(4rem, 7vw, 7.25rem);
  --nav: 72px;
  --barra: 0px;
}
html:has(.barra-campos) { --barra: 38px; }
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav) + var(--barra) + 1.25rem); }
body { margin: 0; background: var(--fundo); color: var(--texto); font: 500 1rem/1.6 var(--sans); }
body:has(dialog[open]) { overflow: hidden; }
[hidden] { display: none !important; }
img { display: block; width: 100%; height: auto; }
h1, h2, h3, p, ul, ol, dl, dd, figure, blockquote { margin: 0; }
h1, h2, h3 { font: 400 clamp(2.1rem, 4vw, 3.5rem)/.98 var(--serif); letter-spacing: -.025em; }
h2 { font-size: clamp(3rem, 6.4vw, 6rem); text-wrap: balance; }
ul, ol { padding: 0; list-style: none; }
a { color: inherit; text-underline-offset: .2em; }
button, select, input { color: inherit; font: inherit; }
button, summary { cursor: pointer; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
::selection { background: var(--secundaria); color: var(--texto); }
.container { width: min(calc(100% - 2 * var(--margem)), 83rem); margin-inline: auto; }
.ico { display: inline-flex; flex: none; width: 1.25em; height: 1.25em; }
.ico svg { width: 100%; height: 100%; }
.vh, .pular:not(:focus) { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.pular:focus { position: fixed; z-index: 99; top: 1rem; left: 1rem; color: var(--texto); background: var(--papel); padding: .65rem 1rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .62rem; min-height: 3.08rem; padding: .65rem 1.13rem; border: 1px solid transparent; border-radius: 99px; text-decoration: none; text-align: center; font-size: .84rem; font-weight: 800; line-height: 1.25; transition: background-color .18s, color .18s, transform .18s; }
.btn--lg { min-height: 3.42rem; padding-inline: 1.3rem; }
.btn--cta { color: var(--cta-texto); background: var(--primaria); }
.btn--cta:hover { background: color-mix(in srgb, var(--primaria) 83%, black); }
.btn--claro { background: var(--papel); color: var(--texto); }
.btn--linha { border-color: currentColor; background: transparent; }
.btn--linha:hover, .btn--claro:hover { background: var(--secundaria); color: var(--texto); }
.link-seta, .serv-link { display: inline-flex; align-items: center; gap: .53rem; background: transparent; border: 0; min-height: 2.75rem; padding: 0; color: inherit; font-size: .87rem; font-weight: 800; text-decoration: underline; }
.link-seta .ico, .serv-link .ico { transition: transform .2s; }
.link-seta:hover .ico, .serv-link:hover .ico { transform: translateX(4px); }

.topo { position: sticky; top: 0; z-index: 20; background: var(--fundo); border-bottom: 1px solid var(--linha); }
.topo-in { min-height: var(--nav); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.marca { display: flex; align-items: center; gap: .68rem; min-width: 0; text-decoration: none; }
.marca .selo { display: grid; place-items: center; flex: none; width: 2.65rem; height: 2.65rem; border: 1px solid currentColor; border-radius: 50%; font-size: 1.25rem; }
.marca img { width: 2.65rem; height: 2.65rem; object-fit: contain; }
.nome { display: block; font: 400 clamp(1.7rem, 2.6vw, 2.38rem)/.88 var(--serif); letter-spacing: -.02em; overflow-wrap: anywhere; }
.marca small { display: block; margin-top: .2rem; font-size: .65rem; font-weight: 750; }
.nav { display: flex; gap: clamp(.7rem, 2.33vw, 2.35rem); }
.nav a { display: inline-flex; align-items: center; min-height: 44px; padding-block: .42rem; text-decoration: none; font-size: .85rem; font-weight: 800; }
.nav a:hover { text-decoration: underline; }
.nav-toggle { display: none; }
.barra-campos { color: #3f3023; background: #f1e2c8; font-size: .73rem; font-weight: 800; }
.barra-campos .container { display: flex; align-items: center; justify-content: space-between; gap: .75rem; min-height: 38px; }
.alternar-campos { min-height: 38px; padding: .35rem .24rem; border: 0; background: transparent; text-decoration: underline; text-underline-offset: .18em; font: inherit; }
.marca-campo { display: none; width: fit-content; max-width: 100%; padding: .2rem .48rem; border-radius: .25rem; color: #3f3023; background: #f1e2c8; font: 800 .68rem/1.28 var(--sans); }
.campos-visiveis .marca-campo { display: block; }
.marca-campo--imagem { position: absolute; z-index: 2; right: .7rem; top: .7rem; max-width: calc(100% - 1.4rem); }
.hero-foto > .marca-campo--imagem { left: .85rem; right: auto; }
.marca-campo--marca { margin-top: .18rem; }

.hero { padding-block: clamp(1rem, 2.7vw, 2.55rem); }
.hero-grid { display: grid; grid-template-columns: minmax(0, .91fr) minmax(0, 1.09fr); align-items: stretch; }
.hero-texto { display: grid; justify-items: start; align-content: center; gap: clamp(.8rem, 1.48vw, 1.32rem); padding: clamp(1.5rem, 4.2vw, 4.4rem) clamp(1.5rem, 3.75vw, 3.8rem); background: var(--tinta); border-radius: 22px 0 0 22px; }
.hero h1 { max-width: 11ch; font: 400 clamp(3.95rem, 7.2vw, 7.2rem)/.89 var(--serif); letter-spacing: -.035em; }
.hero h1 em { color: var(--primaria); }
.hero-lead { max-width: 37ch; color: var(--suave); font-size: clamp(.98rem, 1.3vw, 1.14rem); }
.hero-acoes { display: flex; align-items: center; flex-wrap: wrap; gap: .65rem 1rem; }
.fatos { display: flex; flex-wrap: wrap; gap: .45rem .95rem; font-size: .78rem; font-weight: 800; }
.fatos li { display: flex; align-items: center; gap: .38rem; }
.hero-media { position: relative; min-width: 0; min-height: clamp(29rem, 41vw, 41rem); isolation: isolate; }
.hero-foto { position: absolute; inset: 0; overflow: hidden; border-radius: 0 22px 22px 0; background: var(--tinta); }
.hero-foto img { height: 100%; object-fit: cover; object-position: 57% 45%; }
.hero-rt, .hero-guia { position: absolute; z-index: 2; bottom: 1rem; left: 1rem; display: flex; align-items: center; gap: .75rem; max-width: calc(100% - 2rem); padding: .65rem .9rem; border-radius: 9px; background: var(--papel); color: var(--texto); font-size: .82rem; }
.hero-rt div { display: grid; }
.rt-rotulo { font-size: .71rem; }
.hero-guia { text-decoration: none; font-weight: 850; min-height: 44px; }
.hero-guia:hover { background: var(--secundaria); }
@media (prefers-reduced-motion: no-preference) {
  .hero-foto img { animation: enquadrar .65s ease-out both; }
  @keyframes enquadrar { from { transform: scale(1.045); } }
}

.consulta { padding: 0 0 1rem; }
.consulta-card { display: grid; grid-template-columns: minmax(13.5rem, .9fr) minmax(0, 2.1fr); gap: clamp(1rem, 3vw, 2.8rem); align-items: center; padding: clamp(1rem, 2.3vw, 2rem); border: 1px solid var(--linha); border-radius: 13px; background: var(--papel); }
.consulta-card h2 { font-size: clamp(2rem, 3.25vw, 3.35rem); text-wrap: initial; }
.consulta-card .lead { margin-top: .36rem; font-size: .85rem; }
.consulta-card .marca-campo { margin-bottom: .38rem; }
.consulta-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .72rem; align-items: center; min-width: 0; }
.consulta-form .btn { grid-column: 2; align-self: end; }
.campo { grid-column: 1/-1; min-width: 0; display: grid; gap: .16rem; }
.campo label, .grupo legend { font-size: .77rem; font-weight: 820; }
.campo select { padding: .36rem .55rem; min-height: 44px; width: 100%; border: 1px solid var(--linha); border-radius: 7px; background: var(--fundo); }
.linha-2 { display: flex; flex-wrap: wrap; gap: .65rem 1.1rem; }
.grupo { min-width: 0; margin: 0; border: 0; padding: 0; }
.pills { display: flex; align-items: center; flex-wrap: wrap; gap: .32rem; }
.pill { position: relative; }
.pill input { position: absolute; opacity: 0; }
.pill span { display: inline-flex; min-height: 37px; align-items: center; padding: .18rem .6rem; border: 1px solid var(--linha); border-radius: 99px; font-size: .73rem; font-weight: 750; cursor: pointer; }
.pill input:checked + span { background: var(--primaria); border-color: var(--primaria); color: var(--cta-texto); }
.pill input:focus-visible + span { outline: 2px solid var(--texto); outline-offset: 3px; }

.sec { padding-block: var(--secao); }
.sec--tinta { background: var(--tinta); }
.sec--escura { background: var(--primaria); color: var(--cta-texto); }
.sec-head { display: grid; justify-items: start; gap: .8rem; margin-bottom: clamp(1.55rem, 3.7vw, 3.25rem); }
.sec-head h2 { text-wrap: initial; }
.lead { color: var(--suave); max-width: 44ch; }
.sec--escura .lead { color: inherit; }
.servs { display: grid; grid-template-columns: minmax(11.25rem, .83fr) minmax(0, 1.17fr); gap: clamp(.85rem, 2vw, 1.55rem); }
.serv-abas { display: grid; gap: .42rem; align-content: start; }
.serv-aba { text-align: left; min-height: 3.2rem; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .58rem; padding: .55rem .7rem; border: 1px solid var(--linha); border-radius: 7px; background: transparent; font-size: .87rem; font-weight: 800; }
.serv-aba:hover, .serv-aba[aria-pressed='true'] { background: var(--primaria); border-color: var(--primaria); color: var(--cta-texto); }
.serv { position: relative; isolation: isolate; display: grid; justify-items: start; align-content: center; gap: 1rem; height: 100%; min-height: 19rem; padding: clamp(1.3rem, 4.25vw, 4rem); border-radius: 13px; background: var(--tinta); overflow: hidden; }
.serv h3 { font-size: clamp(2.9rem, 5vw, 4.8rem); max-width: 16ch; }
.serv p { max-width: 43ch; }
.serv-ico { color: var(--primaria); font-size: 1.55rem; }
.serv-gravura { position: absolute; z-index: -1; bottom: -1.6rem; right: -1.1rem; opacity: .08; color: var(--primaria); font-size: clamp(7rem, 19vw, 17rem); pointer-events: none; }
.sobre-grid, .local:has(.mapa), .faq-grid, .primeira-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(1.3rem, 6vw, 6rem); align-items: center; }
.sobre-foto, .primeira-foto, .membro-foto { position: relative; }
.sobre-foto img, .primeira-foto img { aspect-ratio: 1.23; object-fit: cover; border-radius: 13px; }
.sobre-texto { display: grid; justify-items: start; gap: 1rem; }
.sobre-texto h2 { text-wrap: initial; }
.sobre-texto p { max-width: 46ch; }
.assinatura { font-weight: 800; }
.primeira-grid { align-items: start; }
.primeira-grid:not(:has(.primeira-foto)) { display: block; }
.passos { display: grid; }
.passo { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); align-items: start; gap: .3rem .7rem; padding: .92rem 0; border-top: 1px solid var(--linha); }
.passo-n { display: grid; place-items: center; width: 2rem; height: 2rem; grid-row: span 2; border: 1px solid var(--linha); border-radius: 50%; font-size: .76rem; font-weight: 850; }
.passo h3 { font: 820 1.05rem/1.35 var(--sans); letter-spacing: 0; }
.passo p { color: var(--suave); font-size: .9rem; }
.equipe, .avals { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(16rem, 100%), 1fr)); gap: 1rem; }
.equipe--poucos { grid-template-columns: repeat(auto-fit, minmax(min(19rem, 100%), 1fr)); }
.membro, .aval { border-top: 1px solid var(--linha); padding-top: 1rem; }
.membro { display: grid; grid-template-columns: minmax(0, .65fr) minmax(0, 1.35fr); gap: .85rem; align-items: center; }
.membro:not(:has(.membro-foto)) { grid-template-columns: 1fr; }
.membro-foto img { aspect-ratio: 1; object-fit: cover; border-radius: 9px; }
.membro-txt { display: grid; gap: .43rem; }
.membro-txt :is(p, h3) { overflow-wrap: anywhere; }
.membro-esp, .membro-cro, .membro-bio, .aval figcaption { font-size: .88rem; }
.aval blockquote { font: 400 2rem/1.12 var(--serif); margin-bottom: .65rem; }
.galeria-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(17rem, 100%), 1fr)); gap: .8rem; }
.tile { position: relative; display: block; width: 100%; padding: 0; overflow: hidden; border: 0; border-radius: 10px; background: var(--tinta); }
.tile img { aspect-ratio: 1.27; object-fit: cover; transition: transform .4s; }
button.tile:hover img { transform: scale(1.035); }
.tile small { position: absolute; bottom: .65rem; left: .65rem; max-width: calc(100% - 1.3rem); background: var(--papel); color: var(--texto); padding: .32rem .51rem; border-radius: 5px; font-size: .75rem; font-weight: 800; }
.faq-grid { align-items: start; }
.faq-lista { border-top: 1px solid var(--linha); }
.faq-lista details { border-bottom: 1px solid var(--linha); }
.faq-lista summary { display: flex; align-items: center; justify-content: space-between; gap: .85rem; min-height: 3.1rem; padding: .65rem 0; list-style: none; font-weight: 800; }
.faq-lista summary::-webkit-details-marker { display: none; }
.faq-lista summary::after { content: '+'; font-size: 1.3rem; }
.faq-lista details[open] summary::after { content: '−'; }
.faq-resp { padding: .1rem 0 .85rem; color: var(--suave); }
.local-acoes, .final-contato { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: 1.3rem; }
.dados { display: grid; gap: .8rem; }
.dados > div { display: grid; grid-template-columns: 1.6rem 1fr; gap: .15rem .48rem; }
.dados > div > .ico { grid-row: span 2; margin-top: .15rem; }
.dados dt { font-weight: 850; }
.dados dd { font-size: .91rem; }
.horas, .horas > span { display: grid; gap: .15rem .8rem; }
.horas > span { grid-template-columns: 1fr 1fr; }
.mapa { width: 100%; aspect-ratio: 1.28; min-height: 15rem; position: relative; border-radius: 13px; overflow: hidden; background: var(--tinta); }
.mapa iframe, .mapa img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
.mapa--vazio { display: grid; place-items: center; padding: 1.25rem; }
.mapa--regiao { display: grid; place-content: center; justify-items: center; gap: .7rem; text-align: center; padding: 1.5rem; }
.mapa--regiao .ico { width: 3rem; height: 3rem; }
.mapa--regiao p { max-width: 18ch; font: 400 clamp(2rem, 4vw, 3.75rem)/1 var(--serif); }
.final-in { display: grid; justify-items: start; gap: 1rem; }
.final-in p { max-width: 47ch; }
.final-contato:empty { display: none; }
.final-contato a { display: inline-flex; align-items: center; gap: .45rem; }
.rodape { background: var(--texto); color: var(--fundo); padding-block: 3rem 1.5rem; overflow-wrap: anywhere; }
.rodape-grid { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 1.35rem 2rem; }
.rodape-grid h2 { font: 850 .95rem/1.3 var(--sans); margin-bottom: .55rem; }
.rodape-grid .logo { font: 400 2.15rem/1 var(--serif); margin-bottom: .55rem; }
.rodape-grid li { display: flex; gap: .47rem; align-items: flex-start; margin-bottom: .35rem; font-size: .86rem; }
.rodape-grid li .ico { margin-top: .2rem; }
.rodape-legal, .rt-rodape { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .75rem 1.25rem; margin-top: 1.5rem; padding-top: .85rem; border-top: 1px solid color-mix(in srgb, currentColor 33%, transparent); font-size: .82rem; }
.rt-rodape .marca-campo { margin-right: .35rem; }
.rodape-grid .marca-campo, .local .marca-campo { margin-bottom: .55rem; }
.flutuante { position: fixed; z-index: 10; right: max(1rem, env(safe-area-inset-right)); bottom: max(1rem, env(safe-area-inset-bottom)); min-height: 3rem; box-shadow: 0 5px 23px #15332f35; }
.flutuante:not([data-visivel]) { visibility: hidden; }
dialog { max-width: calc(100% - 1.4rem); padding: 0; border: 0; border-radius: 13px; }
dialog::backdrop { background: #182e28d2; }
.lb[open] { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .5rem; width: min(69rem, 95vw); background: var(--primaria); color: var(--cta-texto); padding: .65rem; }
.lb figure { grid-column: 2; text-align: center; }
.lb img { height: min(68vh, 47rem); object-fit: contain; }
.lb figcaption { padding-top: .35rem; font-size: .88rem; }
.lb-btn { display: grid; place-content: center; min-width: 2.75rem; min-height: 2.75rem; border: 1px solid currentColor; border-radius: 50%; background: transparent; }
.lb-x { grid-column: 1/-1; justify-self: end; }
.simulacao { width: 31rem; padding: clamp(1.15rem, 4vw, 2rem); background: var(--papel); color: var(--texto); }
.simulacao h2 { margin-bottom: .75rem; font-size: 2.75rem; }
.simulacao blockquote { margin-block: .75rem 1rem; padding: .8rem; border-radius: 7px; background: var(--tinta); }
.pend, .previa { background: #f1e2c8; color: #3f3023; }
.pend { display: inline-block; padding: .15rem .32rem; margin-right: .24rem; border-radius: 4px; font: 800 .68rem/1.25 var(--sans); vertical-align: middle; }
.previa { position: fixed; z-index: 18; left: .65rem; bottom: 4.7rem; padding: .46rem; border: 1px solid #856b4b; border-radius: 5px; font: 800 .68rem/1.25 var(--sans); }
.pend-foco { outline: 3px solid #936630; outline-offset: 4px; }
@media (max-width: 880px) {
  .topo-in { gap: .58rem; }
  .topo-in > .btn { margin-left: auto; }
  .nav-toggle { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border: 1px solid var(--linha); border-radius: 50%; background: transparent; }
  .nav { position: absolute; display: none; inset: 100% 0 auto; padding: .55rem var(--margem); gap: 0; background: var(--fundo); border-bottom: 1px solid var(--linha); }
  .nav[data-open] { display: grid; }
  .hero h1 { font-size: clamp(3.6rem, 8vw, 5.4rem); }
  .hero-texto { padding: 1.45rem; }
  .consulta-card { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 680px) {
  :root { --nav: 64px; }
  .marca .selo, .marca img { width: 2.1rem; height: 2.1rem; }
  .marca { gap: .45rem; }
  .topo-in > .btn { min-height: 44px; padding-inline: .55rem; font-size: .72rem; }
  .topo-in > .btn .ico { display: none; }
  .marca small { font-size: .55rem; }
  .hero-grid, .servs, .sobre-grid, .local:has(.mapa), .faq-grid, .primeira-grid { grid-template-columns: minmax(0, 1fr); }
  .hero-texto { border-radius: 15px 15px 0 0; }
  .hero h1 { font-size: clamp(3.45rem, 11vw, 5.15rem); }
  .hero-media { min-height: clamp(16rem, 65vw, 27rem); }
  .hero-foto { border-radius: 0 0 15px 15px; }
  .hero-foto img { object-position: 55% 43%; }
  .serv-abas { display: flex; flex-wrap: wrap; gap: .35rem; }
  .serv-aba { min-height: 44px; grid-template-columns: auto 1fr; padding-inline: .52rem; }
  .serv-aba > .ico:last-child { display: none; }
  .serv { min-height: 16rem; }
  .rodape-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .rodape-grid > :first-child { grid-column: 1/-1; }
}
@media (max-width: 430px) {
  .hero-texto { padding: 1.15rem; }
  .hero-acoes .btn { padding-inline: .83rem; }
  .hero-acoes { gap: .2rem 1rem; }
  .consulta-form { grid-template-columns: minmax(0, 1fr); }
  .consulta-form .btn { grid-column: 1; grid-row: auto; }
  .nav-toggle { width: 42px; height: 42px; }
  .nome { font-size: 1.57rem; }
  .previa-longo { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media print { .barra-campos, .flutuante, .campos-visiveis .marca-campo, .previa { display: none !important; } }

/* Composição principal */
:root {
  --primaria: #142543;
  --secundaria: #bee9ec;
  --fundo: #f7f8f5;
  --texto: #172541;
  --apoio-texto: #172541;
  --tinta: color-mix(in srgb, var(--secundaria) 40%, var(--fundo));
  --nav: 78px;
}
h2, h3 { font-family: var(--sans); font-weight: 680; letter-spacing: -.04em; }
h2 { font-size: clamp(2.85rem, 5.4vw, 5.45rem); }
.topo { background: var(--fundo); }
.topo-in { gap: clamp(.7rem, 2vw, 1.8rem); }
.marca .selo { color: var(--cta-texto); background: var(--primaria); border-color: transparent; }
.nome { font: 740 clamp(1.28rem, 2.1vw, 2.03rem)/1 var(--sans); letter-spacing: -.04em; }
.marca small { font-weight: 650; }
.nav a { font-weight: 650; }
.barra-campos, .marca-campo { background: #f1e6cf; color: #463519; }
.alternar-campos { font-weight: 720; }
.hero { position: relative; isolation: isolate; background: var(--primaria); color: var(--cta-texto); padding-block: clamp(1.5rem, 4vw, 4rem) clamp(3.4rem, 6.4vw, 6.5rem); }
.hero-grid { grid-template-columns: minmax(0, .84fr) minmax(0, 1.16fr); min-height: clamp(29rem, 38.3vw, 38rem); gap: clamp(1.35rem, 3.4vw, 3.55rem); align-items: stretch; }
.hero-texto { background: transparent; border-radius: 0; padding: 0 0 .85rem; gap: clamp(.8rem, 1.44vw, 1.3rem); }
.hero h1 { color: inherit; max-width: 14ch; font: 680 clamp(3.55rem, 6.25vw, 6.2rem)/.91 var(--sans); letter-spacing: -.04em; }
.hero h1 span { display: block; white-space: nowrap; }
.hero h1 em { color: inherit; }
.hero h1 .hero-contraste { color: var(--secundaria); }
.hero-lead { max-width: 36ch; color: inherit; opacity: .93; font-size: clamp(1rem, 1.3vw, 1.16rem); }
.hero-acoes { margin-top: .15rem; }
.hero-acoes .btn { min-height: 3.42rem; }
.btn--apoio { background: var(--secundaria); color: var(--apoio-texto); }
.btn--apoio:hover { background: color-mix(in srgb, var(--secundaria) 82%, white); }
.hero .fatos { margin-top: .72rem; padding-top: .85rem; border-top: 1px solid color-mix(in srgb, currentColor 30%, transparent); font-weight: 650; }
.hero-media { min-height: 0; height: 100%; }
.hero-media::before { content: ''; position: absolute; inset: -.55rem .55rem .55rem -.55rem; border: 1px solid color-mix(in srgb, var(--secundaria) 45%, transparent); border-radius: clamp(3rem, 12vw, 10rem) 7px 7px 7px; z-index: -1; }
.hero-foto { border-radius: clamp(3rem, 12vw, 10rem) 7px 7px 7px; }
.hero-foto img { object-position: 61% 43%; }
.hero-foto > .marca-campo--imagem { left: auto; right: .85rem; }
.hero-rt, .hero-guia { left: auto; right: .8rem; bottom: .8rem; border-radius: 7px; }
.hero-guia { flex-direction: row-reverse; }
.hero-guia .ico { width: 1.65rem; height: 1.65rem; padding: .25rem; border-radius: 50%; background: var(--tinta); }

/* Agendamento e catálogo */
.consulta { position: relative; margin-top: -3.15rem; z-index: 3; padding-bottom: .3rem; }
.consulta-card { grid-template-columns: minmax(11.5rem, .72fr) minmax(0, 2.28fr); gap: clamp(1rem, 2.5vw, 2.35rem); padding: clamp(1rem, 2.3vw, 1.8rem); border-radius: 10px; }
.consulta-card h2 { font: 670 clamp(1.65rem, 2.65vw, 2.55rem)/1.02 var(--sans); letter-spacing: -.035em; }
.consulta-form { gap: .5rem .75rem; }
.consulta-form .campo { grid-column: 1; }
.consulta-form .btn { grid-column: 2; grid-row: 1 / 3; align-self: center; }
.consulta-form .linha-2 { grid-column: 1; }
.consulta-form .pills { gap: .27rem; }
.consulta-form .pill span { min-height: 38px; }
.consulta-status { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .2rem .7rem; padding-top: .5rem; border-top: 1px solid var(--linha); }
.consulta-status p { font-size: .79rem; font-weight: 650; }
.consulta-status button { min-height: 2.5rem; border: 0; padding: .2rem .35rem; background: transparent; font-size: .75rem; font-weight: 750; text-decoration: underline; }
#tratamentos .sec-head, #galeria .sec-head { grid-template-columns: minmax(0, 1.3fr) minmax(12rem, .7fr); align-items: end; column-gap: clamp(1rem, 3.5vw, 4rem); }
.sec-head > .marca-campo { grid-column: 1 / -1; }
.servs { grid-template-columns: minmax(12rem, .72fr) minmax(0, 1.28fr); gap: .8rem; }
.serv-abas { gap: 0; border-block: 1px solid var(--linha); }
.serv-aba { border: 0; border-bottom: 1px solid var(--linha); border-radius: 0; min-height: 3.45rem; gap: .65rem; font-size: .93rem; }
.serv-aba:last-child { border-bottom: 0; }
.serv-aba:not([aria-pressed='true']):hover { background: var(--tinta); color: var(--texto); }
.serv-aba[aria-pressed='true'] { color: var(--texto); background: var(--tinta); }
.serv-aba[aria-pressed='true'] > .ico:last-child { color: var(--cta-texto); background: var(--primaria); padding: .25rem; border-radius: 50%; width: 1.7rem; height: 1.7rem; }
.serv { background: var(--primaria); color: var(--cta-texto); border-radius: 9px; min-height: 21.5rem; }
.serv h3 { font: 660 clamp(2.4rem, 4.5vw, 4.4rem)/.98 var(--sans); }
.serv-ico { color: var(--secundaria); }

}
function jsonld() {
  if (demo || numeroPendente || C.negocio.nome.includes('[TROCAR]')) return;
  const n = C.negocio, abs = u => /^https?:\/\//.test(u || '') ? u : undefined, completo = on('jsonLdCompleto');
  const horas = (C.horariosSchema || []).filter(x => x && x.abre && x.fecha && (x.dias || []).length)
    .map(x => ({ '@type': 'OpeningHoursSpecification', dayOfWeek: x.dias, opens: x.abre, closes: x.fecha }));
  const equipeL = (C.equipe || []).filter(p => p && p.nome);
  const o = {
    '@context': 'https://schema.org', '@type': n.tipoSchema || 'Dentist',
    name: n.nome, description: fill(C.seo.descricao), url: abs(C.seo.urlSite),
    image: abs(C.seo.imagemOg) || abs(C.hero.foto),
    telephone: numeroPendente ? undefined : '+' + numero,
    email: C.contato.email ? limpo(C.contato.email) : undefined,
    address: { '@type': 'PostalAddress', streetAddress: n.rua, addressLocality: n.cidade, addressRegion: n.uf, postalCode: n.cep, addressCountry: 'BR' },
    geo: n.coordenadas ? { '@type': 'GeoCoordinates', latitude: n.coordenadas.lat, longitude: n.coordenadas.lng } : undefined,
    hasMap: mapsUrl(),
    openingHoursSpecification: horas.length ? horas : undefined,
    sameAs: [C.links.instagram, C.links.facebook].filter(Boolean),
    availableService: completo && on('servicos') && servicosAtivos().length ? servicosAtivos().map(s => ({ '@type': 'MedicalProcedure', name: s.nome })) : undefined,
    employee: completo && on('equipe') && equipeL.length ? equipeL.map(p => ({ '@type': 'Person', name: p.nome, jobTitle: p.especialidade || undefined })) : undefined
  };
  if (!o.sameAs.length) delete o.sameAs;
  const s = h('script', { type: 'application/ld+json' }); s.textContent = JSON.stringify(o); document.head.append(s);
}

/* ---------- comportamentos ---------- */
function comportamentos() {
  const dialog = $('#simulacao');
  dialog.addEventListener('click', e => {
    if (e.target !== dialog) return;
    const area = dialog.getBoundingClientRect();
    if (e.clientX < area.left || e.clientX > area.right || e.clientY < area.top || e.clientY > area.bottom) dialog.close();
  });
}

/* ---------- pendências [TROCAR] ---------- */
function pendencias() {
  if (demo) { document.head.append(h('meta', { name: 'robots', content: 'noindex, follow' })); return; }
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement && /^(SCRIPT|STYLE|NOSCRIPT|OPTION)$/.test(n.parentElement.tagName) ? NodeFilter.FILTER_REJECT : MARCA.test(n.nodeValue) ? (MARCA.lastIndex = 0, NodeFilter.FILTER_ACCEPT) : NodeFilter.FILTER_SKIP) });
  const nos = []; while (w.nextNode()) nos.push(w.currentNode);
  let total = 0;
  nos.forEach(n => {
    const partes = n.nodeValue.split(MARCA); total += partes.length - 1;
    // ?limpo = prévia para o cliente: esconde as marcas. Sem prévia e sem ?limpo, o "[TROCAR]" aparece cru (alerta visível).
    if (modoLimpo) { n.nodeValue = partes.join('').replace(/^\s+/, ''); return; }
    if (!previa) return;
    const f = document.createDocumentFragment();
    partes.forEach((p, i) => { if (i) f.append(h('mark', { class: 'pend' }, 'Trocar')); if (p) f.append(p.replace(/^ /, i ? '' : ' ')); });
    n.replaceWith(f);
  });
  if (modoLimpo) document.title = limpo(document.title);
  const numPend = numeroPendente ? 1 : 0;
  const fotos = document.querySelectorAll('img[data-pendente]').length;
  if (total || fotos || numPend) {
    console.warn('[template] Pendências antes de publicar →', { textos: total, fotos, whatsapp: numPend });
    // Enquanto houver pendência, a página fica fora do Google (noindex). Some sozinho quando tudo for trocado.
    document.head.append(h('meta', { name: 'robots', content: 'noindex, nofollow' }));
  }
  if (previa) {
    let k = -1;
    const bt = h('button', { type: 'button', class: 'previa', 'aria-label': 'Prévia do template: ir para a próxima pendência' }, h('i'),
      h('span', null, 'Prévia: ' + total + ' [TROCAR] · ' + fotos + ' fotos' + (numPend ? ' · WhatsApp' : ''), h('span', { class: 'previa-longo' }, ' — toque para ir à próxima')));
    bt.addEventListener('click', () => {
      const m = [...document.querySelectorAll('mark.pend')].filter(el => !el.closest('[hidden]')); if (!m.length) return;
      document.querySelectorAll('.pend-foco').forEach(x => x.classList.remove('pend-foco'));
      k = (k + 1) % m.length; const alvo = m[k];
      alvo.scrollIntoView({ block: 'center', behavior: reduzMovimento ? 'auto' : 'smooth' });
      alvo.parentElement && alvo.parentElement.classList.add('pend-foco');
      setTimeout(() => alvo.parentElement && alvo.parentElement.classList.remove('pend-foco'), 1800);
    });
    document.body.append(bt);
  }
}

/* ---------- campos personalizáveis ---------- */
function marcarCamposDemo() {
  if (!demo) return;
  const campos = [
    ['.marca-texto', 'Nome, logotipo e cores', 'marca'],
    ['.hero-texto', 'Título e texto de abertura'],
    ['.hero-foto', 'Foto de abertura', 'imagem'],
    ['.consulta-card > :first-child', 'WhatsApp e mensagem de agendamento'],
    ['#tratamentos .sec-head', 'Tratamentos e descrições'],
    ['#primeira-consulta .sec-head', 'Etapas da primeira consulta'],
    ['.primeira-foto', 'Foto do atendimento', 'imagem'],
    ['.sobre-texto', 'Apresentação da clínica'],
    ['.sobre-foto', 'Foto do ambiente', 'imagem'],
    ['#equipe .sec-head', 'Equipe, fotos, especialidades e CRO'],
    ['#galeria .sec-head', 'Fotos e legendas da galeria'],
    ['#avaliacoes .sec-head', 'Depoimentos autorizados'],
    ['#perguntas .sec-head', 'Perguntas, convênios e condições'],
    ['.local > :first-child', 'Endereço, horários e mapa'],
    ['.final-in', 'Chamada para agendamento'],
    ['.rodape-grid > :nth-child(2)', 'Telefone, e-mail e redes sociais'],
    ['.rt-rodape', 'Responsável técnico e CRO'],
    ['.rodape-legal', 'Dados legais e créditos'],
  ];
  for (const [seletor, nome, posicao = 'bloco'] of campos) {
    const alvo = $(seletor);
    if (!alvo) continue;
    const etiqueta = h('span', { class: 'marca-campo marca-campo--' + posicao }, nome);
    if (posicao === 'marca') alvo.append(etiqueta);
    else alvo.prepend(etiqueta);
  }
  if (!on('consultaRapida')) $('.hero-texto').append(h('span', { class: 'marca-campo' }, 'WhatsApp e mensagem de agendamento'));
  const botao = h('button', { type: 'button', class: 'alternar-campos', 'aria-controls': 'topo conteudo rodape' });
  const alternar = visiveis => {
    document.body.classList.toggle('campos-visiveis', visiveis);
    botao.textContent = visiveis ? 'Ocultar marcações' : 'Mostrar marcações';
  };
  botao.addEventListener('click', () => alternar(!document.body.classList.contains('campos-visiveis')));
  alternar(!params.has('sem-marcacoes'));
  $('#topo').prepend(h('div', { class: 'barra-campos' },
    h('div', { class: 'container' }, h('span', null, 'Modelo de clínica · Campos editáveis'), botao)));
}

/* ---------- montagem ---------- */
function montar() {
  aplicarTema(); seo();
  const main = $('#conteudo');
  const partes = [hero(), consultaRapida(), servicos(), primeiraConsulta(), sobre(), equipe(), galeria(), avaliacoes(), faq(), localizacao(), ctaFinal()].filter(Boolean);
  let alt = false;
  partes.forEach(p => { const t = p.dataset && p.dataset.tom; if (t === 'auto') { if (alt) p.classList.add('sec--tinta'); alt = !alt; } else if (t) alt = false; main.append(p); });
  const nav = [['tratamentos', 'servicos'], ['primeira-consulta', 'primeira'], ['equipe', 'equipe'], ['perguntas', 'faq'], ['localizacao', 'local']]
    .filter(([id]) => $('#' + id)).map(([id, k]) => ({ id, label: C.textos.nav[k] || 'Primeira consulta' }));
  cabecalho(nav); rodape(); flutuante();
  if (lbItens.length) iniciarLb();
  refreshWa(); jsonld(); comportamentos(); pendencias(); marcarCamposDemo();
}
if (!demo && numeroPendente) console.warn('[template] CONFIG.whatsapp.numero ainda é o número de exemplo.');
montar();
})();
