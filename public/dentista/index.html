<style>
/* ==========================================================================
   Tokens. As 4 cores vêm do CONFIG.cores; o resto é derivado delas.
   primaria = botões, links e ícones (precisa ser escura o bastante para texto branco)
   secundaria = tom claro de apoio (fundos suaves, painel atrás da foto)
   ========================================================================== */
:root{
  --primaria:#0B6E78; --secundaria:#CFEDEA; --fundo:#FFFFFF; --texto:#12303A;
  --cta-texto:#FFFFFF;

  --primaria-escura:color-mix(in oklab,var(--primaria) 68%,#000);
  --superficie:color-mix(in oklab,var(--secundaria) 60%,var(--fundo));
  --superficie-2:color-mix(in oklab,var(--secundaria) 24%,var(--fundo));
  --tinta:var(--texto);
  --tinta-suave:color-mix(in oklab,var(--texto) 76%,var(--fundo));
  --linha:color-mix(in oklab,var(--texto) 12%,var(--fundo));
  --linha-forte:color-mix(in oklab,var(--texto) 32%,var(--fundo));
  --cta-hover:var(--primaria-escura);
  --foco:var(--primaria-escura);

  --display:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --sans:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --gutter:clamp(1.25rem,5vw,3rem);
  --max:1200px;
  --sec:clamp(4.5rem,9vw,7.5rem);
  --raio:22px;
}

/* ==========================================================================
   Base
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:5rem;accent-color:var(--primaria);color-scheme:light}
body{margin:0;background:var(--fundo);color:var(--tinta);font:400 1.0625rem/1.62 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scrollbar-color:color-mix(in oklab,var(--primaria) 45%,var(--fundo)) var(--superficie-2)}
img,svg{display:block;max-width:100%}
img{height:auto}
h1,h2,h3,p,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em}
button,input,select{font:inherit;color:inherit}
::selection{background:var(--primaria);color:var(--cta-texto)}
input,select{caret-color:var(--primaria)}
:focus-visible{outline:3px solid var(--foco);outline-offset:3px;border-radius:6px}
section[id]{scroll-margin-top:4.75rem}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pular{position:fixed;left:1rem;top:-4rem;z-index:100;background:var(--tinta);color:var(--fundo);padding:.75rem 1.1rem;border-radius:10px;transition:top .2s var(--ease)}
.pular:focus{top:1rem}
.container{width:min(100% - 2*var(--gutter),var(--max));margin-inline:auto}
.ico{display:inline-flex;width:1.3em;height:1.3em;flex:none}
.ico svg{width:100%;height:100%}
.tnum{font-variant-numeric:tabular-nums}

h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;color:var(--tinta)}
h1 em,h2 em{font-style:normal;color:var(--primaria)}
h2{font-size:clamp(1.9rem,1.25rem + 2.5vw,3rem);line-height:1.1;letter-spacing:-.028em}
h3{font-size:1.2rem;line-height:1.3;letter-spacing:-.012em}
p{text-wrap:pretty}

/* ==========================================================================
   Botões
   ========================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.65rem;min-height:3.25rem;padding:.8rem 1.55rem;border-radius:999px;border:2px solid transparent;font-family:var(--sans);font-weight:700;font-size:1rem;line-height:1.2;text-align:center;text-decoration:none;cursor:pointer;transition:background-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease),color .25s,border-color .25s}
.btn .ico{width:1.35em;height:1.35em}
.btn--cta{background:var(--primaria);color:var(--cta-texto)}
.btn--claro{background:var(--fundo);color:var(--primaria-escura)}
.btn--linha{background:transparent;border-color:var(--linha-forte);color:var(--tinta)}
.btn--sm{min-height:2.75rem;padding:.5rem 1.1rem;font-size:.95rem}
.btn--lg{min-height:3.6rem;padding:1rem 1.9rem;font-size:1.0625rem}
.btn:active{transform:scale(.985)}
@media (hover:hover){
  .btn--cta:hover{background:var(--cta-hover);transform:translateY(-2px);box-shadow:0 14px 26px -14px rgba(0,0,0,.42)}
  .btn--claro:hover{transform:translateY(-2px);box-shadow:0 14px 26px -14px rgba(0,0,0,.5)}
  .btn--linha:hover{border-color:var(--primaria);color:var(--primaria)}
}
.link-seta{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;color:var(--primaria);text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:.1rem}
.link-seta .ico{width:1.05em;height:1.05em;transition:transform .3s var(--ease)}
@media (hover:hover){.link-seta:hover .ico{transform:translateX(4px)}}

/* ==========================================================================
   Cabeçalho
   ========================================================================== */
.topo{position:fixed;inset:0 0 auto 0;z-index:50;background:color-mix(in oklab,var(--fundo) 92%,transparent);backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);transition:box-shadow .3s var(--ease)}
.topo[data-solido]{box-shadow:0 1px 0 var(--linha)}
.topo-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:4.25rem}
.marca{display:flex;align-items:center;gap:.6rem;min-width:0;flex:1 1 auto;font-family:var(--display);font-weight:600;font-size:1.12rem;letter-spacing:-.02em;text-decoration:none;white-space:nowrap}
.marca span.nome{overflow:hidden;text-overflow:ellipsis}
.marca .selo{flex:none;display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:10px;background:var(--superficie);color:var(--primaria)}
.marca .selo .ico{width:1.25rem;height:1.25rem}
.nav{display:none;gap:1.75rem;font-size:.97rem}
.nav a{text-decoration:none;color:var(--tinta-suave);padding:.4rem 0;border-bottom:1.5px solid transparent;transition:color .2s,border-color .2s}
@media (hover:hover){.nav a:hover{color:var(--tinta);border-bottom-color:var(--primaria)}}
.topo .btn{white-space:nowrap;flex:none}
@media (max-width:380px){.marca{font-size:1rem}.marca .selo{display:none}.topo .btn--sm{padding-inline:.85rem;gap:.45rem}}
@media (min-width:1080px){.nav{display:flex}.marca{flex:0 1 auto}}

/* ==========================================================================
   Hero — texto + foto real da clínica, com o responsável técnico à vista
   ========================================================================== */
.hero{position:relative;isolation:isolate;overflow:clip;padding-top:calc(4.25rem + clamp(2rem,5vw,4.5rem));padding-bottom:clamp(3.5rem,7vw,6rem)}
.hero-grid{display:grid;gap:3rem;align-items:center}
.hero-texto{display:grid;gap:1.5rem;justify-items:start}
.hero h1{font-size:clamp(2.35rem,1.35rem + 3.9vw,4.4rem);line-height:1.04;letter-spacing:-.04em;max-width:15ch}
.hero-lead{font-size:clamp(1.1rem,1rem + .4vw,1.25rem);line-height:1.55;color:var(--tinta-suave);max-width:44ch}
.hero-acoes{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.75rem;margin-top:.25rem}
.fatos{display:grid;gap:.6rem;margin-top:.75rem;padding-top:1.25rem;border-top:1px solid var(--linha);width:100%;max-width:34rem;font-size:.98rem;color:var(--tinta-suave)}
.fatos li{display:flex;gap:.7rem;align-items:flex-start}
.fatos .ico{width:1.2rem;height:1.2rem;color:var(--primaria);margin-top:.2em}
.hero-media{position:relative;margin-inline-end:calc(-1*var(--gutter));padding-inline-end:var(--gutter)}
.hero-media::before{content:"";position:absolute;z-index:-1;inset:14% 0 -7% 22%;background:var(--superficie);border-radius:32px 0 0 32px}
.hero-foto{aspect-ratio:5/4;border-radius:28px;overflow:hidden;background:var(--superficie)}
.hero-foto img{width:100%;height:100%;object-fit:cover}
.hero-rt{position:relative;margin:-2.25rem 0 0 1rem;width:fit-content;max-width:calc(100% - 2rem);display:flex;gap:.85rem;align-items:center;padding:.9rem 1.15rem;background:var(--fundo);border-radius:18px;box-shadow:0 18px 40px -18px rgba(0,0,0,.32),0 1px 3px rgba(0,0,0,.08)}
.hero-rt>.ico{width:2.4rem;height:2.4rem;padding:.5rem;border-radius:12px;background:var(--superficie);color:var(--primaria)}
.hero-rt div{display:grid;line-height:1.3}
.rt-rotulo{font-size:.8rem;color:var(--tinta-suave)}
.hero-rt strong{font-family:var(--display);font-weight:500;font-size:1rem;letter-spacing:-.01em}
.hero-rt .tnum{font-size:.9rem;color:var(--tinta-suave)}
@media (max-width:560px){.hero-acoes .btn--cta{width:100%}}
@media (min-width:960px){
  .hero-grid{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(3rem,6vw,6rem)}
  .hero-media{margin-inline-end:0;padding-inline-end:0}
  .hero-media::before{inset:10% -100vw -8% 26%}
  .hero-foto{aspect-ratio:4/5}
  .hero-rt{position:absolute;left:-2rem;bottom:2.25rem;margin:0}
}
@media (prefers-reduced-motion:no-preference){
  .hero-foto{animation:foto-in 1.3s var(--ease) both .1s}
  .hero-texto>*{animation:texto-in .9s var(--ease) both}
  .hero-texto>:nth-child(1){animation-delay:.08s}
  .hero-texto>:nth-child(2){animation-delay:.18s}
  .hero-texto>:nth-child(3){animation-delay:.28s}
  .hero-texto>:nth-child(4){animation-delay:.38s}
  .hero-rt{animation:texto-in .9s var(--ease) both .75s}
  @keyframes foto-in{from{clip-path:inset(18% 0 0 0 round 28px);transform:translateY(18px)}to{clip-path:inset(0 0 0 0 round 28px);transform:none}}
  @keyframes texto-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
}

/* ==========================================================================
   "Conte o que você precisa" (plano Completo)
   ========================================================================== */
.consulta{padding-bottom:clamp(1rem,3vw,2rem)}
.consulta-card{background:var(--superficie);border-radius:28px;padding:clamp(1.4rem,4vw,2.5rem);display:grid;gap:1.5rem 3rem}
.consulta-card h2{font-size:clamp(1.5rem,1.2rem + 1.2vw,2rem)}
.consulta-card .lead{color:var(--tinta-suave);margin-top:.5rem;max-width:36ch}
.consulta-form{display:grid;gap:1.25rem}
.campo{display:grid;gap:.4rem;min-width:0}
.campo label,.grupo legend{font-size:.9rem;font-weight:700;color:var(--tinta)}
.campo select{width:100%;min-width:0;min-height:3.25rem;padding:.6rem .9rem;background:var(--fundo);border:1.5px solid var(--linha-forte);border-radius:14px;transition:border-color .2s}
.campo select:hover{border-color:var(--primaria)}
.grupo{border:0;margin:0;padding:0;min-width:0}
.grupo legend{padding:0;margin-bottom:.5rem}
.pills{display:flex;flex-wrap:wrap;gap:.5rem}
.pill{position:relative}
.pill input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.pill span{display:inline-flex;align-items:center;min-height:2.75rem;padding:.5rem 1.15rem;background:var(--fundo);border:1.5px solid var(--linha-forte);border-radius:999px;cursor:pointer;transition:background-color .2s,border-color .2s,color .2s}
.pill input:checked+span{background:var(--primaria);border-color:var(--primaria);color:var(--cta-texto)}
.pill input:focus-visible+span{outline:3px solid var(--foco);outline-offset:2px}
@media (hover:hover){.pill span:hover{border-color:var(--primaria)}}
.consulta-form .btn{justify-self:stretch}
.linha-2{display:grid;gap:1.25rem}
@media (min-width:640px){.linha-2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:960px){.consulta-card{grid-template-columns:minmax(0,4fr) minmax(0,7fr);align-items:start}.consulta-form .btn{justify-self:start}}

/* ==========================================================================
   Seções
   ========================================================================== */
.sec{padding-block:var(--sec)}
.sec--tinta{background:var(--superficie-2)}
.sec--escura{background:var(--primaria-escura);color:var(--fundo);--foco:var(--fundo)}
.sec--escura h2{color:var(--fundo)}
.sec--escura h2 em{color:var(--secundaria)}
.sec-head{display:grid;gap:1rem;max-width:44rem;margin-bottom:clamp(2.25rem,5vw,3.5rem)}
.sec-head .lead{color:var(--tinta-suave);font-size:1.1rem;max-width:52ch}

/* Tratamentos */
.servs{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr))}
.serv{display:flex;flex-direction:column;gap:.85rem;padding:1.75rem 1.6rem 1.6rem;background:var(--fundo);border:1px solid var(--linha);border-radius:var(--raio);transition:border-color .3s var(--ease),transform .3s var(--ease)}
.sec--tinta .serv{border-color:transparent}
.serv-ico{display:grid;place-items:center;width:3.25rem;height:3.25rem;border-radius:16px;background:var(--superficie);color:var(--primaria);margin-bottom:.35rem}
.serv-ico .ico{width:1.75rem;height:1.75rem}
.serv p{color:var(--tinta-suave);max-width:40ch}
.serv-link{margin-top:auto;padding-top:.5rem;display:inline-flex;align-items:center;gap:.5rem;font-weight:700;color:var(--primaria);text-decoration:none;align-self:flex-start;min-height:2.75rem}
.serv-link .ico{width:1.05em;height:1.05em;transition:transform .3s var(--ease)}
/* Celular: ícone ao lado do texto, cartão mais baixo */
@media (max-width:559px){
  .serv{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:1rem;row-gap:.45rem;padding:1.25rem 1.25rem 1rem}
  .serv-ico{grid-row:span 3;width:2.75rem;height:2.75rem;border-radius:14px;margin:0}
  .serv-ico .ico{width:1.5rem;height:1.5rem}
  .serv-link{padding-top:0;margin-top:.15rem}
}
@media (hover:hover){
  .serv:hover{border-color:color-mix(in oklab,var(--primaria) 45%,var(--fundo))}
  .serv-link:hover{text-decoration:underline}
  .serv-link:hover .ico{transform:translateX(4px)}
}

/* Sobre */
.sobre-grid{display:grid;gap:clamp(2rem,5vw,4.5rem);align-items:center}
.sobre-foto{aspect-ratio:4/3;border-radius:var(--raio);overflow:hidden}
.sobre-foto img{width:100%;height:100%;object-fit:cover}
.sobre-texto{display:grid;gap:1.15rem;max-width:56ch}
.sobre-texto p{font-size:1.1rem;color:var(--tinta-suave)}
.sobre-texto p.assinatura{color:var(--tinta);font-family:var(--display);font-weight:500;font-size:1.05rem}
@media (min-width:900px){.sobre-grid{grid-template-columns:minmax(0,6fr) minmax(0,5fr)}.sobre-foto{aspect-ratio:5/4}}

/* Primeira consulta */
.passos{display:grid;gap:1rem}
.passo{position:relative;display:grid;gap:.6rem;align-content:start;padding:1.75rem 1.6rem;background:var(--superficie-2);border-radius:var(--raio)}
.sec--tinta .passo{background:var(--fundo)}
.passo-n{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--primaria);color:var(--cta-texto);font-family:var(--display);font-weight:600;font-size:1.05rem;margin-bottom:.5rem}
.passo p{color:var(--tinta-suave);max-width:36ch}
@media (min-width:860px){.passos{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Equipe */
.equipe{display:grid;gap:clamp(1.25rem,3vw,2rem);grid-template-columns:repeat(auto-fill,minmax(min(100%,16rem),1fr))}
.membro{display:grid;align-content:start}
.membro-txt{display:grid;gap:.35rem;align-content:start}
.membro-foto{aspect-ratio:4/5;border-radius:var(--raio);overflow:hidden;background:var(--superficie);margin-bottom:1rem}
/* Celular: foto menor ao lado do nome, para a equipe não ocupar três telas */
@media (max-width:639px){
  .membro{grid-template-columns:minmax(0,7rem) minmax(0,1fr);gap:1.1rem;align-items:center}
  .membro-foto{margin-bottom:0;border-radius:16px}
}
/* 1 ou 2 profissionais: cartões na horizontal, para não sobrar meia tela vazia */
@media (min-width:640px){
  .equipe--poucos{grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr))}
  .equipe--poucos .membro{grid-template-columns:minmax(0,11rem) minmax(0,1fr);gap:1.5rem;align-items:center;padding:1rem;background:var(--fundo);border-radius:calc(var(--raio) + 6px)}
  .equipe--poucos .membro-foto{margin-bottom:0}
}
.membro-foto img{width:100%;height:100%;object-fit:cover}
.membro-esp{color:var(--primaria);font-weight:700}
.membro-cro{font-size:.92rem;color:var(--tinta-suave)}
.membro-bio{color:var(--tinta-suave);margin-top:.4rem;font-size:.98rem}

/* Galeria */
.galeria-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(9rem,40vw,13rem);grid-auto-flow:dense;gap:.7rem}
.tile{position:relative;overflow:hidden;border-radius:16px;background:var(--superficie);margin:0;padding:0;border:0;display:block;width:100%;height:100%}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.tile--big{grid-column:span 2;grid-row:span 2}
.tile--wide{grid-column:span 2}
button.tile{cursor:zoom-in}
@media (hover:hover){button.tile:hover img{transform:scale(1.04)}}
@media (min-width:760px){.galeria-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:13rem;gap:1rem}}
@media (min-width:1100px){.galeria-grid{grid-auto-rows:15rem}}

/* Lightbox */
.lb{border:0;padding:0;width:100%;height:100%;max-width:none;max-height:none;background:transparent;color:#fff}
.lb::backdrop{background:rgba(8,22,28,.94)}
.lb[open]{display:grid;place-items:center;grid-template-columns:auto minmax(0,1fr) auto;gap:.5rem;padding:1rem}
.lb figure{display:grid;gap:.9rem;justify-items:center;min-width:0}
.lb img{max-width:100%;max-height:78vh;width:auto;height:auto;object-fit:contain;border-radius:10px}
.lb figcaption{font-size:.97rem;color:rgba(255,255,255,.88);text-align:center;max-width:60ch;min-height:1.4em}
.lb-btn{display:grid;place-items:center;width:3rem;height:3rem;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;transition:background-color .2s}
.lb-btn:hover{background:rgba(255,255,255,.2)}
.lb :focus-visible{outline-color:#fff}
.lb-x{position:absolute;top:1rem;right:1rem}
@media (max-width:640px){.lb[open]{grid-template-columns:1fr;align-content:center}.lb-prev,.lb-next{position:absolute;bottom:1.25rem}.lb-prev{left:1rem}.lb-next{right:1rem}}

/* Avaliações */
.avals{display:grid;gap:clamp(1rem,3vw,1.5rem);grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr))}
.aval{display:grid;gap:1.25rem;align-content:space-between;padding:1.75rem;background:var(--fundo);border:1px solid var(--linha);border-radius:var(--raio)}
.aval blockquote{font-size:1.1rem;line-height:1.55}
.aval cite{font-style:normal;font-size:.95rem;color:var(--tinta-suave)}
.aval cite strong{color:var(--tinta)}

/* FAQ */
.faq-grid{display:grid;gap:2rem clamp(2rem,6vw,5rem)}
@media (min-width:960px){.faq-grid{grid-template-columns:minmax(0,4fr) minmax(0,7fr);align-items:start}.faq-grid .sec-head{margin-bottom:0;position:sticky;top:6.5rem}}
.faq-lista{display:grid;gap:.6rem}
.faq-lista details{background:var(--fundo);border:1px solid var(--linha);border-radius:18px;transition:border-color .25s}
.sec--tinta .faq-lista details{border-color:transparent}
.faq-lista details[open]{border-color:color-mix(in oklab,var(--primaria) 40%,var(--fundo))}
.faq-lista summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:1.25rem;min-height:3.75rem;padding:1rem 1.35rem;font-family:var(--display);font-weight:500;font-size:1.05rem;letter-spacing:-.01em;border-radius:18px}
.faq-lista summary::-webkit-details-marker{display:none}
.faq-lista summary::after{content:"";flex:none;width:1.75rem;height:1.75rem;border-radius:50%;background:
  linear-gradient(var(--primaria),var(--primaria)) center/.7rem 2px no-repeat,
  linear-gradient(var(--primaria),var(--primaria)) center/2px .7rem no-repeat,var(--superficie);transition:transform .4s var(--ease)}
.faq-lista details[open] summary::after{transform:rotate(135deg)}
.faq-resp{padding:0 1.35rem 1.35rem;color:var(--tinta-suave);max-width:62ch}

/* Localização */
.local{display:grid;gap:clamp(2rem,5vw,4rem)}
@media (min-width:960px){.local{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
.dados{display:grid}
.dados>div{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;padding-block:1.1rem;border-top:1px solid var(--linha)}
.dados>div:last-child{border-bottom:1px solid var(--linha)}
.dados .ico{width:1.45rem;height:1.45rem;color:var(--primaria);grid-row:span 2;margin-top:.1rem}
.dados dt{font-weight:700}
.dados dd{color:var(--tinta-suave)}
.horas{display:grid;gap:.2rem}
.horas>span{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;max-width:24rem}
.local-acoes{margin-top:1.75rem;display:flex;flex-wrap:wrap;gap:.75rem}
.mapa{aspect-ratio:4/3;border-radius:var(--raio);overflow:hidden;background:var(--superficie);display:grid;place-items:center;text-align:center;padding:1.25rem;color:var(--tinta-suave)}
.mapa--vazio{border:1.5px dashed var(--linha-forte);background:var(--superficie-2)}
.mapa:has(iframe){padding:0}
.mapa iframe{width:100%;height:100%;border:0;display:block}
@media (max-width:959px){.mapa{aspect-ratio:1/1}}
@media (min-width:960px){.mapa{position:sticky;top:6.5rem}}

/* Chamada final */
.final-in{display:grid;gap:1.6rem;justify-items:start}
.final h2{font-size:clamp(2.2rem,1.3rem + 3.6vw,4rem);line-height:1.04;letter-spacing:-.035em;max-width:16ch}
.final p{max-width:46ch;font-size:1.12rem;color:color-mix(in oklab,var(--fundo) 86%,transparent)}
.final-contato{display:flex;flex-wrap:wrap;gap:.5rem 2rem}
.final-contato a{display:inline-flex;gap:.5rem;align-items:center}
.final-contato .ico{width:1.15em;height:1.15em}

/* Rodapé (com responsável técnico — exigência do CFO) */
.rodape{background:var(--texto);color:color-mix(in oklab,var(--fundo) 84%,transparent);padding-block:clamp(3rem,6vw,4.5rem) 2rem;font-size:.97rem;--foco:var(--fundo)}
.rodape-grid{display:grid;gap:2.25rem clamp(2rem,5vw,4rem)}
@media (min-width:860px){.rodape-grid{grid-template-columns:minmax(0,4fr) minmax(0,3fr) minmax(0,4fr)}}
.rodape .logo{font-family:var(--display);font-weight:600;font-size:1.4rem;letter-spacing:-.02em;color:var(--fundo);margin-bottom:.6rem}
.rodape h2{font-family:var(--sans);font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fundo);margin-bottom:.9rem;line-height:1.3}
.rodape ul{display:grid;gap:.55rem}
.rodape li{display:flex;gap:.6rem;align-items:flex-start}
.rodape .ico{width:1.1em;height:1.1em;margin-top:.25em;flex:none}
.rodape a{text-decoration-color:color-mix(in oklab,var(--fundo) 40%,transparent)}
@media (hover:hover){.rodape a:hover{text-decoration-color:currentColor}}
.rt-rodape{margin-top:clamp(2.25rem,5vw,3.25rem);padding:1.1rem 1.25rem;border:1px solid color-mix(in oklab,var(--fundo) 24%,transparent);border-radius:16px;display:flex;flex-wrap:wrap;gap:.35rem 1.5rem;color:var(--fundo)}
.rt-rodape strong{font-weight:700}
.rodape-legal{margin-top:1.5rem;display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between;font-size:.88rem;color:color-mix(in oklab,var(--fundo) 76%,transparent)}

/* Botão flutuante (celular) */
.flutuante{position:fixed;z-index:60;right:max(1rem,env(safe-area-inset-right));bottom:max(1rem,env(safe-area-inset-bottom));transform:translateY(160%);transition:transform .6s var(--ease);box-shadow:0 16px 30px -10px rgba(0,0,0,.45)}
.flutuante[data-visivel]{transform:none}
@media (min-width:900px){.flutuante{display:none}}
@media (max-width:899px){.rodape{padding-bottom:6rem}}

/* Entrada ao rolar: só em grupos de itens */
.rev-on .rev{opacity:0;transform:translateY(16px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--i,0)*70ms)}
.rev-on .rev.in{opacity:1;transform:none}
@media print{.rev-on .rev{opacity:1!important;transform:none!important}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}.rev-on .rev{opacity:1;transform:none}}

/* ==========================================================================
   Ferramentas de prévia (somem com ?limpo ou modoPrevia:false)
   ========================================================================== */
.pend{display:inline-block;margin-right:.45em;padding:.18em .5em .14em;border-radius:5px;background:#ffe36e;color:#1b1b1b;font:700 .6rem/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;vertical-align:.2em;font-style:normal;white-space:nowrap}
.previa{position:fixed;z-index:90;left:max(.75rem,env(safe-area-inset-left));bottom:max(.75rem,env(safe-area-inset-bottom));display:flex;gap:.6rem;align-items:center;max-width:calc(100vw - 1.5rem);padding:.6rem .9rem;border:0;border-radius:12px;background:#17201f;color:#fff;font:700 .78rem/1.25 var(--sans);cursor:pointer;text-align:left;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
.previa i{flex:none;width:.6rem;height:.6rem;border-radius:50%;background:#ffe36e}
.previa:focus-visible{outline-color:#ffe36e}
@media (max-width:600px){.previa-longo{display:none}}
@media (max-width:899px){.previa{bottom:calc(max(1rem,env(safe-area-inset-bottom)) + 4.5rem)}}
.pend-foco{outline:3px solid #ffe36e;outline-offset:6px;border-radius:6px}
</style>
</head>

/* ---------- cores: tema, contraste ---------- */
const HEX = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
const rgb = x => { let s = x.replace('#', ''); if (s.length === 3) s = [...s].map(c => c + c).join(''); const n = parseInt(s, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const lum = a => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(a[0]) + .7152 * f(a[1]) + .0722 * f(a[2]); };
const ratio = (a, b) => { const x = lum(rgb(a)), y = lum(rgb(b)); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const toHex = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return toHex(A.map((v, i) => v * (1 - t) + B[i] * t)); };
const cor = { primaria: '#0B6E78', secundaria: '#CFEDEA', fundo: '#FFFFFF', texto: '#12303A' };
Object.keys(cor).forEach(k => { if (HEX.test(C.cores[k] || '')) cor[k] = C.cores[k]; else console.error('[template] cor inválida em CONFIG.cores.' + k + ' — use HEX, ex. #0B6E78'); });
const textoSobre = bg => ratio(bg, cor.fundo) >= ratio(bg, cor.texto) ? cor.fundo : cor.texto;

function aplicarTema() {
  const r = document.documentElement.style;
  r.setProperty('--primaria', cor.primaria); r.setProperty('--secundaria', cor.secundaria);
  r.setProperty('--fundo', cor.fundo); r.setProperty('--texto', cor.texto);
  const ctaTxt = textoSobre(cor.primaria);
  r.setProperty('--cta-texto', ctaTxt);
  const sup = mix(cor.fundo, cor.secundaria, .6), suave = mix(cor.fundo, cor.texto, .76), escura = mix(cor.primaria, '#000000', .32);
  const avisos = [];
  if (ratio(cor.texto, cor.fundo) < 4.5) avisos.push('texto x fundo');
  if (ratio(cor.primaria, ctaTxt) < 4.5) avisos.push('botões (primária) — escureça a primária');
  if (ratio(cor.primaria, cor.fundo) < 4.5) avisos.push('links e ícones na primária sobre o fundo');
  if (ratio(suave, sup) < 4.5) avisos.push('texto secundário sobre a secundária — clareie a secundária');
  if (ratio(escura, cor.fundo) < 4.5) avisos.push('seção escura (chamada final)');
  if (avisos.length) console.warn('[template] Contraste abaixo de 4,5:1 em: ' + avisos.join('; '));
  const tc = $('meta[name="theme-color"]'); if (tc) tc.content = cor.primaria;
  const ini = (limpo(C.negocio.nome).charAt(0) || 'C').toUpperCase();
  const fav = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="${cor.primaria}"/><text x="32" y="43" font-family="Arial,sans-serif" font-weight="700" font-size="32" text-anchor="middle" fill="${ctaTxt}">${ini}</text></svg>`;
  const link = $('link[rel="icon"]'); if (link) link.href = 'data:image/svg+xml,' + encodeURIComponent(fav);
}

/* ---------- galeria ---------- */
const PADRAO = ['big', '', '', '', '', 'wide', '', ''];

function tamanhos(n) {

  if (n < 3) return t.map(() => 'wide');
  const cel = { big: 4, wide: 2, '': 1 };
  let falta = (4 - t.reduce((s, x) => s + cel[x], 0) % 4) % 4;
  for (let i = n - 1; i >= 0 && falta > 0; i--) if (t[i] === '') { t[i] = 'wide'; falta--; }
  return t;
}

}

/* ---------- SEO: head + JSON-LD ---------- */
function metaSet(sel, attr, val) { const m = $(sel); if (m && val) m.setAttribute(attr, val); }
function seo() {

function jsonld() {

    geo: n.coordenadas ? { '@type': 'GeoCoordinates', latitude: n.coordenadas.lat, longitude: n.coordenadas.lng } : undefined,
    hasMap: mapsUrl(),
    openingHoursSpecification: horas.length ? horas : undefined,
    sameAs: [C.links.instagram, C.links.facebook].filter(Boolean),
    availableService: completo && on('servicos') && servicosAtivos().length ? servicosAtivos().map(s => ({ '@type': 'MedicalProcedure', name: s.nome })) : undefined,
    employee: completo && on('equipe') && equipeL.length ? equipeL.map(p => ({ '@type': 'Person', name: p.nome, jobTitle: p.especialidade || undefined })) : undefined
  };

/* ---------- comportamentos ---------- */
function comportamentos() {

  atualiza();
  addEventListener('scroll', () => { if (!rafId) rafId = requestAnimationFrame(atualiza); }, { passive: true });
  const els = document.querySelectorAll('.rev');
  if ('IntersectionObserver' in window && !reduzMovimento && els.length) {
    document.documentElement.classList.add('rev-on');
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
    els.forEach(el => io.observe(el));

}

/* ---------- pendências [TROCAR] ---------- */
function pendencias() {
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement && /^(SCRIPT|STYLE|NOSCRIPT|OPTION)$/.test(n.parentElement.tagName) ? NodeFilter.FILTER_REJECT : MARCA.test(n.nodeValue) ? (MARCA.lastIndex = 0, NodeFilter.FILTER_ACCEPT) : NodeFilter.FILTER_SKIP) });
  const nos = []; while (w.nextNode()) nos.push(w.currentNode);
  let total = 0;
  nos.forEach(n => {
    const partes = n.nodeValue.split(MARCA); total += partes.length - 1;
    // ?limpo = prévia para o cliente: esconde as marcas. Sem prévia e sem ?limpo, o "[TROCAR]" aparece cru (alerta visível).
    if (modoLimpo) { n.nodeValue = partes.join('').replace(/^\s+/, ''); return; }
    if (!previa) return;
    const f = document.createDocumentFragment();
    partes.forEach((p, i) => { if (i) f.append(h('mark', { class: 'pend' }, 'Trocar')); if (p) f.append(p.replace(/^ /, i ? '' : ' ')); });
    n.replaceWith(f);
  });
  if (modoLimpo) document.title = limpo(document.title);
  const numPend = numeroPendente ? 1 : 0;
  const fotos = document.querySelectorAll('img[data-pendente]').length;
  if (total || fotos || numPend) {
    console.warn('[template] Pendências antes de publicar →', { textos: total, fotos, whatsapp: numPend });
    // Enquanto houver pendência, a página fica fora do Google (noindex). Some sozinho quando tudo for trocado.
    document.head.append(h('meta', { name: 'robots', content: 'noindex, nofollow' }));
  }
  if (previa) {
    let k = -1;
    const bt = h('button', { type: 'button', class: 'previa', 'aria-label': 'Prévia do template: ir para a próxima pendência' }, h('i'),
      h('span', null, 'Prévia: ' + total + ' [TROCAR] · ' + fotos + ' fotos' + (numPend ? ' · WhatsApp' : ''), h('span', { class: 'previa-longo' }, ' — toque para ir à próxima')));
    bt.addEventListener('click', () => {
      const m = [...document.querySelectorAll('mark.pend')]; if (!m.length) return;
      document.querySelectorAll('.pend-foco').forEach(x => x.classList.remove('pend-foco'));
      k = (k + 1) % m.length; const alvo = m[k];
      alvo.scrollIntoView({ block: 'center', behavior: reduzMovimento ? 'auto' : 'smooth' });
      alvo.parentElement && alvo.parentElement.classList.add('pend-foco');
      setTimeout(() => alvo.parentElement && alvo.parentElement.classList.remove('pend-foco'), 1800);
    });
    document.body.append(bt);
  }
}

  const partes = [hero(), consultaRapida(), servicos(), sobre(), primeiraConsulta(), equipe(), galeria(), avaliacoes(), faq(), localizacao(), ctaFinal()].filter(Boolean);

  cabecalho(nav); rodape(); flutuante();
  if (lbItens.length) iniciarLb();
  refreshWa(); jsonld(); comportamentos(); pendencias();
}
if (numeroPendente) console.warn('[template] CONFIG.whatsapp.numero ainda é o número de exemplo.');
montar();

<!--
=====================================================================
CHECKLIST DE ADAPTAÇÃO POR CLIENTE — DENTISTA  (tudo no CONFIG, exceto o item 1)
=====================================================================
[ ] 1. <head> (estático, o WhatsApp/Facebook não rodam JS): <title>, meta description, canonical,
       og:title, og:description, og:url, og:image (foto 1200x630 com URL absoluta).
[ ] 2. CONFIG.negocio: nome, cidade, uf, bairro, rua, cep (acessibilidade e coordenadas são opcionais).
[ ] 3. CONFIG.responsavelTecnico: nome e CRO — OBRIGATÓRIO pelo CFO.
[ ] 4. CONFIG.whatsapp.numero (55 + DDD + número) e as duas mensagens.
[ ] 5. CONFIG.contato, CONFIG.horarios (e horariosSchema, se quiser horário no Google), CONFIG.periodos.

[ ] 7. CONFIG.links: Instagram, Google Maps, mapaEmbed.

[ ] 9. CONFIG.textos: heroTitulo, heroSubtitulo e os demais com [TROCAR].
       "Sem dor, sem pressa" ou parecido SÓ se o cliente confirmar.
[ ] 10. CONFIG.hero.foto + alt (foto REAL, vertical 1200x1500).
[ ] 11. CONFIG.servicos: oferece true/false e descrição de cada um. Sem preço, sem promessa.
[ ] 12. CONFIG.sobre, CONFIG.primeiraConsulta (passos 2 e 3).
[ ] 13. CONFIG.equipe: nome, CRO, especialidade (só se registrada no CFO), foto 960x1200.
[ ] 14. CONFIG.galeria: só ambiente da clínica. NUNCA "antes e depois".
[ ] 15. CONFIG.avaliacoes: só depoimentos reais e autorizados; confirmar com o RT.
[ ] 16. CONFIG.faq: convênios, urgência, parcelamento (sem preço), primeira consulta, crianças.
[ ] 17. CONFIG.rodape: razão social, CNPJ, inscrição da clínica no CRO, crédito.
[ ] 18. CONFIG.planos.ativo = "basico" | "intermediario" | "completo".
[ ] 19. Ctrl+F por "[TROCAR]": precisa dar ZERO resultados no CONFIG e no <head>.
[ ] 20. Mostre ao cliente com ?limpo no fim do link (esconde as etiquetas amarelas).
Obs.: enquanto houver [TROCAR], foto pendente ou WhatsApp de exemplo, a página se marca sozinha
como noindex. Quando tudo estiver trocado, ela volta a ser indexável sem você mexer em nada.
