const HEX = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
const rgb = x => { let s = x.replace('#', ''); if (s.length === 3) s = [...s].map(c => c + c).join(''); const n = parseInt(s, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };

const toHex = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');

const textoSobre = bg => ratio(bg, cor.fundo) >= ratio(bg, cor.texto) ? cor.fundo : cor.texto;

  const ctaTxt = textoSobre(cor.primaria);
  r.setProperty('--cta-texto', ctaTxt);

  const avisos = [];
  if (ratio(cor.texto, cor.fundo) < 4.5) avisos.push('texto x fundo');
  if (ratio(cor.primaria, ctaTxt) < 4.5) avisos.push('botões (primária) — escureça a primária');
  if (ratio(cor.primaria, cor.fundo) < 4.5) avisos.push('links e ícones na primária sobre o fundo');
  if (ratio(suave, sup) < 4.5) avisos.push('texto secundário sobre a secundária — clareie a secundária');
  if (ratio(escura, cor.fundo) < 4.5) avisos.push('seção escura (chamada final)');
  if (avisos.length) console.warn('[template] Contraste abaixo de 4,5:1 em: ' + avisos.join('; '));

/* ---------- pendências [TROCAR] ---------- */
function pendencias() {
  if (demo) { document.head.append(h('meta', { name: 'robots', content: 'noindex, follow' })); return; }
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement && /^(SCRIPT|STYLE|NOSCRIPT|OPTION)$/.test(n.parentElement.tagName) ? NodeFilter.FILTER_REJECT : MARCA.test(n.nodeValue) ? (MARCA.lastIndex = 0, NodeFilter.FILTER_ACCEPT) : NodeFilter.FILTER_SKIP) });
  const nos = []; while (w.nextNode()) nos.push(w.currentNode);
  let total = 0;
  nos.forEach(n => {
    const partes = n.nodeValue.split(MARCA); total += partes.length - 1;
    // ?limpo = prévia para o cliente: esconde as marcas. Sem prévia e sem ?limpo, o "[TROCAR]" aparece cru (alerta visível).
    if (modoLimpo) { n.nodeValue = partes.join('').replace(/^\s+/, ''); return; }
    if (!previa) return;
    const f = document.createDocumentFragment();
    partes.forEach((p, i) => { if (i) f.append(h('mark', { class: 'pend' }, 'Trocar')); if (p) f.append(p.replace(/^ /, i ? '' : ' ')); });
    n.replaceWith(f);
  });
  if (modoLimpo) document.title = limpo(document.title);
  const numPend = numeroPendente ? 1 : 0;
  const fotos = document.querySelectorAll('img[data-pendente]').length;
  if (total || fotos || numPend) {
    console.warn('[template] Pendências antes de publicar →', { textos: total, fotos, whatsapp: numPend });
    // Enquanto houver pendência, a página fica fora do Google (noindex). Some sozinho quando tudo for trocado.
    document.head.append(h('meta', { name: 'robots', content: 'noindex, nofollow' }));
  }
  if (previa) {
    let k = -1;
    const bt = h('button', { type: 'button', class: 'previa', 'aria-label': 'Prévia do template: ir para a próxima pendência' }, h('i'),
      h('span', null, 'Prévia: ' + total + ' [TROCAR] · ' + fotos + ' fotos' + (numPend ? ' · WhatsApp' : ''), h('span', { class: 'previa-longo' }, ' — toque para ir à próxima')));
    bt.addEventListener('click', () => {
      const m = [...document.querySelectorAll('mark.pend')].filter(el => !el.closest('[hidden]')); if (!m.length) return;
      document.querySelectorAll('.pend-foco').forEach(x => x.classList.remove('pend-foco'));
      k = (k + 1) % m.length; const alvo = m[k];
      alvo.scrollIntoView({ block: 'center', behavior: reduzMovimento ? 'auto' : 'smooth' });
      alvo.parentElement && alvo.parentElement.classList.add('pend-foco');
      setTimeout(() => alvo.parentElement && alvo.parentElement.classList.remove('pend-foco'), 1800);
    });
    document.body.append(bt);
  }
}

  let alt = false;
  partes.forEach(p => { const t = p.dataset && p.dataset.tom; if (t === 'auto') { if (alt) p.classList.add('sec--tinta'); alt = !alt; } else if (t) alt = false; main.append(p); });
  const nav = [['tratamentos', 'servicos'], ['primeira-consulta', 'primeira'], ['equipe', 'equipe'], ['perguntas', 'faq'], ['localizacao', 'local']]
    .filter(([id]) => $('#' + id)).map(([id, k]) => ({ id, label: C.textos.nav[k] || 'Primeira consulta' }));
  cabecalho(nav); rodape(); flutuante();
  if (lbItens.length) iniciarLb();
  refreshWa(); jsonld(); comportamentos(); pendencias(); marcarCamposDemo();
}
if (!demo && numeroPendente) console.warn('[template] CONFIG.whatsapp.numero ainda é o número de exemplo.');
montar();
})();
