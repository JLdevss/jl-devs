:root {
  --primaria: #17332a;
  --secundaria: #ffc074;
  --fundo: #f3eee1;
  --texto: #1b3027;
  --cta-texto: #1b3027;
  --primaria-texto: #f3eee1;
  --mist: color-mix(in srgb, var(--fundo) 72%, #9cae91);
  --mist-deep: color-mix(in srgb, var(--fundo) 55%, #9cae91);
  --paper: color-mix(in srgb, var(--fundo) 40%, white);
  --muted: color-mix(in srgb, var(--texto) 77%, var(--fundo));
  --line: color-mix(in srgb, var(--texto) 22%, var(--fundo));
  --sans: 'Manrope', system-ui, sans-serif;
  --serif: 'Fraunces', Georgia, serif;
  --gutter: clamp(1.15rem, 4.15vw, 4.6rem);
  --section: clamp(4.25rem, 8.5vw, 8.5rem);
  --header: 77px;
  --ease: cubic-bezier(.2,.8,.2,1);
  --enter: cubic-bezier(.22,1,.36,1);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header) + 1.1rem); }
body { margin: 0; color: var(--texto); background: var(--fundo); font: 400 1rem/1.55 var(--sans); }
body:has(dialog[open]) { overflow: hidden; }
[hidden] { display: none !important; }
h1, h2, h3, p, ul, ol, dl, dd, figure, blockquote { margin: 0; }
h1, h2, h3 { font-weight: 680; line-height: 1; letter-spacing: -.04em; }
h2 { font-size: clamp(2.75rem, 5.7vw, 5.3rem); text-wrap: balance; }
h3 { font-size: clamp(1.6rem, 2.6vw, 2.35rem); }
img { display: block; width: 100%; height: auto; }
a { color: inherit; text-underline-offset: .24em; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button, a, input, select, summary { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
::selection { background: var(--secundaria); color: var(--cta-texto); }
.container { width: min(calc(100% - 2 * var(--gutter)), 86rem); margin-inline: auto; }
.ico { display: inline-flex; flex: none; width: 1.18em; height: 1.18em; }
.ico svg { width: 100%; height: 100%; }
.vh, .pular:not(:focus) { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.pular:focus { position: fixed; z-index: 99; top: 1rem; left: 1rem; background: var(--paper); padding: .75rem 1rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .62rem; min-height: 3rem; min-width: 0; padding: .7rem 1.2rem; border: 1px solid transparent; border-radius: 100px; text-align: center; text-decoration: none; font-size: .88rem; font-weight: 690; line-height: 1.23; transition: color .18s, background-color .18s, border-color .18s, transform .16s var(--ease); }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(1px); }
.btn--lg { min-height: 3.35rem; padding: .8rem 1.35rem; }
.btn--cta { background: var(--secundaria); color: var(--cta-texto); }
.btn--cta:hover { background: color-mix(in srgb, var(--secundaria) 78%, white); }
.btn--prim { background: var(--primaria); color: var(--primaria-texto); }
.btn--prim:hover { background: color-mix(in srgb, var(--primaria) 86%, black); }
.btn--linha { background: transparent; border-color: currentColor; }
.btn--linha:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
.link-seta, .texto-botao { display: inline-flex; align-items: center; gap: .65rem; padding: 0; border: 0; background: transparent; text-decoration: underline; text-decoration-thickness: 1px; font-weight: 650; text-align: left; }
.link-seta .ico { transition: transform .2s var(--ease); }
.link-seta:hover .ico { transform: translateX(4px); }

.consulta-card { padding: clamp(1.15rem, 2.05vw, 1.8rem) clamp(1rem, 2.45vw, 2.1rem); background: var(--mist); border-radius: 0 0 12px 12px; }
.consulta-card form { display: grid; grid-template-columns: minmax(8rem, .85fr) minmax(0, 3.4fr) auto; gap: .8rem 1.25rem; align-items: center; }
.consulta-titulo h2 { font-size: clamp(1.45rem, 2.6vw, 2rem); line-height: 1.1; text-wrap: initial; }
.consulta-titulo p { font-size: .79rem; margin-top: .28rem; }
.campos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .55rem; }
.campo { min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: .62rem; padding: .44rem .72rem; border-radius: .62rem; border: 1px solid var(--line); background: var(--paper); }
.campo > .ico { grid-row: span 2; }
.campo label { display: block; font-size: .68rem; font-weight: 720; }
.campo input, .campo select { background: transparent; border: 0; width: 100%; min-width: 0; min-height: 1.62rem; padding: 0; font-size: .9rem; }
.campo input::-webkit-date-and-time-value { text-align: left; }
.campo:focus-within { outline: 2px solid var(--primaria); outline-offset: 2px; }
.campo :is(input, select):focus-visible { outline: 0; }
.consulta-acao { min-height: 3.4rem; }
.consulta-escolha { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .7rem; grid-column: 1 / -1; width: fit-content; padding: .15rem .25rem .15rem .8rem; border-radius: 2rem; border: 1px solid var(--line); background: var(--paper); font-size: .86rem; }

.aviso-datas { grid-column: 1 / -1; color: #783324; font-size: .86rem; }
.aviso-datas:empty { display: none; }

.sec { padding-block: var(--section); }
.sec--tinta { background: var(--mist); }
.sec--escura { background: var(--primaria); color: var(--primaria-texto); }
.sec-head { margin-bottom: clamp(1.7rem, 3.7vw, 3.4rem); }
.sec-head h2 { text-wrap: initial; }
.lead { max-width: 34rem; color: var(--muted); font-size: clamp(1rem, 1.5vw, 1.2rem); }
.sec--escura .lead { color: inherit; }
.sec-head > .lead { margin-top: .8rem; }
.sec-head--split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(15rem, .85fr); gap: 1rem 3rem; align-items: end; }
.sec-head--split > .lead { margin: 0 0 .15rem; }
.quartos-grid { display: grid; grid-template-columns: minmax(13rem, .65fr) minmax(0, 1.35fr); align-items: start; gap: 1.5rem clamp(1.5rem, 4.4vw, 4.7rem); }
.quartos-escolha { display: grid; gap: .45rem; }
.quarto-opcao { display: grid; grid-template-columns: 3.65rem minmax(0, 1fr) auto; align-items: center; gap: .65rem; width: 100%; min-height: 4.55rem; padding: .48rem .65rem .48rem .48rem; border: 1px solid transparent; border-radius: 10px; background: transparent; text-align: left; transition: background-color .18s, border-color .18s; }
.quarto-opcao:hover { background: var(--mist); }
.quarto-opcao[aria-pressed='true'] { background: var(--mist); border-color: var(--line); }
.quarto-opcao img { aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
.quarto-opcao--sem-foto, .quarto-opcao:has(img[hidden]) { grid-template-columns: minmax(0, 1fr) auto; padding-inline-start: .85rem; }
.quarto-opcao .quarto-opcao-nome { display: block; font-size: clamp(.93rem, 1.55vw, 1.2rem); font-weight: 700; line-height: 1.13; overflow-wrap: anywhere; }
.quarto-opcao small { display: block; font-size: .8rem; margin-top: .22rem; }
.quarto-sinal { display: grid; place-content: center; width: 2.15rem; height: 2.15rem; border-radius: 50%; }
.quarto-opcao[aria-pressed='true'] .quarto-sinal { color: var(--cta-texto); background: var(--secundaria); }
.quarto { display: grid; min-width: 0; overflow: hidden; border-radius: 12px; background: var(--mist); }
.quarto-foto { position: relative; overflow: hidden; aspect-ratio: 1.98; background: var(--mist-deep); }
.quarto-foto img { height: 100%; object-fit: cover; }
.quarto-corpo { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 1rem; padding: clamp(1rem, 2.5vw, 2.1rem); }
.quarto-texto { display: grid; gap: .7rem; }
.quarto-desc { color: var(--muted); max-width: 44ch; }
.quarto-cap { font-size: .88rem; font-weight: 650; }
.quarto-itens { display: flex; flex-wrap: wrap; gap: .4rem 1rem; list-style: none; padding: 0; font-size: .83rem; }
.quarto-itens li { display: inline-flex; align-items: center; gap: .35rem; }
.quarto-preco { font-weight: 720; }
.nota { margin-top: 1.4rem; color: var(--muted); font-size: .88rem; }
@media (prefers-reduced-motion: no-preference) {
  .quarto[data-trocou] img { animation: quarto-entrada .43s var(--enter) both; }
  @keyframes quarto-entrada { from { opacity: .7; transform: scale(1.025); } }
}

.sobre-grid { display: grid; grid-template-columns: minmax(0, 1.16fr) minmax(0, .84fr); gap: clamp(2rem, 7vw, 7rem); align-items: center; }
.sobre-foto { position: relative; margin: 0 10% 7% 0; }
.sobre-foto > img { aspect-ratio: 1.21; object-fit: cover; border-radius: 12px; }
.sobre-foto .foto-detalhe { position: absolute; width: 46%; height: 62%; bottom: -11%; right: -10%; border: 6px solid var(--mist); border-radius: 12px; overflow: hidden; }
.foto-detalhe img { height: 100%; object-fit: cover; }
.sobre-texto { display: grid; gap: 1rem; }
.sobre-texto h2 { font: 400 clamp(3.65rem, 7vw, 6.5rem)/.88 var(--serif); letter-spacing: -.015em; text-wrap: initial; }
.sobre-texto p { max-width: 43ch; color: var(--muted); }
.sobre-texto .assinatura { font: italic 400 1.75rem/1.15 var(--serif); }
.amen { padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 2rem; list-style: none; }
.amen li { display: flex; align-items: flex-start; gap: .85rem; padding: 1.25rem 0; border-top: 1px solid var(--line); }

.amen strong { display: block; font-size: 1rem; }
.det { display: block; color: var(--muted); font-size: .88rem; }

.galeria-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: clamp(8rem, 18vw, 18rem); gap: .65rem; }
.tile { position: relative; grid-column: span 4; min-width: 0; overflow: hidden; padding: 0; border: 0; border-radius: 8px; background: var(--mist); }
.tile img { height: 100%; object-fit: cover; transition: transform .55s var(--enter); }
button.tile:hover img { transform: scale(1.035); }
.tile-caption { position: absolute; inset: auto .6rem .6rem; display: flex; align-items: center; justify-content: space-between; gap: .5rem; width: fit-content; max-width: calc(100% - 1.2rem); padding: .32rem .54rem; color: var(--texto); background: var(--paper); border-radius: .42rem; font-size: .78rem; font-weight: 650; text-align: left; }
.tile-caption .ico { width: 1.05rem; height: 1.05rem; }
.galeria-grid[data-count='6'] .tile { grid-column: span 3; }
.galeria-grid[data-count='6'] .tile:is(:first-child,:last-child) { grid-column: span 6; }
.galeria-grid[data-count='1'] .tile { grid-column: 1 / -1; }
.galeria-grid[data-count='2'] .tile { grid-column: span 6; }
.galeria-grid[data-resto='1'] .tile:last-child { grid-column: 1 / -1; }
.galeria-grid[data-resto='2'] .tile:nth-last-child(-n+2) { grid-column: span 6; }
.pontos, .passos, .avals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(1.3rem, 4vw, 4rem); padding: 0; list-style: none; }
.ponto, .passo, .aval { display: grid; align-content: start; gap: .7rem; padding: 1.15rem 0; border-top: 1px solid color-mix(in srgb, currentColor 40%, transparent); }
.ponto p, .passo p { max-width: 38ch; font-size: .95rem; }
.pontos-acao { margin-top: 1.4rem; }
.passo-n { width: 2.25rem; height: 2.25rem; display: grid; place-content: center; border: 1px solid var(--line); border-radius: 50%; font-weight: 680; }
.aval blockquote { font: 400 1.85rem/1.07 var(--serif); }
.aval figcaption { font-size: .86rem; }

.chegar { display: grid; gap: clamp(1.8rem, 5vw, 5rem); align-items: center; }
.chegar:has(.mapa) { grid-template-columns: minmax(0, .84fr) minmax(0, 1.16fr); }
.chegar h2 { margin-bottom: 1.5rem; text-wrap: initial; }
.dados { display: grid; gap: .9rem; }
.dados > div { display: grid; grid-template-columns: 1.4rem 1fr; gap: .15rem .6rem; }
.dados .ico { grid-row: span 2; margin-top: .15rem; }
.dados dt { font-weight: 710; }
.dados dd, .rotas p, .atr-lista p { color: var(--muted); font-size: .95rem; }
.rotas { display: grid; gap: .85rem; margin-top: 1.2rem; }
.rotas h3 { font: 710 1rem/1.45 var(--sans); letter-spacing: normal; }
.chegar-acoes { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: 1.5rem; }
.mapa { position: relative; width: 100%; min-width: 0; min-height: 17rem; aspect-ratio: 1.63; overflow: hidden; border-radius: 12px; background: var(--paper); }
.mapa iframe, .mapa img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
.mapa--vazio { display: grid; place-items: center; padding: 1.4rem; border: 1px dashed var(--line); }
.atracoes { margin-top: 2.75rem; }
.atr-lista { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; list-style: none; padding: 1rem 0 0; }
.atr-lista li { padding-top: .8rem; border-top: 1px solid var(--line); }
.dist { display: block; font-size: .8rem; }
.faq-grid { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: clamp(1.6rem, 6vw, 6rem); }
.faq-grid .sec-head { margin-bottom: 0; }
.faq-grid .btn { margin-top: 1rem; }
.faq-lista { border-top: 1px solid var(--line); }
.faq-lista details { border-bottom: 1px solid var(--line); }
.faq-lista summary { display: flex; justify-content: space-between; align-items: center; gap: .75rem; padding: .97rem 0; font-weight: 660; cursor: pointer; list-style: none; }
.faq-lista summary::-webkit-details-marker { display: none; }
.faq-lista summary::after { content: ''; flex: none; width: .62rem; height: .62rem; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); margin-right: .22rem; }
.faq-lista details[open] summary::after { transform: rotate(225deg); }
.faq-resp { padding-bottom: 1.12rem; color: var(--muted); }
.final { position: relative; isolation: isolate; overflow: hidden; min-height: clamp(23rem, 42vw, 37rem); display: grid; align-items: center; }
.final-media { position: absolute; inset: 0; z-index: -1; }
.final-media img { height: 100%; object-fit: cover; object-position: center 42%; }
.final-media::after { content: ''; position: absolute; inset: 0; background: #1b183a9c; }
.final:has(.final-media) { color: #fff; }
.final-in { display: grid; gap: 1.35rem; justify-items: start; }
.final h2 { max-width: 13ch; text-wrap: initial; font: 400 clamp(4rem, 8vw, 8rem)/.85 var(--serif); letter-spacing: -.02em; }
.final p { max-width: 34rem; }
.final-contato { display: flex; flex-wrap: wrap; gap: 1rem; }
.final-contato:empty { display: none; }
.final-contato a { display: inline-flex; align-items: center; gap: .45rem; font-size: .86rem; }
.rodape { padding-block: 3.2rem 1.4rem; background: var(--primaria); color: var(--primaria-texto); }
.rodape-grid { display: grid; grid-template-columns: 1.18fr .9fr 1fr; gap: 2rem; }
.rodape-grid .marca { margin-bottom: .7rem; }
.rodape-grid p, .rodape-grid li { font-size: .9rem; }
.rodape-grid h2 { margin-bottom: .7rem; font: 740 .97rem/1.4 var(--sans); letter-spacing: normal; }
.rodape-grid ul { display: grid; gap: .58rem; padding: 0; list-style: none; }
.rodape-grid li { display: flex; align-items: flex-start; gap: .45rem; }
.rodape-grid li .ico { margin-top: .2rem; }
.rodape-legal { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .75rem 1.2rem; margin-top: 2rem; padding-top: 1.1rem; border-top: 1px solid color-mix(in srgb, currentColor 30%, transparent); font-size: .8rem; }
.flutuante { position: fixed; z-index: 10; bottom: max(1rem, env(safe-area-inset-bottom)); right: max(1rem, env(safe-area-inset-right)); box-shadow: 0 7px 25px #102e2338; }
.flutuante:not([data-visivel]) { visibility: hidden; }

dialog { max-width: calc(100% - 2rem); padding: 0; border: 0; border-radius: 12px; }
dialog::backdrop { background: #142a22d1; }
.lb[open] { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .65rem; width: min(71rem, 96vw); background: var(--primaria); color: var(--primaria-texto); padding: .7rem; }
.lb figure { grid-column: 2; min-width: 0; text-align: center; }
.lb img { width: 100%; height: min(68vh, 48rem); object-fit: contain; }
.lb figcaption { padding-top: .4rem; font-size: .92rem; }
.lb-btn { display: grid; place-content: center; min-width: 2.75rem; min-height: 2.75rem; padding: .3rem; background: transparent; border: 1px solid color-mix(in srgb, currentColor 50%, transparent); border-radius: 50%; }
.lb-btn:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
.lb-x { grid-column: 1 / -1; grid-row: 1; justify-self: end; }
.reserva-dialog { width: 32rem; color: var(--texto); background: var(--fundo); padding: clamp(1.2rem, 4vw, 2rem); }
.reserva-dialog h2 { font-size: clamp(2.1rem, 5vw, 2.85rem); margin-bottom: .85rem; }
.reserva-dialog p + p { margin-top: .85rem; }
.reserva-dialog .reserva-resumo { padding: .8rem .9rem; border-radius: 8px; background: var(--mist); }

.pend { display: inline-block; margin-right: .4em; padding: .2em .45em; border-radius: .22rem; background: #ffe36e; color: #1b1b1b; font: 700 .69rem/1.3 var(--sans); vertical-align: middle; }
.previa { position: fixed; z-index: 15; bottom: 1rem; left: 1rem; max-width: calc(100vw - 11rem); border: 0; border-radius: .32rem; background: var(--primaria); color: var(--primaria-texto); padding: .55rem .75rem; text-align: left; font-size: .74rem; }
.pend-foco { outline: 3px solid #ad7810; outline-offset: 4px; }

@media (max-width: 1100px) {
  .quarto-corpo { grid-template-columns: 1fr; justify-items: start; }
}
@media (max-width: 900px) {
  .topo-in { gap: .7rem; }
  .consulta-card form { grid-template-columns: minmax(0, 1fr) auto; }
  .consulta-titulo { grid-column: 1 / -1; }
  .amen { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 840px) {
  .topo .btn { margin-left: auto; }
}
@media (max-width: 740px) {
  :root { --header: 64px; }
  .topo .btn { margin-left: auto; padding-inline: .82rem; font-size: .79rem; }
  .topo .btn > .ico { display: none; }
  .marca { gap: .42rem; }
  .marca > .ico { width: 2.15rem; height: 2.15rem; }
  .marca-texto small { font-size: .63rem; }
  .sec-head--split { grid-template-columns: 1fr; gap: .7rem; }
  .quartos-grid, .sobre-grid, .chegar:has(.mapa), .faq-grid { grid-template-columns: minmax(0, 1fr); }
  .quartos-grid { gap: .85rem; }
  .quartos-escolha { grid-template-columns: repeat(auto-fit, minmax(min(9.5rem, 100%), 1fr)); }
  .quarto-opcao { grid-template-columns: minmax(0, 1fr) auto; gap: .3rem; }
  .quarto-opcao img { display: none; }
  .quarto-sinal { width: 1.7rem; height: 1.7rem; }
  .quarto-foto { aspect-ratio: 1.53; }
  .sobre-foto { width: 91%; }
  .galeria-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: clamp(7.5rem, 26vw, 11rem); }
  .galeria-grid .tile, .galeria-grid[data-count='6'] .tile { grid-column: span 3; }
  .galeria-grid[data-count='6'] .tile:is(:first-child,:last-child) { grid-column: span 6; }
  .pontos, .passos, .avals, .atr-lista { gap: .85rem 1.2rem; }
  .rodape-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rodape-grid > :first-child { grid-column: 1 / -1; }
}
@media (max-width: 550px) {
  .consulta-card { padding-block: .95rem; }
  .consulta-card form { grid-template-columns: minmax(0, 1fr); }
  .campos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .campo--lg { grid-column: 1 / -1; }
  .campo:not(.campo--lg) { grid-template-columns: minmax(0, 1fr); }
  .campo:not(.campo--lg) > .ico { display: none; }
  .campo input, .campo select { font-size: 1rem; }
  .quartos-escolha { display: flex; flex-wrap: wrap; gap: .42rem; }
  .quarto-opcao { width: auto; min-height: 2.8rem; padding: .47rem .65rem; border-color: var(--line); }
  .quarto-opcao small, .quarto-sinal { display: none; }
  .quarto-opcao[aria-pressed='true'] { color: var(--primaria-texto); background: var(--primaria); }
  .amen { gap: 0 .7rem; }
  .amen li { gap: .45rem; padding-block: .95rem; }
  .amen li > .ico { width: 1.25rem; height: 1.25rem; }
  .amen strong, .det { font-size: .83rem; }
  .pontos, .passos, .avals, .atr-lista { grid-template-columns: minmax(0, 1fr); }
  .tile-caption { font-size: .69rem; }
  .lb[open] { gap: .3rem; max-width: calc(100% - .6rem); }
  .lb-btn { min-width: 2.25rem; min-height: 2.25rem; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .btn:hover, .btn:active, .link-seta:hover .ico, button.tile:hover img { transform: none; }
}

/* Entrada e navegação */
.topo { position: sticky; z-index: 20; top: 0; color: var(--primaria-texto); background: var(--primaria); border-bottom: 1px solid color-mix(in srgb, currentColor 22%, transparent); }
.topo-in { min-height: var(--header); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.marca { display: inline-flex; min-width: 0; align-items: center; gap: .7rem; text-decoration: none; }
.marca > .ico { width: 2.6rem; height: 2.6rem; color: var(--secundaria); }
.marca-texto { display: grid; gap: .2rem; }

.nav { display: flex; gap: clamp(.95rem, 2.8vw, 2.7rem); align-items: center; }

.hero { color: var(--primaria-texto); background: var(--primaria); padding-block: clamp(1.05rem, 2.15vw, 2rem) clamp(2.75rem, 4.6vw, 5rem); }
.hero-deck { position: relative; isolation: isolate; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: stretch; min-height: clamp(32rem, 40.5vw, 43.5rem); }
.hero-content { z-index: 1; grid-column: 1 / span 7; grid-row: 1; align-self: center; width: fit-content; max-width: 100%; padding-block: 2rem 4.75rem; }
.hero h1 { max-width: 13ch; font: 465 clamp(4rem, 7.8vw, 7.6rem)/.91 var(--serif); letter-spacing: -.04em; text-wrap: balance; }
.hero--demo h1 { max-width: none; }
.hero h1 > span { display: block; }
.hero-lead { margin-top: 1.5rem; max-width: 33ch; font-size: clamp(1rem, 1.4vw, 1.22rem); line-height: 1.52; }
.hero-acoes { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem 1.48rem; margin-top: 1.52rem; }
.hero-acoes .btn { min-height: 3.32rem; }
.hero-acoes .link-seta { min-height: 2.75rem; font-size: .86rem; text-decoration-color: color-mix(in srgb, currentColor 53%, transparent); }
.hero-local { display: inline-flex; gap: .52rem; align-items: center; margin-top: clamp(1.48rem, 2.7vw, 2.25rem); font-size: .82rem; font-weight: 640; }
.hero-local .ico { color: var(--secundaria); }
.hero-nota { margin-top: .85rem; max-width: 43ch; font-size: .78rem; }
.hero-palco { position: relative; grid-column: 4 / -1; grid-row: 1; min-width: 0; overflow: hidden; border-radius: 3px; background: color-mix(in srgb, var(--primaria) 72%, var(--fundo)); }
.hero-media { position: absolute; inset: 0; overflow: hidden; }
.hero-media img { height: 100%; object-fit: cover; object-position: 63% 53%; }
.hero-palco::after { position: absolute; inset: 0; content: ''; pointer-events: none; background: linear-gradient(90deg, var(--primaria), color-mix(in srgb, var(--primaria) 78%, transparent) 13%, color-mix(in srgb, var(--primaria) 33%, transparent) 34%, transparent 63%); }
.hero-controls { position: relative; z-index: 2; justify-self: end; align-self: end; grid-column: 5 / -1; grid-row: 1; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: .55rem; margin: 0 .85rem .85rem; }
.hero-views { display: flex; flex-wrap: wrap; padding: .24rem; gap: .16rem; background: var(--primaria); border: 1px solid color-mix(in srgb, var(--primaria-texto) 36%, transparent); border-radius: 99px; }
.hero-view { padding: .38rem .8rem; border: 0; border-radius: 99px; color: var(--primaria-texto); background: transparent; min-height: 2.45rem; font-size: .77rem; font-weight: 740; }

const lum = a => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(a[0]) + .7152 * f(a[1]) + .0722 * f(a[2]); };
const ratio = (a, b) => { const x = lum(rgb(a)), y = lum(rgb(b)); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const toHex = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return toHex(A.map((v, i) => v * (1 - t) + B[i] * t)); };
const cor = { primaria: '#17332a', secundaria: '#ffc074', fundo: '#f3eee1', texto: '#1b3027' };
Object.keys(cor).forEach(k => { if (HEX.test(C.cores[k] || '')) cor[k] = C.cores[k]; else console.error('[template] cor inválida em CONFIG.cores.' + k + ' — use HEX, ex. #0F4C5C'); });
const textoSobre = bg => ratio(bg, cor.fundo) >= ratio(bg, cor.texto) ? cor.fundo : cor.texto;

function aplicarTema() {
  const r = document.documentElement.style;
  r.setProperty('--primaria', cor.primaria); r.setProperty('--secundaria', cor.secundaria);
  r.setProperty('--fundo', cor.fundo); r.setProperty('--texto', cor.texto);
  const ctaTxt = textoSobre(cor.secundaria), primTxt = textoSobre(cor.primaria);
  r.setProperty('--cta-texto', ctaTxt); r.setProperty('--primaria-texto', primTxt);
  const escura = mix(cor.primaria, '#000000', .28);
  const avisos = [];
  if (ratio(cor.texto, cor.fundo) < 4.5) avisos.push('texto x fundo');
  if (ratio(cor.secundaria, ctaTxt) < 4.5) avisos.push('botão principal (secundária)');
  if (ratio(cor.primaria, primTxt) < 4.5) avisos.push('botões e seções na cor primária');
  if (ratio(escura, cor.fundo) < 4.5) avisos.push('primária escura x fundo (texto do hero e seções escuras) — escureça a primária');
  if (avisos.length) console.warn('[template] Contraste abaixo de 4,5:1 em: ' + avisos.join('; '));
  const tc = $('meta[name="theme-color"]'); if (tc) tc.content = escura;
  if (demo) return;
  const ini = (limpo(C.negocio.nome).match(/[\p{L}\p{N}]/u)?.[0] || 'P').toUpperCase();
  const fav = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${cor.primaria}"/><text x="32" y="44" font-family="Georgia,serif" font-size="36" text-anchor="middle" fill="${primTxt}">${ini}</text></svg>`;
  const link = $('link[rel="icon"]'); if (link) link.href = 'data:image/svg+xml,' + encodeURIComponent(fav);
}

/* ---------- fotos e placeholders ---------- */
const TONS = [.5, .32, .66, .22, .42, .6, .28, .54];
function placeholder(w, hgt, rotulo, i, hero) {
  const bg = hero ? mix(cor.primaria, cor.fundo, .3) : mix(cor.primaria, cor.fundo, TONS[(i || 0) % TONS.length]);
  const tx = hero ? cor.fundo : textoSobre(bg);
  if (hero) {
    // No hero o rótulo fica no alto e centralizado: não briga com o título e sobrevive ao corte no celular.
    const fs = Math.round(w / 80), y = Math.round(hgt * .11);
    const svgH = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${hgt}" width="${w}" height="${hgt}">
<defs><pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><line x1="0" y1="0" x2="0" y2="26" stroke="${tx}" stroke-opacity=".07" stroke-width="2"/></pattern></defs>
<rect width="${w}" height="${hgt}" fill="${bg}"/><rect width="${w}" height="${hgt}" fill="url(#p)"/>
<g fill="${tx}" font-family="system-ui,Segoe UI,Arial,sans-serif" text-anchor="middle">
<text x="${w / 2}" y="${y}" font-size="${fs}" font-weight="700" letter-spacing="${fs / 6}">FOTO PENDENTE</text>
<text x="${w / 2}" y="${y + fs * 1.5}" font-size="${fs}" fill-opacity=".9">${rotulo.replace(/[<&>]/g, '')}</text>
<text x="${w / 2}" y="${y + fs * 2.8}" font-size="${fs * .85}" fill-opacity=".75">${w} × ${hgt} px</text></g></svg>`;
    return 'data:image/svg+xml,' + encodeURIComponent(svgH);
  }
  const fs = Math.max(14, Math.round(w / 24)), y = Math.round(hgt * .5);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${hgt}" width="${w}" height="${hgt}">
<defs><pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><line x1="0" y1="0" x2="0" y2="26" stroke="${tx}" stroke-opacity=".09" stroke-width="2"/></pattern></defs>
<rect width="${w}" height="${hgt}" fill="${bg}"/><rect width="${w}" height="${hgt}" fill="url(#p)"/>
<g fill="none" stroke="${tx}" stroke-opacity=".75" stroke-width="${Math.max(2, fs / 9)}" stroke-linecap="round" stroke-linejoin="round" transform="translate(${w / 2 - fs * 1.1} ${y - fs * 3.3}) scale(${fs / 12})">
<rect x="1" y="3" width="22" height="16" rx="3"/><circle cx="8" cy="9" r="2"/><path d="M2 17l6-5 5 4 4-3 5 4"/></g>
<g fill="${tx}" font-family="system-ui,Segoe UI,Arial,sans-serif" text-anchor="middle">
<text x="${w / 2}" y="${y}" font-size="${fs}" font-weight="700" letter-spacing="${fs / 8}">FOTO PENDENTE</text>
<text x="${w / 2}" y="${y + fs * 1.5}" font-size="${fs * .95}" fill-opacity=".92">${rotulo.replace(/[<&>]/g, '')}</text>
<text x="${w / 2}" y="${y + fs * 2.9}" font-size="${fs * .8}" fill-opacity=".75">${w} × ${hgt} px</text></g></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}
function foto(src, o) {
  const w = o.w || 1200, hgt = o.h || 800;
  const img = document.createElement('img');
  img.width = w; img.height = hgt; img.decoding = 'async';
  if (o.eager) { img.loading = 'eager'; img.setAttribute('fetchpriority', 'high'); } else img.loading = 'lazy';
  const usarPlaceholder = () => { img.src = placeholder(w, hgt, o.rotulo || 'Foto', o.i, o.hero); img.alt = '[TROCAR] Foto pendente: ' + (o.rotulo || 'foto'); img.dataset.pendente = '1'; };
  if (src) {
    img.src = src;
    if (o.alt == null) console.warn('[template] Foto sem alt no CONFIG: ' + src);
    img.alt = o.alt === '' ? '' : (limpo(o.alt) || o.rotulo || '');
    img.addEventListener('error', () => { console.warn('[template] Foto não carregou: ' + src); usarPlaceholder(); estado.fotosPend++; }, { once: true });
  } else { usarPlaceholder(); estado.fotosPend++; }
  return img;
}

/* ---------- WhatsApp ---------- */
const numero = String(C.whatsapp.numero || '').replace(/\D/g, '');
const numeroPendente = !numero || /^55\d{2}0{7,}$/.test(numero) || /^5500/.test(numero);
const br = iso => iso.split('-').reverse().join('/');
function datasFrase() {
  if (!on('consultaDatas')) return '';
  const p = [];
  if (estado.ci && estado.co) p.push('Datas: ' + br(estado.ci) + ' a ' + br(estado.co));
  else if (estado.ci) p.push('Check-in em ' + br(estado.ci));
  else if (estado.co) p.push('Check-out em ' + br(estado.co));
  if (estado.hosp) p.push(estado.hosp + (estado.hosp === '1' ? ' hóspede' : ' hóspedes'));

}
function waUrl(tpl, extra) {
  const msg = fill(String(tpl).replace('{datas}', '§DATAS§'), extra).replace('§DATAS§', datasFrase()).replace(/\s+/g, ' ').trim();
  return 'https://wa.me/' + numero + '?text=' + encodeURIComponent(msg);
}
function waBtn(o) {

function waTexto(texto, cls) {

function refreshWa() { waLinks.forEach(l => { l.a.href = waUrl(l.tpl, l.extra); }); }

function abrirConsulta(extra = {}) {

function cabecalho(navItens) {
  const nav = h('nav', { class: 'nav', id: 'menu-secoes', 'aria-label': 'Seções da página' },
    navItens.map(n => h('a', { href: '#' + n.id }, n.label)));

    'aria-expanded': 'false', 'aria-label': 'Abrir menu' }, icon('menu'));
  const alternar = aberto => {
    nav.toggleAttribute('data-open', aberto);
    toggle.setAttribute('aria-expanded', aberto);
    toggle.setAttribute('aria-label', aberto ? 'Fechar menu' : 'Abrir menu');
    toggle.replaceChildren(icon(aberto ? 'close' : 'menu'));
  };

  nav.addEventListener('click', ({ target }) => {
    const link = target.closest('a');

function hero() {
  const tx = C.textos;
  const local = [C.negocio.cidade, C.negocio.uf].filter(Boolean).join(', ');
  const cenas = [C.hero, ...(C.hero.foto ? (C.hero.vistas || []).filter(cena => cena.foto && cena.rotulo) : [])];
  const criarFoto = (cena, i) => foto(cena.foto, {
    alt: cena.alt, w: 1536, h: 1024, rotulo: cena.rotulo || 'Foto principal', eager: i === 0, hero: true, i,
  });
  const imagens = cenas.map(criarFoto);
  const paineis = cenas.map((cena, i) => h('picture', { class: 'hero-media', hidden: i !== 0 },
    cena.fotoMobile ? h('source', { media: '(max-width: 740px)', srcset: cena.fotoMobile }) : null, imagens[i]));
  paineis[0].setAttribute('data-chegada', '');

  let ativa = 0;
  let pedido = 0;
  const feedback = h('p', { class: 'hero-feedback', role: 'status' });
  const botoes = cenas.map((cena, i) => h('button', { class: 'hero-view', type: 'button', 'aria-pressed': String(i === 0),
    onclick: () => trocarFoto(i) }, cena.rotulo || 'A pousada'));
  async function trocarFoto(i) {
    const atual = ++pedido;
    feedback.textContent = '';
    feedback.setAttribute('data-ok', '');
    if (i === ativa) return;
    if (imagens[i].dataset.pendente) {
      const substituta = criarFoto(cenas[i], i);
      imagens[i].replaceWith(substituta);
      imagens[i] = substituta;
    }
    const img = imagens[i];
    img.loading = 'eager';
    try {
      await img.decode();
      if (img.dataset.pendente) throw new Error('Foto indisponível');
    } catch {
      if (atual === pedido) {
        feedback.removeAttribute('data-ok');
        feedback.textContent = 'A foto não carregou. Tente novamente.';
      }
      return;
    }
    if (atual !== pedido) return;
    paineis[ativa].hidden = true;
    paineis[ativa].removeAttribute('data-chegada');
    botoes[ativa].setAttribute('aria-pressed', 'false');
    ativa = i;
    paineis[ativa].hidden = false;
    paineis[ativa].setAttribute('data-chegada', '');
    botoes[ativa].setAttribute('aria-pressed', 'true');
    feedback.textContent = cenas[i].rotulo + ' em exibição.';
  }
  const temGaleria = on('galeria') && C.galeria.length;
  const ampliar = temGaleria && on('lightbox') && C.hero.foto;
  const acaoFoto = ampliar ? h('button', { type: 'button', class: 'hero-fotos', 'aria-label': 'Ampliar a foto em exibição', onclick: () => {
    const fotoAtual = imagens[ativa], cena = cenas[ativa];

    lbItens[indice] = { src: fotoAtual.currentSrc || cena.foto, alt: limpo(cena.alt), legenda: cena.rotulo || limpo(C.negocio.nome),
      w: fotoAtual.naturalWidth || 1536, h: fotoAtual.naturalHeight || 1024 };
    abrirLb(indice);
  } }, icon('expand')) : temGaleria ? h('a', { class: 'hero-fotos', href: '#galeria', 'aria-label': 'Ver galeria de fotos' }, icon('pictures')) : null;
  const titulo = demo && tx.heroLinhas ? tx.heroLinhas.map((linha, i) => h('span', null, i ? [' ', linha] : linha)) : rich(fill(tx.heroTitulo));
  const controleVistas = cenas.length > 1 ? h('div', { class: 'hero-views', role: 'group', 'aria-label': 'Fotos da abertura' }, botoes) : null;
  return h('section', { class: 'hero' + (demo ? ' hero--demo' : ''), id: 'hero', 'aria-labelledby': 'h1', 'data-enter': true },
    h('div', { class: 'container hero-deck' },
      h('div', { class: 'hero-palco' }, paineis),
      (controleVistas || acaoFoto) ? h('div', { class: 'hero-controls' }, controleVistas, acaoFoto, feedback) : null,
      h('div', { class: 'hero-content' }, h('h1', { id: 'h1' }, titulo),
        h('p', { class: 'hero-lead' }, fill(tx.heroSubtitulo)),
        h('div', { class: 'hero-acoes' }, reservar(tx.botaoPrincipal, 'btn--cta'),
          on('quartos') && C.quartos.length ? h('a', { class: 'link-seta', href: '#quartos' }, tx.verQuartos, icon('arrow')) : null),
        local ? h('p', { class: 'hero-local' }, icon('pin'), local) : null,
        tx.heroNota ? h('p', { class: 'hero-nota' }, fill(tx.heroNota)) : null)));
}

/* ---------- lightbox ---------- */
let lbI = 0;
function abrirLb(i) { const d = $('#lightbox'); lbI = i; mostrarLb(); if (!d.open) d.showModal(); }
function mostrarLb() {
  const d = $('#lightbox'), it = lbItens[lbI]; if (!it) return;
  const img = $('img', d); img.width = it.w; img.height = it.h; img.src = it.src; img.alt = it.alt;
  $('figcaption', d).textContent = it.legenda || '';
  d.setAttribute('aria-label', 'Galeria de fotos, foto ' + (lbI + 1) + ' de ' + lbItens.length);
}
function iniciarLb() {
  const d = $('#lightbox');
  const primeira = lbItens[0];
  $('figure', d).prepend(h('img', { alt: primeira.alt, width: primeira.w, height: primeira.h, decoding: 'async' }));
  $('[data-lb=x]', d).append(icon('close')); $('[data-lb=prev]', d).append(icon('prev')); $('[data-lb=next]', d).append(icon('next'));
  const nav = k => { lbI = (lbI + k + lbItens.length) % lbItens.length; mostrarLb(); };
  d.addEventListener('click', e => { const b = e.target.closest('[data-lb]'); if (b) { const k = b.dataset.lb; if (k === 'x') d.close(); else nav(k === 'next' ? 1 : -1); } else if (e.target === d) d.close(); });
  d.addEventListener('keydown', e => { if (e.key === 'ArrowRight') nav(1); if (e.key === 'ArrowLeft') nav(-1); });
  let x0 = null;
  d.addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; }, { passive: true });
  d.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) nav(dx < 0 ? 1 : -1); x0 = null; }, { passive: true });
}

    sameAs: [C.links.instagram, C.links.facebook].filter(Boolean),

      occupancy: q.capacidadeMax ? { '@type': 'QuantitativeValue', maxValue: q.capacidadeMax } : undefined,

/* ---------- pendências [TROCAR] ---------- */
function pendencias() {
  if (demo) {
    document.head.append(h('meta', { name: 'robots', content: 'noindex, follow' }));
    return;
  }
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement && /^(SCRIPT|STYLE|NOSCRIPT)$/.test(n.parentElement.tagName) ? NodeFilter.FILTER_REJECT : n.nodeValue.includes('[TROCAR]') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP) });
  const nos = []; while (w.nextNode()) nos.push(w.currentNode);
  let total = 0;
  nos.forEach(n => {
    const partes = n.nodeValue.split(MARCA); total += partes.length - 1;
    // ?limpo = prévia para o cliente: esconde as marcas. Sem prévia e sem ?limpo, o "[TROCAR]" aparece cru (alerta visível).
    if (modoLimpo) { n.nodeValue = partes.join('').replace(/^\s+/, ''); return; }
    if (!previa) return;
    const f = document.createDocumentFragment();
    partes.forEach((p, i) => { if (i) f.append(h('mark', { class: 'pend' }, 'Trocar')); if (p) f.append(p.replace(/^ /, i ? '' : ' ')); });
    n.replaceWith(f);
  });
  if (modoLimpo) document.title = limpo(document.title);
  const numPend = numeroPendente ? 1 : 0;
  const fotos = document.querySelectorAll('img[data-pendente]').length;
  const resumo = { textos: total, fotos, whatsapp: numPend };
  if (total || fotos || numPend) {
    console.warn('[template] Pendências antes de publicar →', resumo);
    // Enquanto houver pendência, a página fica fora do Google (noindex). Some sozinho quando tudo for trocado.
    document.head.append(h('meta', { name: 'robots', content: 'noindex, nofollow' }));
  }
  if (previa) {
    const marcas = () => [...document.querySelectorAll('mark.pend')].filter(el => !el.closest('[hidden]'));
    let k = -1;
    const bt = h('button', { type: 'button', class: 'previa', 'aria-label': 'Prévia do template: ir para a próxima pendência' }, h('i'),
      h('span', null, 'Prévia: ' + total + ' [TROCAR] · ' + fotos + ' fotos' + (numPend ? ' · WhatsApp' : ''), h('span', { class: 'previa-longo' }, ' — toque para ir à próxima')));
    bt.addEventListener('click', () => {
      const m = marcas(); if (!m.length) return;
      document.querySelectorAll('.pend-foco').forEach(x => x.classList.remove('pend-foco'));
      k = (k + 1) % m.length; const alvo = m[k];
      alvo.scrollIntoView({ block: 'center', behavior: reduzMovimento ? 'auto' : 'smooth' });
      alvo.parentElement && alvo.parentElement.classList.add('pend-foco');
      setTimeout(() => alvo.parentElement && alvo.parentElement.classList.remove('pend-foco'), 1800);
    });
    document.body.append(bt);
  }
}

/* ---------- montagem ---------- */
function montar() {
  aplicarTema(); seo();
  const main = $('#conteudo');
  const partes = [hero(), consulta(), quartos(), sobre(), comodidades(), galeria(), porQueDireto(), comoFunciona(), avaliacoes(), comoChegar(), faq(), ctaFinal()].filter(Boolean);
  partes.forEach(p => {
    if (['sobre', 'como-funciona', 'perguntas'].includes(p.id)) p.classList.add('sec--tinta');
    main.append(p);
  });
  const nav = [['quartos', 'quartos'], ['sobre', 'sobre'], ['galeria', 'galeria'], ['como-chegar', 'comoChegar'], ['perguntas', 'faq']]
    .filter(([id]) => $('#' + id)).map(([id, k]) => ({ id, label: C.textos.nav[k] || 'A pousada' }));
  cabecalho(nav); rodape(); flutuante();
  if (lbItens.length) iniciarLb();
  refreshWa(); jsonld(); comportamentos(); pendencias();
  marcarCamposDemo();
}
if (!demo && numeroPendente) console.warn('[template] CONFIG.whatsapp.numero ainda é o número de exemplo.');
montar();
})();
</script>
