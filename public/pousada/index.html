<style>
/* ==========================================================================
   Tokens. As 4 cores vêm do CONFIG.cores; o resto é derivado delas.
   ========================================================================== */
:root{
  --primaria:#0F4C5C; --secundaria:#E08A3C; --fundo:#FAF6EF; --texto:#1E2A2D;
  --cta-texto:#1E2A2D; --primaria-texto:#FAF6EF;

  --primaria-escura:color-mix(in oklab,var(--primaria) 72%,#000);
  --rodape-bg:color-mix(in oklab,var(--primaria) 52%,#000);
  --papel:var(--fundo);
  --papel-2:color-mix(in oklab,color-mix(in oklab,var(--fundo) 90%,var(--secundaria)) 94%,var(--texto));
  --tinta:var(--texto);
  --tinta-suave:color-mix(in oklab,var(--texto) 76%,var(--fundo));
  --linha:color-mix(in oklab,var(--texto) 16%,var(--fundo));
  --campo:color-mix(in oklab,var(--fundo) 55%,#fff);
  --cta:var(--secundaria);
  --cta-hover:color-mix(in oklab,var(--secundaria) 86%,#000);
  --foco:var(--primaria-escura);

  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --gutter:clamp(1.25rem,5vw,3rem);
  --max:1200px;
  --sec:clamp(4.5rem,9vw,8rem);
  --raio:16px;
}

/* ==========================================================================
   Base
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:4.75rem;accent-color:var(--primaria);color-scheme:light}
body{margin:0;background:var(--papel);color:var(--tinta);font:400 1.0625rem/1.62 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scrollbar-color:color-mix(in oklab,var(--primaria) 55%,var(--fundo)) var(--papel-2)}
img,svg{display:block;max-width:100%}
img{height:auto}
h1,h2,h3,p,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em}
button,input,select{font:inherit;color:inherit}
::selection{background:var(--cta);color:var(--cta-texto)}
input,select{caret-color:var(--primaria)}
:focus-visible{outline:3px solid var(--foco);outline-offset:3px;border-radius:4px}
section[id]{scroll-margin-top:4.5rem}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pular{position:fixed;left:1rem;top:-4rem;z-index:100;background:var(--tinta);color:var(--fundo);padding:.75rem 1.1rem;border-radius:10px;transition:top .2s var(--ease)}
.pular:focus{top:1rem}
.container{width:min(100% - 2*var(--gutter),var(--max));margin-inline:auto}
.ico{display:inline-flex;width:1.35em;height:1.35em;flex:none}
.ico svg{width:100%;height:100%}
.tnum{font-variant-numeric:tabular-nums}

h1,h2,h3{font-family:var(--serif);font-optical-sizing:auto;font-weight:400;text-wrap:balance}
h1 em,h2 em{font-style:italic}
h2{font-size:clamp(2rem,1.3rem + 2.9vw,3.5rem);line-height:1.06;letter-spacing:-.015em}
h3{font-size:1.5rem;line-height:1.2;letter-spacing:-.005em;font-weight:500}
p{text-wrap:pretty}

/* ==========================================================================
   Botões
   ========================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.65rem;min-height:3.25rem;padding:.8rem 1.6rem;border-radius:999px;border:2px solid transparent;font-weight:600;font-size:1rem;line-height:1.2;text-align:center;text-decoration:none;cursor:pointer;transition:background-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease),color .25s,border-color .25s}
.btn .ico{width:1.4em;height:1.4em}
.btn--cta{background:var(--cta);color:var(--cta-texto)}
.btn--prim{background:var(--primaria);color:var(--primaria-texto)}
.btn--linha{background:transparent;border-color:currentColor;color:inherit}
.btn--sm{min-height:2.75rem;padding:.5rem 1.1rem;font-size:.95rem}
.btn--lg{min-height:3.6rem;padding:1rem 2rem;font-size:1.0625rem}
.btn:active{transform:scale(.985)}
@media (hover:hover){
  .btn--cta:hover{background:var(--cta-hover);transform:translateY(-2px);box-shadow:0 14px 26px -12px rgba(0,0,0,.5)}
  .btn--prim:hover{background:var(--primaria-escura);transform:translateY(-2px);box-shadow:0 14px 26px -12px rgba(0,0,0,.4)}
  .btn--linha:hover{background:color-mix(in oklab,currentColor 10%,transparent)}
}
.link-seta{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:.1rem}
.link-seta .ico{width:1.1em;height:1.1em;transition:transform .3s var(--ease)}
@media (hover:hover){.link-seta:hover .ico{transform:translateX(4px)}}

/* ==========================================================================
   Cabeçalho
   ========================================================================== */
.topo{position:fixed;inset:0 0 auto 0;z-index:50;color:var(--fundo);--foco:var(--fundo);transition:background-color .4s var(--ease),color .4s var(--ease),box-shadow .4s var(--ease)}
.topo[data-solido]{background:color-mix(in oklab,var(--papel) 93%,transparent);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);color:var(--tinta);--foco:var(--primaria-escura);box-shadow:0 1px 0 var(--linha)}
.topo-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:4.25rem}
.marca{font-family:var(--serif);font-size:1.3rem;font-weight:500;letter-spacing:-.01em;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.topo .btn{white-space:nowrap;flex:none}
@media (max-width:380px){.marca{font-size:1.15rem}.topo .btn--sm{padding-inline:.85rem;gap:.45rem}}
@media (min-width:1000px){.marca{flex:0 1 auto}}
.nav{display:none;gap:1.75rem;font-size:.97rem;font-weight:500}
.nav a{text-decoration:none;padding:.4rem 0;border-bottom:1px solid transparent;transition:border-color .25s}
@media (hover:hover){.nav a:hover{border-bottom-color:currentColor}}
@media (min-width:1000px){.nav{display:flex}}

/* ==========================================================================
   Hero — a foto é a protagonista
   ========================================================================== */
.hero{position:relative;isolation:isolate;overflow:clip;display:grid;align-items:end;min-height:max(35rem,100svh);color:var(--fundo);--foco:var(--fundo)}
.hero-media{position:absolute;inset:0;z-index:-2;background:var(--primaria-escura)}
.hero-media img{width:100%;height:100%;object-fit:cover}
.hero-scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,
  color-mix(in oklab,var(--primaria-escura) 92%,transparent) 0%,
  color-mix(in oklab,var(--primaria-escura) 72%,transparent) 36%,
  color-mix(in oklab,var(--primaria-escura) 22%,transparent) 68%,
  color-mix(in oklab,var(--primaria-escura) 46%,transparent) 100%)}
.hero-content{padding-top:9rem;padding-bottom:clamp(3rem,8vw,6rem);display:grid;gap:1.5rem;justify-items:start}
.hero--consulta .hero-content{padding-bottom:calc(clamp(3rem,8vw,6rem) + 3.5rem)}
.hero h1{font-size:clamp(2.55rem,1.4rem + 5.4vw,5.25rem);line-height:1.02;letter-spacing:-.025em;max-width:15ch}
.hero-lead{font-size:clamp(1.1rem,1rem + .5vw,1.3rem);line-height:1.5;max-width:46ch;color:color-mix(in oklab,var(--fundo) 94%,transparent)}
.hero-acoes{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.75rem;margin-top:.5rem}
.hero-nota{font-size:.95rem;color:color-mix(in oklab,var(--fundo) 86%,transparent);max-width:52ch}
@media (max-width:560px){.hero-acoes .btn--cta{width:100%}}

@media (prefers-reduced-motion:no-preference){
  .hero-media img{animation:hero-img 1.9s var(--ease) both}
  .hero-content>*{animation:hero-in 1s var(--ease) both}
  .hero-content>:nth-child(1){animation-delay:.12s}
  .hero-content>:nth-child(2){animation-delay:.26s}
  .hero-content>:nth-child(3){animation-delay:.4s}
  .hero-content>:nth-child(4){animation-delay:.52s}
  @keyframes hero-img{from{transform:scale(1.09)}to{transform:scale(1)}}
  @keyframes hero-in{from{opacity:0;transform:translateY(22px);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
}

/* ==========================================================================
   Barra de datas (plano Completo)
   ========================================================================== */
.consulta{position:relative;z-index:3;margin-top:-3.5rem}
.consulta-card{background:var(--papel);border-radius:22px;padding:clamp(1.1rem,3vw,1.75rem);box-shadow:0 28px 60px -24px rgba(8,22,26,.45),0 2px 6px rgba(8,22,26,.08);display:grid;gap:1rem 1.25rem}
.consulta-card legend{font-family:var(--serif);font-size:1.35rem;font-weight:500;padding:0;margin-bottom:.9rem;display:block;width:100%}
.consulta fieldset{border:0;margin:0;padding:0;min-width:0}
.campos{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr)}
.campo{display:grid;gap:.35rem;min-width:0}
.campo input,.campo select{min-width:0}
@media (min-width:440px){.campos{grid-template-columns:repeat(2,minmax(0,1fr))}.campo--lg{grid-column:1/-1}}
.campo label{font-size:.85rem;font-weight:600;color:var(--tinta-suave)}
.campo input,.campo select{width:100%;min-height:3.25rem;padding:.6rem .9rem;background:var(--campo);border:1.5px solid color-mix(in oklab,var(--texto) 32%,var(--fundo));border-radius:12px;transition:border-color .2s,box-shadow .2s}
.campo input:hover,.campo select:hover{border-color:var(--primaria)}
.campo input:focus-visible,.campo select:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.consulta-acao{display:grid;align-content:end}
.consulta-acao .btn{width:100%}
.aviso-datas{font-size:.9rem;color:var(--tinta-suave)}
.aviso-datas:not(:empty){margin-top:.75rem}
.consulta-corpo{display:grid;gap:1rem 1.25rem;align-items:end}
@media (min-width:860px){
  .consulta{margin-top:-4.25rem}
  .consulta-card legend{margin-bottom:.25rem}
  .campos{grid-template-columns:repeat(3,minmax(0,1fr))}
  .campo--lg{grid-column:auto}
}
@media (min-width:1120px){
  .consulta-corpo{grid-template-columns:minmax(0,1fr) auto}
  .consulta-acao .btn{white-space:nowrap}
}

/* ==========================================================================
   Seções
   ========================================================================== */
.sec{padding-block:var(--sec)}
.sec--tinta{background:var(--papel-2)}
.sec--escura{background:var(--primaria-escura);color:var(--fundo);--foco:var(--fundo)}
.sec-head{display:grid;gap:1rem 4rem;margin-bottom:clamp(2.25rem,5vw,3.75rem)}
.sec-head .lead{color:var(--tinta-suave);max-width:46ch;font-size:1.1rem}
.sec--escura .sec-head .lead{color:color-mix(in oklab,var(--fundo) 84%,transparent)}
@media (min-width:900px){.sec-head{grid-template-columns:minmax(0,6fr) minmax(0,5fr);align-items:end}}

/* Quartos */
.quartos-grid{display:grid;gap:clamp(1.25rem,3vw,2rem);grid-template-columns:repeat(auto-fill,minmax(min(100%,20.5rem),1fr))}
.quarto{display:flex;flex-direction:column;background:var(--papel-2);border-radius:var(--raio);overflow:hidden}
.sec--tinta .quarto{background:var(--papel)}
.quarto-foto{aspect-ratio:4/3;overflow:hidden;background:var(--papel-2)}
.quarto-foto img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
@media (hover:hover){.quarto:hover .quarto-foto img{transform:scale(1.04)}}
.quarto-corpo{display:flex;flex-direction:column;gap:1rem;padding:1.5rem 1.5rem 1.6rem;flex:1}
.quarto-cap{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.95rem;color:var(--primaria)}
.quarto-desc{color:var(--tinta-suave);max-width:60ch}
.quarto-itens{display:grid;gap:.45rem;font-size:.97rem}
.quarto-itens li{display:flex;gap:.6rem;align-items:flex-start}
.quarto-itens .ico{width:1.15em;height:1.15em;margin-top:.22em;color:var(--primaria)}
.quarto-preco{font-weight:600}
.quarto .btn{margin-top:auto}
.quarto-corpo>.btn{align-self:stretch}
.nota{margin-top:clamp(1.5rem,3vw,2.25rem);color:var(--tinta-suave);font-size:.97rem;max-width:62ch}

/* Sobre */
.sobre-grid{display:grid;gap:clamp(2rem,5vw,4.5rem);align-items:center}
.sobre-foto{aspect-ratio:4/5;border-radius:var(--raio);overflow:hidden;max-width:30rem}
.sobre-foto img{width:100%;height:100%;object-fit:cover}
.sobre-texto{display:grid;gap:1.25rem;max-width:56ch}
.sobre-texto p{font-size:1.125rem}
.assinatura{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--primaria)}
@media (min-width:900px){.sobre-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}

/* Comodidades */
.amen{display:grid;gap:0 clamp(1.5rem,4vw,3.5rem);grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr))}
.amen li{display:flex;gap:1rem;align-items:flex-start;padding-block:1.15rem;border-top:1px solid var(--linha)}
.amen .ico{width:1.7rem;height:1.7rem;color:var(--primaria);margin-top:.1rem}
.amen strong{display:block;font-weight:600}
.amen span.det{display:block;color:var(--tinta-suave);font-size:.95rem;margin-top:.1rem}

/* Galeria */
.galeria-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(9rem,40vw,13rem);grid-auto-flow:dense;gap:.7rem}
.tile{position:relative;overflow:hidden;border-radius:12px;background:var(--papel-2);margin:0;padding:0;border:0;display:block;width:100%;height:100%}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.tile--big{grid-column:span 2;grid-row:span 2}
.tile--wide{grid-column:span 2}
.tile--tall{grid-row:span 2}
button.tile{cursor:zoom-in}
@media (hover:hover){button.tile:hover img{transform:scale(1.05)}}
@media (min-width:760px){.galeria-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:13rem;gap:1rem}}
@media (min-width:1100px){.galeria-grid{grid-auto-rows:15.5rem}}

/* Lightbox */
.lb{border:0;padding:0;width:100%;height:100%;max-width:none;max-height:none;background:transparent;color:#fff}
.lb::backdrop{background:rgba(6,16,19,.93)}
.lb[open]{display:grid;place-items:center;grid-template-columns:auto minmax(0,1fr) auto;gap:.5rem;padding:1rem}
.lb figure{display:grid;gap:.9rem;justify-items:center;min-width:0}
.lb img{max-width:100%;max-height:78vh;width:auto;height:auto;object-fit:contain;border-radius:8px}
.lb figcaption{font-size:.97rem;color:rgba(255,255,255,.88);text-align:center;max-width:60ch;min-height:1.4em}
.lb-btn{display:grid;place-items:center;width:3rem;height:3rem;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;transition:background-color .2s}
.lb-btn:hover{background:rgba(255,255,255,.2)}
.lb :focus-visible{outline-color:#fff}
.lb-x{position:absolute;top:1rem;right:1rem}
@media (max-width:640px){
  .lb[open]{grid-template-columns:1fr;align-content:center}
  .lb-prev,.lb-next{position:absolute;bottom:1.25rem}
  .lb-prev{left:1rem}.lb-next{right:1rem}
}

/* Por que reservar direto */
.pontos{display:grid;gap:2.25rem clamp(1.5rem,4vw,3.5rem)}
.ponto{border-top:1px solid color-mix(in oklab,var(--fundo) 35%,transparent);padding-top:1.5rem;display:grid;gap:.75rem;align-content:start}
.ponto p{color:color-mix(in oklab,var(--fundo) 86%,transparent);max-width:38ch}
.pontos-acao{margin-top:clamp(2.25rem,5vw,3.5rem)}
@media (min-width:860px){.pontos{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Como funciona */
.passos{display:grid;gap:2.25rem clamp(1.5rem,4vw,3.5rem);counter-reset:passo}
.passo{display:grid;gap:.6rem;align-content:start;grid-template-columns:auto 1fr;column-gap:1.25rem}
.passo-n{grid-row:span 2;font-family:var(--serif);font-size:4rem;line-height:.9;color:var(--primaria);font-weight:400;min-width:2.2rem}
.passo p{color:var(--tinta-suave);max-width:36ch}
@media (min-width:860px){
  .passos{grid-template-columns:repeat(3,minmax(0,1fr))}
  .passo{grid-template-columns:1fr;row-gap:.75rem}
  .passo-n{grid-row:auto;font-size:5rem}
}

/* Avaliações */
.avals{display:grid;gap:clamp(1.5rem,3vw,2.5rem);grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr))}
.aval{display:grid;gap:1.25rem;align-content:space-between;padding-top:1.5rem;border-top:1px solid var(--linha)}
.aval blockquote{font-family:var(--serif);font-size:1.4rem;line-height:1.35;letter-spacing:-.005em}
.aval cite{font-style:normal;font-size:.95rem;color:var(--tinta-suave)}
.aval cite strong{color:var(--tinta);font-weight:600}

/* Como chegar */
.chegar{display:grid;gap:clamp(2rem,5vw,4rem)}
@media (min-width:960px){.chegar{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
.dados{display:grid;gap:0}
.dados>div{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;padding-block:1.1rem;border-top:1px solid var(--linha)}
.dados .ico{width:1.5rem;height:1.5rem;color:var(--primaria);grid-row:span 2;margin-top:.15rem}
.dados dt{font-weight:600}
.dados dd{color:var(--tinta-suave)}
.rotas{display:grid;gap:1rem;margin-top:1.75rem}
.rotas h3{font-size:1.15rem;font-family:var(--sans);font-weight:600;letter-spacing:0}
.rotas p{color:var(--tinta-suave)}
.chegar-acoes{margin-top:1.75rem;display:flex;flex-wrap:wrap;gap:.75rem}
.mapa{aspect-ratio:4/3;border-radius:var(--raio);overflow:hidden;background:var(--papel-2);display:grid;place-items:center;text-align:center;padding:1rem;color:var(--tinta-suave)}
.sec--tinta .mapa{background:var(--papel)}
.mapa--vazio{border:1.5px dashed color-mix(in oklab,var(--texto) 30%,transparent)}
.mapa:has(iframe){padding:0}
.mapa iframe{width:100%;height:100%;border:0;display:block}
@media (min-width:960px){.mapa{position:sticky;top:6rem}}
@media (max-width:959px){.mapa{aspect-ratio:1/1}}
.atracoes{margin-top:clamp(3rem,6vw,5rem)}
.atracoes h3{font-size:clamp(1.5rem,1.2rem + 1vw,2rem);margin-bottom:1.25rem}
.atr-lista{display:grid;gap:0 clamp(1.5rem,4vw,3.5rem);grid-template-columns:repeat(auto-fill,minmax(min(100%,18rem),1fr))}
.atr-lista li{padding-block:1.1rem;border-top:1px solid var(--linha);display:grid;gap:.15rem}
.atr-lista strong{font-weight:600}
.atr-lista .dist{font-size:.9rem;font-weight:600;color:var(--primaria)}
.atr-lista p{color:var(--tinta-suave);font-size:.97rem}

/* FAQ */
.faq-grid{display:grid;gap:2rem clamp(2rem,6vw,5rem)}
@media (min-width:960px){.faq-grid{grid-template-columns:minmax(0,4fr) minmax(0,7fr);align-items:start}.faq-grid .sec-head{display:grid;grid-template-columns:1fr;margin-bottom:0;position:sticky;top:6rem}}
.faq-lista{border-bottom:1px solid var(--linha)}
.faq-lista details{border-top:1px solid var(--linha)}
.faq-lista summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:1.5rem;min-height:3.75rem;padding-block:1rem;font-weight:600;font-size:1.1rem}
.faq-lista summary::-webkit-details-marker{display:none}
.faq-lista summary::after{content:"";flex:none;width:1.1rem;height:1.1rem;background:
  linear-gradient(var(--primaria),var(--primaria)) center/100% 2px no-repeat,
  linear-gradient(var(--primaria),var(--primaria)) center/2px 100% no-repeat;transition:transform .4s var(--ease)}
.faq-lista details[open] summary::after{transform:rotate(135deg)}
@media (hover:hover){.faq-lista summary:hover{color:var(--primaria)}}
.faq-resp{padding:0 3rem 1.5rem 0;color:var(--tinta-suave);max-width:60ch}

/* Chamada final */
.final{text-align:left}
.final-in{display:grid;gap:1.75rem;justify-items:start}
.final h2{font-size:clamp(2.25rem,1.3rem + 4vw,4.5rem);line-height:1.02;max-width:18ch;letter-spacing:-.02em}
.final p{max-width:48ch;font-size:1.15rem;color:color-mix(in oklab,var(--fundo) 86%,transparent)}
.final-contato{display:flex;flex-wrap:wrap;gap:.5rem 2rem;font-size:1rem}
.final-contato a{display:inline-flex;gap:.5rem;align-items:center}
.final-contato .ico{width:1.15em;height:1.15em}

/* Rodapé */
.rodape{background:var(--rodape-bg);color:color-mix(in oklab,var(--fundo) 88%,transparent);padding-block:clamp(3rem,6vw,4.5rem) 2rem;font-size:.97rem;--foco:var(--fundo)}
.rodape-grid{display:grid;gap:2.25rem clamp(2rem,5vw,4rem)}
@media (min-width:860px){.rodape-grid{grid-template-columns:minmax(0,5fr) minmax(0,3fr) minmax(0,4fr)}}
.rodape .logo{font-family:var(--serif);font-size:1.7rem;font-weight:500;color:var(--fundo);margin-bottom:.6rem;text-wrap:balance}
.rodape h2{font-family:var(--sans);font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fundo);margin-bottom:.9rem;line-height:1.3}
.rodape ul{display:grid;gap:.55rem}
.rodape a{text-decoration-color:color-mix(in oklab,var(--fundo) 40%,transparent)}
@media (hover:hover){.rodape a:hover{text-decoration-color:currentColor}}
.rodape li{display:flex;gap:.6rem;align-items:flex-start}
.rodape .ico{width:1.15em;height:1.15em;margin-top:.25em;flex:none}
.rodape-legal{margin-top:clamp(2.25rem,5vw,3.5rem);padding-top:1.5rem;border-top:1px solid color-mix(in oklab,var(--fundo) 22%,transparent);display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between;font-size:.88rem;color:color-mix(in oklab,var(--fundo) 78%,transparent)}

/* Botão flutuante (celular) */
.flutuante{position:fixed;z-index:60;right:max(1rem,env(safe-area-inset-right));bottom:max(1rem,env(safe-area-inset-bottom));transform:translateY(160%);transition:transform .6s var(--ease);box-shadow:0 16px 30px -10px rgba(0,0,0,.5);--foco:var(--tinta)}
.flutuante[data-visivel]{transform:none}
@media (min-width:900px){.flutuante{display:none}}
@media (max-width:899px){body{padding-bottom:0}.rodape{padding-bottom:6rem}}

/* Entrada ao rolar: só em grupos de itens, nunca em seção inteira */
.rev-on .rev{opacity:0;transform:translateY(18px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:calc(var(--i,0)*80ms)}
.rev-on .rev.in{opacity:1;transform:none}
@media print{.rev-on .rev{opacity:1!important;transform:none!important}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}.rev-on .rev{opacity:1;transform:none}}

/* ==========================================================================

   ========================================================================== */
.pend{display:inline-block;margin-right:.45em;padding:.18em .5em .14em;border-radius:5px;background:#ffe36e;color:#1b1b1b;font:700 .6rem/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;vertical-align:.2em;font-style:normal;white-space:nowrap}
.previa{position:fixed;z-index:90;left:max(.75rem,env(safe-area-inset-left));bottom:max(.75rem,env(safe-area-inset-bottom));display:flex;gap:.6rem;align-items:center;max-width:calc(100vw - 6.5rem);padding:.6rem .9rem;border:0;border-radius:12px;background:#17201f;color:#fff;font:600 .78rem/1.25 var(--sans);cursor:pointer;text-align:left;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
.previa i{flex:none;width:.6rem;height:.6rem;border-radius:50%;background:#ffe36e}
.previa:focus-visible{outline-color:#ffe36e}
@media (max-width:600px){.previa-longo{display:none}}
@media (max-width:899px){.previa{bottom:calc(max(1rem,env(safe-area-inset-bottom)) + 4.5rem)}}
.pend-foco{outline:3px solid #ffe36e;outline-offset:6px;border-radius:6px}

/* ---------- cores: tema, contraste ---------- */
const HEX = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
const rgb = x => { let s = x.replace('#', ''); if (s.length === 3) s = [...s].map(c => c + c).join(''); const n = parseInt(s, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const lum = a => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(a[0]) + .7152 * f(a[1]) + .0722 * f(a[2]); };
const ratio = (a, b) => { const x = lum(rgb(a)), y = lum(rgb(b)); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const toHex = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return toHex(A.map((v, i) => v * (1 - t) + B[i] * t)); };
const cor = { primaria: '#0F4C5C', secundaria: '#E08A3C', fundo: '#FAF6EF', texto: '#1E2A2D' };
Object.keys(cor).forEach(k => { if (HEX.test(C.cores[k] || '')) cor[k] = C.cores[k]; else console.error('[template] cor inválida em CONFIG.cores.' + k + ' — use HEX, ex. #0F4C5C'); });
const textoSobre = bg => ratio(bg, cor.fundo) >= ratio(bg, cor.texto) ? cor.fundo : cor.texto;

function aplicarTema() {
  const r = document.documentElement.style;
  r.setProperty('--primaria', cor.primaria); r.setProperty('--secundaria', cor.secundaria);
  r.setProperty('--fundo', cor.fundo); r.setProperty('--texto', cor.texto);
  const ctaTxt = textoSobre(cor.secundaria), primTxt = textoSobre(cor.primaria);
  r.setProperty('--cta-texto', ctaTxt); r.setProperty('--primaria-texto', primTxt);
  const escura = mix(cor.primaria, '#000000', .28);
  const avisos = [];
  if (ratio(cor.texto, cor.fundo) < 4.5) avisos.push('texto x fundo');
  if (ratio(cor.secundaria, ctaTxt) < 4.5) avisos.push('botão principal (secundária)');
  if (ratio(cor.primaria, primTxt) < 4.5) avisos.push('botões e seções na cor primária');
  if (ratio(escura, cor.fundo) < 4.5) avisos.push('primária escura x fundo (texto do hero e seções escuras) — escureça a primária');
  if (avisos.length) console.warn('[template] Contraste abaixo de 4,5:1 em: ' + avisos.join('; '));
  const tc = $('meta[name="theme-color"]'); if (tc) tc.content = escura;
  const ini = (limpo(C.negocio.nome).charAt(0) || 'P').toUpperCase();
  const fav = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${cor.primaria}"/><text x="32" y="44" font-family="Georgia,serif" font-size="36" text-anchor="middle" fill="${primTxt}">${ini}</text></svg>`;
  const link = $('link[rel="icon"]'); if (link) link.href = 'data:image/svg+xml,' + encodeURIComponent(fav);
}

const PADRAO = ['big', '', '', '', '', 'wide', '', ''];
let lbItens = [];
/* Distribui tamanhos e fecha a grade: o total de células vira múltiplo de 4 (e de 2 no celular), sem buracos. */
function tamanhos(n) {
  const t = Array.from({ length: n }, (_, i) => PADRAO[i % PADRAO.length]);
  if (n < 3) return t.map(() => 'wide');
  const cel = { big: 4, wide: 2, '': 1 };
  let falta = (4 - t.reduce((s, x) => s + cel[x], 0) % 4) % 4;
  for (let i = n - 1; i >= 0 && falta > 0; i--) if (t[i] === '') { t[i] = 'wide'; falta--; }
  return t;
}
function galeria() {

/* ---------- SEO: head + JSON-LD ---------- */
function metaSet(sel, attr, val) { const m = $(sel); if (m && val) m.setAttribute(attr, val); }

  if (s.imagemOg) metaSet('meta[property="og:image"]', 'content', s.imagemOg);
}
function jsonld() {
  const n = C.negocio, hr = C.horarios, abs = u => /^https?:\/\//.test(u || '') ? u : undefined;
  const o = {
    '@context': 'https://schema.org', '@type': n.tipoSchema || 'LodgingBusiness',

    image: abs(C.seo.imagemOg) || abs(C.hero.foto),

    geo: n.coordenadas ? { '@type': 'GeoCoordinates', latitude: n.coordenadas.lat, longitude: n.coordenadas.lng } : undefined,
    hasMap: mapsUrl(),
    checkinTime: hr.checkinISO || undefined, checkoutTime: hr.checkoutISO || undefined,
    amenityFeature: on('comodidades') && C.comodidades.length ? C.comodidades.map(c => ({ '@type': 'LocationFeatureSpecification', name: c.nome, value: true })) : undefined,
    sameAs: [C.links.instagram, C.links.facebook].filter(Boolean),
    containsPlace: on('jsonLdQuartos') && C.quartos.length ? C.quartos.map(q => ({ '@type': 'Accommodation', name: q.nome, description: q.descricao || undefined,
      occupancy: q.capacidadeMax ? { '@type': 'QuantitativeValue', maxValue: q.capacidadeMax } : undefined,
      amenityFeature: (q.comodidades || []).map(c => ({ '@type': 'LocationFeatureSpecification', name: c, value: true })) })) : undefined

/* ---------- comportamentos ---------- */
function comportamentos() {
  const t = $('#topo');
  let rafId = 0;
  const atualiza = () => { rafId = 0; if (window.scrollY > 24) t.setAttribute('data-solido', ''); else t.removeAttribute('data-solido'); };
  atualiza();
  addEventListener('scroll', () => { if (!rafId) rafId = requestAnimationFrame(atualiza); }, { passive: true });
  const els = document.querySelectorAll('.rev');
  if ('IntersectionObserver' in window && !reduzMovimento && els.length) {
    document.documentElement.classList.add('rev-on');
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
    els.forEach(el => io.observe(el));

}

/* ---------- pendências [TROCAR] ---------- */
function pendencias() {
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement && /^(SCRIPT|STYLE|NOSCRIPT)$/.test(n.parentElement.tagName) ? NodeFilter.FILTER_REJECT : MARCA.test(n.nodeValue) ? (MARCA.lastIndex = 0, NodeFilter.FILTER_ACCEPT) : NodeFilter.FILTER_SKIP) });
  const nos = []; while (w.nextNode()) nos.push(w.currentNode);
  let total = 0;
  nos.forEach(n => {
    const partes = n.nodeValue.split(MARCA); total += partes.length - 1;
    // ?limpo = prévia para o cliente: esconde as marcas. Sem prévia e sem ?limpo, o "[TROCAR]" aparece cru (alerta visível).
    if (modoLimpo) { n.nodeValue = partes.join('').replace(/^\s+/, ''); return; }
    if (!previa) return;
    const f = document.createDocumentFragment();
    partes.forEach((p, i) => { if (i) f.append(h('mark', { class: 'pend' }, 'Trocar')); if (p) f.append(p.replace(/^ /, i ? '' : ' ')); });
    n.replaceWith(f);
  });
  if (modoLimpo) document.title = limpo(document.title);
  const numPend = numeroPendente ? 1 : 0;
  const fotos = document.querySelectorAll('img[data-pendente]').length;
  const resumo = { textos: total, fotos, whatsapp: numPend };
  if (total || fotos || numPend) {
    console.warn('[template] Pendências antes de publicar →', resumo);
    // Enquanto houver pendência, a página fica fora do Google (noindex). Some sozinho quando tudo for trocado.
    document.head.append(h('meta', { name: 'robots', content: 'noindex, nofollow' }));
  }
  if (previa) {
    const marcas = () => [...document.querySelectorAll('mark.pend')];
    let k = -1;
    const bt = h('button', { type: 'button', class: 'previa', 'aria-label': 'Prévia do template: ir para a próxima pendência' }, h('i'),
      h('span', null, 'Prévia: ' + total + ' [TROCAR] · ' + fotos + ' fotos' + (numPend ? ' · WhatsApp' : ''), h('span', { class: 'previa-longo' }, ' — toque para ir à próxima')));
    bt.addEventListener('click', () => {
      const m = marcas(); if (!m.length) return;
      document.querySelectorAll('.pend-foco').forEach(x => x.classList.remove('pend-foco'));
      k = (k + 1) % m.length; const alvo = m[k];
      alvo.scrollIntoView({ block: 'center', behavior: reduzMovimento ? 'auto' : 'smooth' });
      alvo.parentElement && alvo.parentElement.classList.add('pend-foco');
      setTimeout(() => alvo.parentElement && alvo.parentElement.classList.remove('pend-foco'), 1800);
    });
    document.body.append(bt);
  }
}

/* ---------- montagem ---------- */
function montar() {
  aplicarTema(); seo();
  const main = $('#conteudo');
  const partes = [hero(), consulta(), quartos(), sobre(), comodidades(), galeria(), porQueDireto(), comoFunciona(), avaliacoes(), comoChegar(), faq(), ctaFinal()].filter(Boolean);

    .filter(([id]) => $('#' + id)).map(([id, k]) => ({ id, label: C.textos.nav[k] }));
  cabecalho(nav); rodape(); flutuante();
  if (lbItens.length) iniciarLb();
  refreshWa(); jsonld(); comportamentos(); pendencias();
}
if (numeroPendente) console.warn('[template] CONFIG.whatsapp.numero ainda é o número de exemplo.');
montar();
