:root {
  --primaria: #283dca; --secundaria: #dce4fa; --fundo: #f5f7fc; --texto: #101a32;
  --cta-texto: #f5f7fc; --on-dark: var(--fundo);
  --muted: color-mix(in srgb, var(--texto), var(--fundo) 24%);
  --line: color-mix(in srgb, var(--texto), var(--fundo) 78%);
  --linen: color-mix(in srgb, var(--fundo), var(--secundaria) 50%);
  --display: 'Bricolage Grotesque', system-ui, sans-serif; --sans: Manrope, system-ui, sans-serif;
  --space: clamp(3.1rem, 7vw, 6rem);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 1.5rem; }
body { margin: 0; min-width: 0; background: var(--fundo); color: var(--texto); font: 500 1rem/1.65 var(--sans); }
body, button, select { font-family: var(--sans); }
a { color: inherit; text-underline-offset: .22em; }
button, select { color: inherit; font-size: inherit; }
button { cursor: pointer; }
img { display: block; max-width: 100%; }
figure, p, h1, h2, h3, ul, ol, dl { margin: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 650; line-height: 1.02; overflow-wrap: anywhere; }
h1, h2 { letter-spacing: -.025em; }
h2 { font-size: clamp(2.5rem, 5.2vw, 4.7rem); text-wrap: balance; }
h3 { font-size: clamp(1.63rem, 3vw, 2.65rem); }
h1 em, h2 em { font-style: normal; font-weight: inherit; }
::selection { background: var(--primaria); color: var(--cta-texto); }
:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
[hidden] { display: none !important; }
.container { width: min(100% - clamp(2rem, 8vw, 9rem), 86rem); margin-inline: auto; }
.vh, .pular:not(:focus) { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.pular:focus { position: fixed; z-index: 20; left: 1rem; top: 1rem; background: var(--fundo); padding: .65rem 1rem; }
.ico { display: inline-grid; place-items: center; flex: 0 0 auto; width: 1.15rem; height: 1.15rem; }
.ico svg { width: 100%; height: 100%; }
.btn, .link-seta, .area-link { display: inline-flex; align-items: center; justify-content: center; gap: .7rem; min-height: 3rem; font-weight: 800; font-size: .84rem; line-height: 1.35; text-decoration: none; text-align: center; }
.btn { border: 1px solid transparent; padding: .7rem 1.12rem; transition: background .2s, color .2s, border-color .2s; }
.btn--cta { color: var(--cta-texto); background: var(--primaria); border-color: var(--primaria); }
.btn--cta:hover { background: color-mix(in srgb, var(--primaria), var(--texto) 26%); }
.btn--claro { color: var(--primaria); background: var(--fundo); border-color: var(--fundo); }
.btn--claro:hover { background: var(--secundaria); border-color: var(--secundaria); }
.btn--linha { color: inherit; background: transparent; border-color: currentColor; }
.btn--linha:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
.link-seta:hover, .area-link:hover { text-decoration: underline; }
.topo, .hero { background: var(--primaria); color: var(--on-dark); }
.topo-in { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 1.4rem; min-height: 5.55rem; border-bottom: 1px solid color-mix(in srgb, currentColor 28%, transparent); }
.marca { display: inline-flex; align-items: center; gap: .7rem; flex-shrink: 0; max-width: 100%; text-decoration: none; }
.marca-ico { display: grid; place-items: center; flex-shrink: 0; width: 2.38rem; height: 2.38rem; border: 1px solid currentColor; font: 400 1.6rem/1 var(--display); }
.marca-simbolo { display: grid; place-items: center; }
.marca-ico img { width: 100%; height: 100%; object-fit: contain; }
.marca-ico svg { width: 1.5rem; height: 1.5rem; }
.marca-nome { font: 400 clamp(1.35rem, 3vw, 1.85rem)/1 var(--display); max-width: 27ch; }
.nav { display: flex; align-items: center; gap: clamp(1rem, 2.45vw, 2.8rem); }
.nav a { display: inline-flex; align-items: center; min-height: 2.75rem; font-size: .81rem; font-weight: 700; text-decoration: none; }
.nav a:hover { text-decoration: underline; }
.menu-toggle { display: none; }
.template-bar { background: var(--linen); color: var(--texto); }

#atendimento .sec-head h2 { max-width: 15ch; text-wrap: initial; }
#atendimento .sec-head .lead { margin: 0; }
.passos { border-block: 1px solid var(--line); }
.passo { padding-block: 1.3rem 1.45rem; }
.passo-n { font: 750 1rem/1 var(--sans); color: var(--primaria); width: 2.2rem; height: 2.2rem; border: 1px solid var(--line); display: grid; place-items: center; }
.passo h3 { font-size: clamp(1.23rem, 2.1vw, 1.61rem); }
#sobre { background: var(--linen); }
.sobre-grid { gap: clamp(1.45rem, 6vw, 5rem); grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); }
.sobre-foto { aspect-ratio: 1.38; }
.sobre-texto em { color: var(--primaria); }
.consulta { background: var(--primaria); color: var(--cta-texto); }
.consulta-card { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); }
.consulta h2 { max-width: 13ch; }
.consulta-form { padding: clamp(1rem, 3vw, 2rem); background: var(--fundo); }
.grupo legend, .campo label { color: var(--texto); }
.pill input:checked + span { color: var(--cta-texto); }
.consulta-status:has(button[hidden]) { display: none; }

#advogados { background: var(--fundo); }
#advogados .sec-head { margin-bottom: 1.6rem; }
.advs { gap: 1rem; }
.adv { background: var(--linen); border: 0; padding: 1rem; }
.adv--foto { grid-template-columns: minmax(0, .68fr) minmax(0, 1fr); }
.adv-foto { aspect-ratio: 1.35; }
.adv-foto img { object-position: center 38%; }
.adv-txt { padding: .55rem; }
.adv-oab { font-size: .88rem; }
#galeria { background: var(--linen); }
.tile, .tile--wide { aspect-ratio: 1.67; }
.tile-name { bottom: .55rem; left: .55rem; max-width: calc(100% - 1.1rem); }
.faq-grid h2 { max-width: 12ch; text-wrap: initial; }
.faq-lista summary:hover { color: var(--primaria); }
#localizacao .mapa--vazio { min-height: 12rem; background: var(--fundo); border: 0; }
#localizacao .mapa-demo { background: color-mix(in srgb, var(--secundaria) 75%, var(--fundo)); color: var(--primaria); align-content: center; gap: .75rem; }
.mapa-demo .ico { height: 2.55rem; width: 2.55rem; }
.mapa-demo strong { display: block; font-size: 1.15rem; }
html:not(.marcacoes) .mapa-demo { display: none !important; }
.sec[data-tom='escura'], .rodape { background: var(--texto); color: var(--on-dark); }
.cta-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .55fr); gap: 1.65rem clamp(2rem, 6vw, 5.5rem); align-items: end; }
.cta-atalho { border-left: 1px solid #ffffff46; padding-left: clamp(1.3rem, 3vw, 3rem); }
.cta-atalho p { font-size: .84rem; margin-top: .8rem; }
.cta-final h2 { max-width: 15ch; }
.cta-final .btn--claro { background: var(--fundo); color: var(--texto); }
.cta-final .btn--claro:hover { background: var(--secundaria); }
.rodape-grid .logo { font-weight: 750; font-size: 1.4rem; }
@media (prefers-reduced-motion: no-preference) {
  .area-conteudo:not([hidden]) { animation: revelar-area .24s ease-out; }
  @keyframes revelar-area {
    from { opacity: .55; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
}
@media (max-width: 760px) {
  #atendimento .sec-head { display: block; }
  #atendimento .sec-head .lead { margin-top: .65rem; }
  .passos { border-bottom: 0; }
  .passo, .passo:first-child, .passo:last-child { gap: .3rem .75rem; }
  .sobre-grid, .consulta-card { grid-template-columns: 1fr; }
  .sobre-foto { aspect-ratio: 1.45; }
  .adv-foto { aspect-ratio: 1.4; }
  .cta-layout { grid-template-columns: 1fr; }
  .cta-atalho { border: 0; padding: 0; }
}
@media (max-width: 510px) {
  .adv--foto { grid-template-columns: 1fr; }
}
@media (max-width: 370px) {
  .hero h1 { font-size: 2.53rem; }
  .hero-lado .hero-agenda { width: min(68%, 17rem); }
}
@media (min-width: 761px) and (max-width: 900px) {
  .hero h1 { font-size: clamp(2.95rem, 6vw, 3.5rem); }
}

/* ---------- lightbox ---------- */
let lbI = 0;
function abrirLb(i) { const d = $('#lightbox'); lbI = i; mostrarLb(); if (!d.open) d.showModal(); }
function mostrarLb() {
  const d = $('#lightbox'), it = lbItens[lbI]; if (!it) return;
  const img = $('img', d); img.width = it.w; img.height = it.h; img.src = it.src; img.alt = it.alt;
  $('figcaption', d).textContent = it.legenda || '';
  d.setAttribute('aria-label', 'Galeria de fotos, foto ' + (lbI + 1) + ' de ' + lbItens.length);
}
function iniciarLb() {
  const d = $('#lightbox'), primeira = lbItens[0];
  $('figure', d).prepend(h('img', { src: primeira.src, alt: primeira.alt, width: primeira.w, height: primeira.h, decoding: 'async' }));
  $('[data-lb=prev]', d).hidden = lbItens.length < 2;
  $('[data-lb=next]', d).hidden = lbItens.length < 2;
  $('[data-lb=x]', d).append(icon('close')); $('[data-lb=prev]', d).append(icon('prev')); $('[data-lb=next]', d).append(icon('next'));
  const nav = k => { lbI = (lbI + k + lbItens.length) % lbItens.length; mostrarLb(); };
  d.addEventListener('click', e => { const b = e.target.closest('[data-lb]'); if (b) { const k = b.dataset.lb; if (k === 'x') d.close(); else nav(k === 'next' ? 1 : -1); } else if (e.target === d) d.close(); });
  d.addEventListener('keydown', e => { if (e.key === 'ArrowRight') nav(1); if (e.key === 'ArrowLeft') nav(-1); });
  let x0 = null;
  d.addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; }, { passive: true });
  d.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) nav(dx < 0 ? 1 : -1); x0 = null; }, { passive: true });
}

/* ---------- SEO: head + JSON-LD ---------- */
function metaSet(sel, attr, val) { const m = $(sel); if (m && val) m.setAttribute(attr, val); }
function seo() {
  if (demo) return;
  const s = C.seo, titulo = fill(s.titulo), desc = fill(s.descricao);
  document.title = titulo;
  metaSet('meta[name="description"]', 'content', desc);
  metaSet('meta[property="og:title"]', 'content', titulo);
  metaSet('meta[property="og:description"]', 'content', desc);
  metaSet('meta[property="og:site_name"]', 'content', C.negocio.nome);
  if (s.urlSite) { metaSet('link[rel="canonical"]', 'href', s.urlSite); metaSet('meta[property="og:url"]', 'content', s.urlSite); }
  if (s.imagemOg) metaSet('meta[property="og:image"]', 'content', s.imagemOg);
}
function jsonld() {
  const n = C.negocio, abs = u => /^https?:\/\//.test(u || '') ? u : undefined, completo = on('jsonLdCompleto');
  const horas = (C.horariosSchema || []).filter(x => x && x.abre && x.fecha && (x.dias || []).length)
    .map(x => ({ '@type': 'OpeningHoursSpecification', dayOfWeek: x.dias, opens: x.abre, closes: x.fecha }));
  const advs = (C.advogados || []).filter(p => p && p.nome);
  const o = {
    '@context': 'https://schema.org', '@type': n.tipoSchema || 'LegalService',
    name: n.nome, description: fill(C.seo.descricao), url: abs(C.seo.urlSite),
    image: abs(C.seo.imagemOg) || abs(C.hero.foto),
    telephone: numeroPendente ? undefined : '+' + numero,
    email: C.contato.email ? limpo(C.contato.email) : undefined,
    address: { '@type': 'PostalAddress', streetAddress: n.rua, addressLocality: n.cidade, addressRegion: n.uf, postalCode: n.cep, addressCountry: 'BR' },
    geo: n.coordenadas ? { '@type': 'GeoCoordinates', latitude: n.coordenadas.lat, longitude: n.coordenadas.lng } : undefined,
    areaServed: limpo(n.cidade) ? { '@type': 'City', name: n.cidade } : undefined,
    hasMap: mapsUrl(),
    openingHoursSpecification: horas.length ? horas : undefined,
    sameAs: [C.links.instagram, C.links.linkedin].filter(Boolean),
    knowsAbout: completo && on('areas') && areasAtivas().length ? areasAtivas().map(a => a.nome) : undefined,
    employee: completo && on('advogados') && advs.length ? advs.map(p => ({ '@type': 'Person', name: p.nome, jobTitle: 'Advogado(a)', identifier: p.oab || undefined })) : undefined
  };
  if (!o.sameAs.length) delete o.sameAs;
  if (!o.hasMap) delete o.hasMap;
  const s = h('script', { type: 'application/ld+json' }); s.textContent = JSON.stringify(o); document.head.append(s);
}

/* ---------- pendências [TROCAR] ---------- */
function templateBar() {
  let mostrando = previa;
  document.documentElement.classList.toggle('marcacoes', mostrando);
  if (!demo && !previa) return;
  const toggle = h('button', { type: 'button' }, mostrando ? 'Ocultar marcações' : 'Mostrar marcações');
  toggle.addEventListener('click', () => {
    mostrando = !mostrando;
    document.documentElement.classList.toggle('marcacoes', mostrando);
    toggle.textContent = mostrando ? 'Ocultar marcações' : 'Mostrar marcações';
  });
  $('#topo').before(h('aside', { class: 'template-bar', 'aria-label': 'Personalização do modelo' }, h('div', { class: 'container' },
    h('p', null, demo ? 'Demonstração · escritório fictício' : 'Prévia do template'), toggle)));
}

function pendencias() {
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: node =>
    node.parentElement.closest('script,style,noscript,option') ? NodeFilter.FILTER_REJECT :
      node.nodeValue.includes('[TROCAR]') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    node.replaceWith(campo(node.nodeValue, 'Personalizar'));
  }
  const pendente = demo || numeroPendente || document.querySelector('.marca-campo, img[data-pendente]');
  if (!pendente) $('meta[name="robots"]')?.remove();
  else if (!$('meta[name="robots"]')) document.head.append(h('meta', { name: 'robots', content: 'noindex, nofollow' }));
  return pendente;
}

/* ---------- montagem ---------- */
function montar() {
  aplicarTema(); seo();
  const main = $('#conteudo');
  main.append(...[hero(), areas(), primeiroAtendimento(), sobre(), consultaRapida(), advogados(), galeria(), avaliacoes(), faq(), localizacao(), ctaFinal()].filter(Boolean));
  const nav = [['areas', 'areas'], ['atendimento', 'atendimento'], ['advogados', 'advogados'], ['perguntas', 'faq']]
    .filter(([id]) => $('#' + id)).map(([id, k]) => ({ id, label: C.textos.nav[k] }));
  cabecalho(nav); rodape(); flutuante(); templateBar();
  if (lbItens.length) iniciarLb();
  refreshWa();
  if (!pendencias()) jsonld();
}
if (!demo && numeroPendente) console.warn('[template] Configure o WhatsApp do escritório.');
montar();
})();
