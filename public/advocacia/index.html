<style>
/* ==========================================================================
   Tokens. As 4 cores vêm do CONFIG.cores; o resto é derivado delas.
   primaria = azul-marinho ou verde-escuro (fundo do topo, botões, títulos de destaque)
   secundaria = tom neutro (linhas, destaques sobre o escuro, fundos suaves)
   ========================================================================== */
:root{
  --primaria:#15253D; --secundaria:#D8D2C6; --fundo:#FAFAF8; --texto:#1A2130;
  --cta-texto:#FFFFFF;

  --primaria-escura:color-mix(in oklab,var(--primaria) 72%,#000);
  --superficie:color-mix(in oklab,var(--secundaria) 32%,var(--fundo));
  --cartao:color-mix(in oklab,var(--fundo) 40%,#fff);
  --tinta:var(--texto);
  --tinta-suave:color-mix(in oklab,var(--texto) 76%,var(--fundo));
  --linha:color-mix(in oklab,var(--texto) 13%,var(--fundo));
  --linha-forte:color-mix(in oklab,var(--texto) 32%,var(--fundo));
  --claro-suave:color-mix(in oklab,var(--fundo) 80%,var(--primaria));
  --foco:var(--primaria);

  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --gutter:clamp(1.25rem,5vw,3rem);
  --max:1180px;
  --sec:clamp(4.5rem,9vw,7.5rem);
  --raio:8px;
}

/* ==========================================================================
   Base
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:5rem;accent-color:var(--primaria);color-scheme:light}
body{margin:0;background:var(--fundo);color:var(--tinta);font:400 1.0625rem/1.65 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scrollbar-color:color-mix(in oklab,var(--primaria) 45%,var(--fundo)) var(--superficie)}
img,svg{display:block;max-width:100%}
img{height:auto}
h1,h2,h3,p,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em}
button,input,select{font:inherit;color:inherit}
::selection{background:var(--primaria);color:var(--cta-texto)}
input,select{caret-color:var(--primaria)}
:focus-visible{outline:3px solid var(--foco);outline-offset:3px;border-radius:3px}
section[id]{scroll-margin-top:4.75rem}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pular{position:fixed;left:1rem;top:-4rem;z-index:100;background:var(--tinta);color:var(--fundo);padding:.75rem 1.1rem;border-radius:6px;transition:top .2s var(--ease)}
.pular:focus{top:1rem}
.container{width:min(100% - 2*var(--gutter),var(--max));margin-inline:auto}
.ico{display:inline-flex;width:1.25em;height:1.25em;flex:none}
.ico svg{width:100%;height:100%}
.tnum{font-variant-numeric:tabular-nums lining-nums}

h1,h2,h3{font-family:var(--serif);font-optical-sizing:auto;font-weight:400;text-wrap:balance;color:var(--tinta)}
h1 em,h2 em{font-style:italic}
h2{font-size:clamp(1.95rem,1.3rem + 2.5vw,3.1rem);line-height:1.1;letter-spacing:-.015em}
h3{font-size:1.35rem;line-height:1.25;font-weight:600;letter-spacing:-.005em}
p{text-wrap:pretty}

/* ==========================================================================
   Botões — discretos, cantos pouco arredondados
   ========================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.65rem;min-height:3.25rem;padding:.8rem 1.5rem;border-radius:6px;border:1.5px solid transparent;font-family:var(--sans);font-weight:600;font-size:1rem;line-height:1.2;text-align:center;text-decoration:none;cursor:pointer;transition:background-color .25s var(--ease),color .25s,border-color .25s,transform .25s var(--ease)}
.btn .ico{width:1.3em;height:1.3em}
.btn--cta{background:var(--primaria);color:var(--cta-texto)}
.btn--claro{background:var(--fundo);color:var(--primaria)}
.btn--linha{background:transparent;border-color:var(--linha-forte);color:var(--tinta)}
.btn--sm{min-height:2.75rem;padding:.5rem 1rem;font-size:.95rem}
.btn--lg{min-height:3.5rem;padding:.95rem 1.75rem;font-size:1.03rem}
.btn:active{transform:scale(.985)}
@media (hover:hover){
  .btn--cta:hover{background:var(--primaria-escura)}
  .btn--claro:hover{background:var(--secundaria)}
  .btn--linha:hover{border-color:var(--primaria);color:var(--primaria)}
}
.link-seta{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:.1rem}
.link-seta .ico{width:1em;height:1em;transition:transform .3s var(--ease)}
@media (hover:hover){.link-seta:hover .ico{transform:translateX(4px)}}

/* ==========================================================================
   Cabeçalho
   ========================================================================== */
.topo{position:fixed;inset:0 0 auto 0;z-index:50;color:var(--fundo);--foco:var(--fundo);transition:background-color .35s var(--ease),color .35s,box-shadow .35s}
.topo[data-solido]{background:color-mix(in oklab,var(--fundo) 95%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--tinta);--foco:var(--primaria);box-shadow:0 1px 0 var(--linha)}
.topo-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:4.25rem}
.marca{min-width:0;flex:1 1 auto;font-family:var(--serif);font-weight:600;font-size:1.22rem;letter-spacing:-.005em;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:none;gap:1.75rem;font-size:.95rem}
.nav a{text-decoration:none;opacity:.86;padding:.4rem 0;border-bottom:1px solid transparent;transition:opacity .2s,border-color .2s}
@media (hover:hover){.nav a:hover{opacity:1;border-bottom-color:currentColor}}
.topo .btn{white-space:nowrap;flex:none}
.topo:not([data-solido]) .btn--cta{background:var(--fundo);color:var(--primaria)}
@media (max-width:380px){.marca{font-size:1.05rem}.topo .btn--sm{padding-inline:.8rem;gap:.45rem}}
@media (min-width:1080px){.nav{display:flex}.marca{flex:0 1 auto}}

/* ==========================================================================
   Hero — fundo escuro, título com serifa, responsável à vista
   ========================================================================== */
.hero{position:relative;background:var(--primaria);color:var(--fundo);--foco:var(--fundo);padding-top:calc(4.25rem + clamp(2.5rem,6vw,5.5rem));padding-bottom:clamp(3.5rem,7vw,6rem);overflow:clip}
.hero h1,.hero h2{color:var(--fundo)}
.hero h1 em{color:var(--secundaria)}
.hero-grid{display:grid;gap:3rem;align-items:end}
.hero-texto{display:grid;gap:1.5rem;justify-items:start}
.hero h1{font-size:clamp(2.4rem,1.4rem + 4vw,4.6rem);line-height:1.04;letter-spacing:-.022em;max-width:16ch}
.hero-lead{font-size:clamp(1.08rem,1rem + .35vw,1.22rem);line-height:1.6;color:var(--claro-suave);max-width:46ch}
.hero-regua{width:4.5rem;height:1px;background:var(--secundaria);transform-origin:left}
.hero-acoes{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.75rem;margin-top:.25rem}
.hero-nota{display:flex;gap:.6rem;align-items:flex-start;font-size:.95rem;color:var(--claro-suave);max-width:46ch}
.hero-nota .ico{margin-top:.2em;color:var(--secundaria)}
.hero .link-seta{color:var(--fundo)}
.hero-lado{display:grid;gap:1rem;align-content:end}
.hero-foto{aspect-ratio:4/5;border-radius:var(--raio);overflow:hidden;background:var(--primaria-escura);max-width:26rem}
.hero-foto img{width:100%;height:100%;object-fit:cover}
.resp{display:grid;gap:.15rem;padding:1.1rem 0 0;border-top:1px solid color-mix(in oklab,var(--secundaria) 55%,transparent);max-width:26rem}
.resp-rotulo{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--secundaria)}
.resp strong{font-family:var(--serif);font-weight:400;font-size:1.3rem;color:var(--fundo)}
.resp .tnum{color:var(--claro-suave);font-size:.95rem}
@media (max-width:560px){.hero-acoes .btn{width:100%}}
@media (min-width:960px){.hero-grid{grid-template-columns:minmax(0,1.35fr) minmax(0,.85fr);gap:clamp(3rem,7vw,7rem)}.hero-grid--sem-foto{grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr)}}
@media (max-width:959px){.hero-foto{aspect-ratio:4/3;max-width:none}}
@media (prefers-reduced-motion:no-preference){
  .hero-texto>*{animation:subir .9s var(--ease) both}
  .hero-texto>:nth-child(1){animation-delay:.08s}
  .hero-texto>:nth-child(2){animation:regua 1.1s var(--ease) both .35s}
  .hero-texto>:nth-child(3){animation-delay:.22s}
  .hero-texto>:nth-child(4){animation-delay:.32s}
  .hero-texto>:nth-child(5){animation-delay:.42s}
  .hero-lado{animation:subir 1s var(--ease) both .45s}
  @keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes regua{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}

/* ==========================================================================
   "Sobre qual assunto?" (plano Completo)
   ========================================================================== */
.consulta{padding-top:clamp(3rem,6vw,4.5rem)}
.consulta-card{border:1px solid var(--linha);background:var(--cartao);border-radius:var(--raio);padding:clamp(1.4rem,4vw,2.5rem);display:grid;gap:1.5rem 3rem}
.consulta-card h2{font-size:clamp(1.5rem,1.2rem + 1.1vw,2rem)}
.consulta-card .lead{color:var(--tinta-suave);margin-top:.6rem;max-width:38ch}
.consulta-card .aviso{display:flex;gap:.55rem;margin-top:1rem;font-size:.92rem;color:var(--tinta-suave);max-width:38ch}
.consulta-card .aviso .ico{margin-top:.2em;color:var(--primaria)}
.consulta-form{display:grid;gap:1.25rem}
.campo{display:grid;gap:.4rem;min-width:0}
.campo label,.grupo legend{font-size:.9rem;font-weight:600;color:var(--tinta)}
.campo select{width:100%;min-width:0;min-height:3.25rem;padding:.6rem .9rem;background:var(--fundo);border:1.5px solid var(--linha-forte);border-radius:6px;transition:border-color .2s}
.campo select:hover{border-color:var(--primaria)}
.grupo{border:0;margin:0;padding:0;min-width:0}
.grupo legend{padding:0;margin-bottom:.5rem}
.pills{display:flex;flex-wrap:wrap;gap:.5rem}
.pill{position:relative}
.pill input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.pill span{display:inline-flex;align-items:center;min-height:2.75rem;padding:.5rem 1.05rem;background:var(--fundo);border:1.5px solid var(--linha-forte);border-radius:6px;cursor:pointer;transition:background-color .2s,border-color .2s,color .2s}
.pill input:checked+span{background:var(--primaria);border-color:var(--primaria);color:var(--cta-texto)}
.pill input:focus-visible+span{outline:3px solid var(--foco);outline-offset:2px}
@media (hover:hover){.pill span:hover{border-color:var(--primaria)}}
.linha-2{display:grid;gap:1.25rem}
@media (min-width:640px){.linha-2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:960px){.consulta-card{grid-template-columns:minmax(0,4fr) minmax(0,7fr);align-items:start}.consulta-form .btn{justify-self:start}}

/* ==========================================================================
   Seções
   ========================================================================== */
.sec{padding-block:var(--sec)}
.sec--tinta{background:var(--superficie)}
.sec--escura{background:var(--primaria);color:var(--fundo);--foco:var(--fundo)}
.sec--escura h2{color:var(--fundo)}
.sec--escura h2 em{color:var(--secundaria)}
.sec-head{display:grid;gap:1rem;max-width:46rem;margin-bottom:clamp(2.25rem,5vw,3.5rem)}
.sec-head .lead{color:var(--tinta-suave);font-size:1.1rem;max-width:54ch}

/* Áreas de atuação */
.areas{display:grid;gap:1px;background:var(--linha);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;grid-template-columns:repeat(auto-fill,minmax(min(100%,21rem),1fr))}
.area{display:flex;flex-direction:column;gap:.75rem;padding:1.75rem 1.6rem 1.5rem;background:var(--cartao)}
.area p{color:var(--tinta-suave);max-width:42ch}
.area-link{margin-top:auto;padding-top:.5rem;display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem;font-weight:600;color:var(--primaria);text-decoration:none;align-self:flex-start}
.area-link .ico{width:1em;height:1em;transition:transform .3s var(--ease)}
@media (hover:hover){.area-link:hover{text-decoration:underline}.area-link:hover .ico{transform:translateX(4px)}}

/* Sobre */
.sobre-grid{display:grid;gap:clamp(2rem,5vw,4.5rem);align-items:start}
.sobre-foto{aspect-ratio:4/3;border-radius:var(--raio);overflow:hidden}
.sobre-foto img{width:100%;height:100%;object-fit:cover}
.sobre-texto{display:grid;gap:1.15rem;max-width:60ch}
.sobre-texto p{font-size:1.1rem;color:var(--tinta-suave)}
@media (min-width:900px){.sobre-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}

/* Primeiro atendimento */
.passos{display:grid;gap:2rem}
.passo{display:grid;gap:.6rem;align-content:start}
.passo-n{font-family:var(--serif);font-size:3.5rem;line-height:1;color:var(--primaria);font-weight:400}
.passo p{color:var(--tinta-suave);max-width:34ch}
@media (min-width:860px){
  .passos{grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
  .passo{padding:0 2rem;border-left:1px solid var(--linha-forte)}
  .passo:first-child{padding-left:0;border-left:0}
}

/* Advogados */
.advs{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,30rem),1fr))}
.adv{display:grid;gap:1.25rem;padding:1.25rem;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);align-items:start;max-width:46rem}
.adv--foto{grid-template-columns:minmax(0,8rem) minmax(0,1fr)}
.adv-foto{aspect-ratio:4/5;border-radius:6px;overflow:hidden;background:var(--superficie)}
.adv-foto img{width:100%;height:100%;object-fit:cover}
.adv-txt{display:grid;gap:.3rem;align-content:start}
.adv-oab{font-weight:600;color:var(--primaria)}
.adv-areas{color:var(--tinta-suave);font-size:.97rem}
.adv-bio{color:var(--tinta-suave);margin-top:.35rem;font-size:.97rem}
@media (min-width:640px){.adv--foto{grid-template-columns:minmax(0,10rem) minmax(0,1fr)}}
@media (max-width:479px){.adv--foto{grid-template-columns:minmax(0,1fr)}.adv-foto{width:7.5rem}}

/* Galeria */
.galeria-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(9rem,40vw,13rem);grid-auto-flow:dense;gap:.7rem}
.tile{position:relative;overflow:hidden;border-radius:6px;background:var(--superficie);margin:0;padding:0;border:0;display:block;width:100%;height:100%}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.tile--big{grid-column:span 2;grid-row:span 2}
.tile--wide{grid-column:span 2}
button.tile{cursor:zoom-in}
@media (hover:hover){button.tile:hover img{transform:scale(1.03)}}
@media (min-width:760px){.galeria-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:13rem;gap:1rem}}
@media (min-width:1100px){.galeria-grid{grid-auto-rows:15rem}}

/* Lightbox */
.lb{border:0;padding:0;width:100%;height:100%;max-width:none;max-height:none;background:transparent;color:#fff}
.lb::backdrop{background:rgba(8,12,20,.94)}
.lb[open]{display:grid;place-items:center;grid-template-columns:auto minmax(0,1fr) auto;gap:.5rem;padding:1rem}
.lb figure{display:grid;gap:.9rem;justify-items:center;min-width:0}
.lb img{max-width:100%;max-height:78vh;width:auto;height:auto;object-fit:contain;border-radius:6px}
.lb figcaption{font-size:.97rem;color:rgba(255,255,255,.88);text-align:center;max-width:60ch;min-height:1.4em}
.lb-btn{display:grid;place-items:center;width:3rem;height:3rem;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;transition:background-color .2s}
.lb-btn:hover{background:rgba(255,255,255,.2)}
.lb :focus-visible{outline-color:#fff}
.lb-x{position:absolute;top:1rem;right:1rem}
@media (max-width:640px){.lb[open]{grid-template-columns:1fr;align-content:center}.lb-prev,.lb-next{position:absolute;bottom:1.25rem}.lb-prev{left:1rem}.lb-next{right:1rem}}

/* Avaliações (desligado por padrão neste nicho) */
.avals{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr))}
.aval{display:grid;gap:1rem;padding-top:1.5rem;border-top:1px solid var(--linha)}
.aval blockquote{font-family:var(--serif);font-size:1.3rem;line-height:1.4}
.aval cite{font-style:normal;color:var(--tinta-suave);font-size:.95rem}

/* FAQ */
.faq-grid{display:grid;gap:2rem clamp(2rem,6vw,5rem)}
@media (min-width:960px){.faq-grid{grid-template-columns:minmax(0,4fr) minmax(0,7fr);align-items:start}.faq-grid .sec-head{margin-bottom:0;position:sticky;top:6.5rem}}
.faq-lista{border-bottom:1px solid var(--linha-forte)}
.faq-lista details{border-top:1px solid var(--linha-forte)}
.faq-lista summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:1.5rem;min-height:3.75rem;padding-block:1.1rem;font-family:var(--serif);font-size:1.2rem;line-height:1.35}
.faq-lista summary::-webkit-details-marker{display:none}
.faq-lista summary::after{content:"";flex:none;width:1rem;height:1rem;background:
  linear-gradient(var(--primaria),var(--primaria)) center/100% 1.5px no-repeat,
  linear-gradient(var(--primaria),var(--primaria)) center/1.5px 100% no-repeat;transition:transform .4s var(--ease)}
.faq-lista details[open] summary::after{transform:rotate(135deg)}
@media (hover:hover){.faq-lista summary:hover{color:var(--primaria)}}
.faq-resp{padding:0 2.5rem 1.4rem 0;color:var(--tinta-suave);max-width:62ch}

/* Localização */
.local{display:grid;gap:clamp(2rem,5vw,4rem)}
@media (min-width:960px){.local{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
.dados{display:grid}
.dados>div{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;padding-block:1.1rem;border-top:1px solid var(--linha)}
.dados>div:last-child{border-bottom:1px solid var(--linha)}
.dados .ico{width:1.4rem;height:1.4rem;color:var(--primaria);grid-row:span 2;margin-top:.15rem}
.dados dt{font-weight:600}
.dados dd{color:var(--tinta-suave)}
.horas{display:grid;gap:.2rem}
.horas>span{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;max-width:24rem}
.local-acoes{margin-top:1.75rem;display:flex;flex-wrap:wrap;gap:.75rem}
.mapa{aspect-ratio:4/3;border-radius:var(--raio);overflow:hidden;background:var(--superficie);display:grid;place-items:center;text-align:center;padding:1.25rem;color:var(--tinta-suave)}
.sec--tinta .mapa{background:var(--fundo)}
.mapa--vazio{border:1.5px dashed var(--linha-forte)}
.mapa:has(iframe){padding:0}
.mapa iframe{width:100%;height:100%;border:0;display:block}
@media (max-width:959px){.mapa{aspect-ratio:1/1}}
@media (min-width:960px){.mapa{position:sticky;top:6.5rem}}

/* Chamada final */
.final-in{display:grid;gap:1.5rem;justify-items:start}
.final h2{font-size:clamp(2.1rem,1.3rem + 3.2vw,3.8rem);line-height:1.06;letter-spacing:-.02em;max-width:18ch}
.final p{max-width:48ch;font-size:1.1rem;color:var(--claro-suave)}
.final-contato{display:flex;flex-wrap:wrap;gap:.5rem 2rem}
.final-contato a{display:inline-flex;gap:.5rem;align-items:center}
.final-contato .ico{width:1.1em;height:1.1em}

/* Rodapé (nome e OAB do responsável — exigência do Código de Ética) */
.rodape{background:var(--primaria-escura);color:var(--claro-suave);padding-block:clamp(3rem,6vw,4.5rem) 2rem;font-size:.97rem;--foco:var(--fundo)}
.rodape-grid{display:grid;gap:2.25rem clamp(2rem,5vw,4rem)}
@media (min-width:860px){.rodape-grid{grid-template-columns:minmax(0,4fr) minmax(0,3fr) minmax(0,4fr)}}
.rodape .logo{font-family:var(--serif);font-size:1.5rem;color:var(--fundo);margin-bottom:.6rem}
.rodape h2{font-family:var(--sans);font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fundo);margin-bottom:.9rem;line-height:1.3}
.rodape ul{display:grid;gap:.55rem}
.rodape li{display:flex;gap:.6rem;align-items:flex-start}
.rodape .ico{width:1.1em;height:1.1em;margin-top:.25em;flex:none}
.rodape a{text-decoration-color:color-mix(in oklab,var(--fundo) 40%,transparent)}
@media (hover:hover){.rodape a:hover{text-decoration-color:currentColor}}
.resp-rodape{margin-top:clamp(2.25rem,5vw,3.25rem);padding-top:1.25rem;border-top:1px solid color-mix(in oklab,var(--secundaria) 35%,transparent);display:flex;flex-wrap:wrap;gap:.35rem 1.5rem;color:var(--fundo)}
.resp-rodape strong{font-weight:600}
.rodape-legal{margin-top:1rem;display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between;font-size:.88rem;color:color-mix(in oklab,var(--fundo) 74%,transparent)}

/* Botão flutuante (celular) */
.flutuante{position:fixed;z-index:60;right:max(1rem,env(safe-area-inset-right));bottom:max(1rem,env(safe-area-inset-bottom));transform:translateY(160%);transition:transform .6s var(--ease);box-shadow:0 14px 28px -12px rgba(0,0,0,.5)}
.flutuante[data-visivel]{transform:none}
@media (min-width:900px){.flutuante{display:none}}
@media (max-width:899px){.rodape{padding-bottom:6rem}}

/* Entrada ao rolar: só em grupos de itens */
.rev-on .rev{opacity:0;transform:translateY(14px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--i,0)*70ms)}
.rev-on .rev.in{opacity:1;transform:none}
@media print{.rev-on .rev{opacity:1!important;transform:none!important}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}.rev-on .rev{opacity:1;transform:none}}

/* ==========================================================================
   Ferramentas de prévia (somem com ?limpo ou modoPrevia:false)
   ========================================================================== */
.pend{display:inline-block;margin-right:.45em;padding:.18em .5em .14em;border-radius:4px;background:#ffe36e;color:#1b1b1b;font:700 .6rem/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;vertical-align:.2em;font-style:normal;white-space:nowrap}
.previa{position:fixed;z-index:90;left:max(.75rem,env(safe-area-inset-left));bottom:max(.75rem,env(safe-area-inset-bottom));display:flex;gap:.6rem;align-items:center;max-width:calc(100vw - 1.5rem);padding:.6rem .9rem;border:0;border-radius:10px;background:#17201f;color:#fff;font:700 .78rem/1.25 var(--sans);cursor:pointer;text-align:left;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
.previa i{flex:none;width:.6rem;height:.6rem;border-radius:50%;background:#ffe36e}
.previa:focus-visible{outline-color:#ffe36e}
@media (max-width:600px){.previa-longo{display:none}}
@media (max-width:899px){.previa{bottom:calc(max(1rem,env(safe-area-inset-bottom)) + 4.5rem)}}
.pend-foco{outline:3px solid #ffe36e;outline-offset:6px;border-radius:4px}
</style>

      h('p', null, fill(C.textos.ctaFinalTexto)),
      waBtn({ texto: C.textos.botaoPrincipal, cls: 'btn--claro btn--lg' }),
      h('div', { class: 'final-contato' },
        tel ? h('a', { href: tel }, icon('phone'), C.contato.telefone) : null,
        C.contato.email ? h('a', { href: 'mailto:' + limpo(C.contato.email) }, icon('mail'), C.contato.email) : null)), 'escura');
}

/* ---------- rodapé ---------- */
function rodape() {
  const f = C.rodape, n = C.negocio, r = C.responsavel || {}, tel = telHref();
  const redes = on('redes') ? [['instagram', C.links.instagram, 'Instagram'], ['linkedin', C.links.linkedin, 'LinkedIn']].filter(x => x[1]) : [];
  const legal = [f.razaoSocial, f.cnpj ? 'CNPJ ' + f.cnpj : '', f.registroSociedade || ''].filter(Boolean);
  if (!limpo(r.nome) || !limpo(r.oab)) console.error('[template] OAB: o rodapé precisa do nome e da inscrição na OAB do(a) responsável (CONFIG.responsavel).');
  $('#rodape').append(h('div', { class: 'container' },
    h('div', { class: 'rodape-grid' },
      h('div', null, h('p', { class: 'logo' }, n.nome), f.frase ? h('p', null, f.frase) : null),
      h('div', null, h('h2', null, 'Contato'), h('ul', null,
        h('li', null, waIcon(), registra(h('a', { href: '#', target: '_blank', rel: 'noopener noreferrer' }, 'Falar pelo WhatsApp'))),
        tel ? h('li', null, icon('phone'), h('a', { href: tel }, C.contato.telefone)) : null,
        C.contato.email ? h('li', null, icon('mail'), h('a', { href: 'mailto:' + limpo(C.contato.email) }, C.contato.email)) : null,
        redes.map(([ic, url, nome]) => h('li', null, icon(ic), h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, nome, h('span', { class: 'vh' }, ' (abre em outra aba)')))))),
      h('div', null, h('h2', null, 'Endereço e horário'), h('ul', null,
        h('li', null, icon('pin'), h('span', null, enderecoLinhas())),
        (C.horarios || []).length ? h('li', null, icon('clock'), h('span', { class: 'tnum' }, C.horarios.map((x, i) => [i ? h('br') : null, x.dias + ': ' + x.horas]))) : null,
        h('li', null, icon('arrow'), h('a', { href: mapsUrl(), target: '_blank', rel: 'noopener noreferrer' }, 'Ver no mapa', h('span', { class: 'vh' }, ' (abre em outra aba)')))))),
    h('p', { class: 'resp-rodape' }, h('span', null, 'Responsável: ', h('strong', null, r.nome || '[TROCAR] Nome do(a) advogado(a)')), h('span', { class: 'tnum' }, r.oab || '[TROCAR] OAB/UF 000.000')),
    h('div', { class: 'rodape-legal' },
      h('span', null, '© ' + new Date().getFullYear() + ' ' + (legal.length ? legal.join(' · ') : n.nome)),
      f.credito ? h('span', null, f.creditoUrl ? h('a', { href: f.creditoUrl, target: '_blank', rel: 'noopener noreferrer' }, f.credito) : f.credito) : null)));
}

/* ---------- botão flutuante ---------- */
function flutuante() {
  if (!on('botaoFlutuante')) return;
  const el = $('#flutuante'); el.hidden = false;
  el.append(waIcon(), h('span', null, C.textos.botaoCurto), h('span', { class: 'vh' }, ' (abre o WhatsApp em outra aba)'));
  registra(el);
  const heroEl = $('#hero');
  if ('IntersectionObserver' in window && heroEl) new IntersectionObserver(([e]) => { if (e.isIntersecting) el.removeAttribute('data-visivel'); else el.setAttribute('data-visivel', ''); }, { threshold: 0.2 }).observe(heroEl);
  else el.setAttribute('data-visivel', '');
}

/* ---------- lightbox ---------- */
let lbI = 0;
function abrirLb(i) { const d = $('#lightbox'); lbI = i; mostrarLb(); if (!d.open) d.showModal(); }
function mostrarLb() {
  const d = $('#lightbox'), it = lbItens[lbI]; if (!it) return;
  const img = $('img', d); img.width = it.w; img.height = it.h; img.src = it.src; img.alt = it.alt;
  $('figcaption', d).textContent = it.legenda || '';
  d.setAttribute('aria-label', 'Galeria de fotos, foto ' + (lbI + 1) + ' de ' + lbItens.length);
}
function iniciarLb() {
  const d = $('#lightbox'), primeira = lbItens[0];
  $('figure', d).prepend(h('img', { src: primeira.src, alt: primeira.alt, width: primeira.w, height: primeira.h, decoding: 'async' }));
  $('[data-lb=x]', d).append(icon('close')); $('[data-lb=prev]', d).append(icon('prev')); $('[data-lb=next]', d).append(icon('next'));
  const nav = k => { lbI = (lbI + k + lbItens.length) % lbItens.length; mostrarLb(); };
  d.addEventListener('click', e => { const b = e.target.closest('[data-lb]'); if (b) { const k = b.dataset.lb; if (k === 'x') d.close(); else nav(k === 'next' ? 1 : -1); } else if (e.target === d) d.close(); });
  d.addEventListener('keydown', e => { if (e.key === 'ArrowRight') nav(1); if (e.key === 'ArrowLeft') nav(-1); });
  let x0 = null;
  d.addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; }, { passive: true });
  d.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) nav(dx < 0 ? 1 : -1); x0 = null; }, { passive: true });
}

/* ---------- SEO: head + JSON-LD ---------- */
function metaSet(sel, attr, val) { const m = $(sel); if (m && val) m.setAttribute(attr, val); }
function seo() {
  const s = C.seo, titulo = fill(s.titulo), desc = fill(s.descricao);
  document.title = titulo;
  metaSet('meta[name="description"]', 'content', desc);
  metaSet('meta[property="og:title"]', 'content', titulo);
  metaSet('meta[property="og:description"]', 'content', desc);
  metaSet('meta[property="og:site_name"]', 'content', C.negocio.nome);
  if (s.urlSite) { metaSet('link[rel="canonical"]', 'href', s.urlSite); metaSet('meta[property="og:url"]', 'content', s.urlSite); }
  if (s.imagemOg) metaSet('meta[property="og:image"]', 'content', s.imagemOg);
}
function jsonld() {
  const n = C.negocio, abs = u => /^https?:\/\//.test(u || '') ? u : undefined, completo = on('jsonLdCompleto');
  const horas = (C.horariosSchema || []).filter(x => x && x.abre && x.fecha && (x.dias || []).length)
    .map(x => ({ '@type': 'OpeningHoursSpecification', dayOfWeek: x.dias, opens: x.abre, closes: x.fecha }));
  const advs = (C.advogados || []).filter(p => p && p.nome);
  const o = {
    '@context': 'https://schema.org', '@type': n.tipoSchema || 'LegalService',
    name: n.nome, description: fill(C.seo.descricao), url: abs(C.seo.urlSite),
    image: abs(C.seo.imagemOg) || abs(C.hero.foto),
    telephone: numeroPendente ? undefined : '+' + numero,
    email: C.contato.email ? limpo(C.contato.email) : undefined,
    address: { '@type': 'PostalAddress', streetAddress: n.rua, addressLocality: n.cidade, addressRegion: n.uf, postalCode: n.cep, addressCountry: 'BR' },
    geo: n.coordenadas ? { '@type': 'GeoCoordinates', latitude: n.coordenadas.lat, longitude: n.coordenadas.lng } : undefined,
    areaServed: limpo(n.cidade) ? { '@type': 'City', name: n.cidade } : undefined,
    hasMap: mapsUrl(),
    openingHoursSpecification: horas.length ? horas : undefined,
    sameAs: [C.links.instagram, C.links.linkedin].filter(Boolean),
    knowsAbout: completo && on('areas') && areasAtivas().length ? areasAtivas().map(a => a.nome) : undefined,
    employee: completo && on('advogados') && advs.length ? advs.map(p => ({ '@type': 'Person', name: p.nome, jobTitle: 'Advogado(a)', identifier: p.oab || undefined })) : undefined
  };
  if (!o.sameAs.length) delete o.sameAs;
  const s = h('script', { type: 'application/ld+json' }); s.textContent = JSON.stringify(o); document.head.append(s);
}

/* ---------- comportamentos ---------- */
function comportamentos() {
  const t = $('#topo'), heroEl = $('#hero');
  let rafId = 0;
  const limite = () => (heroEl ? heroEl.offsetHeight - 72 : 24);
  const atualiza = () => { rafId = 0; if (window.scrollY > limite()) t.setAttribute('data-solido', ''); else t.removeAttribute('data-solido'); };
  atualiza();
  addEventListener('scroll', () => { if (!rafId) rafId = requestAnimationFrame(atualiza); }, { passive: true });
  addEventListener('resize', atualiza, { passive: true });
  const els = document.querySelectorAll('.rev');
  if ('IntersectionObserver' in window && !reduzMovimento && els.length) {
    document.documentElement.classList.add('rev-on');
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
    els.forEach(el => io.observe(el));
  }
}

/* ---------- pendências [TROCAR] ---------- */
function pendencias() {
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement && /^(SCRIPT|STYLE|NOSCRIPT|OPTION)$/.test(n.parentElement.tagName) ? NodeFilter.FILTER_REJECT : MARCA.test(n.nodeValue) ? (MARCA.lastIndex = 0, NodeFilter.FILTER_ACCEPT) : NodeFilter.FILTER_SKIP) });
  const nos = []; while (w.nextNode()) nos.push(w.currentNode);
  let total = 0;
  nos.forEach(n => {
    const partes = n.nodeValue.split(MARCA); total += partes.length - 1;
    // ?limpo = prévia para o cliente: esconde as marcas. Sem prévia e sem ?limpo, o "[TROCAR]" aparece cru (alerta visível).
    if (modoLimpo) { n.nodeValue = partes.join('').replace(/^\s+/, ''); return; }
    if (!previa) return;
    const f = document.createDocumentFragment();
    partes.forEach((p, i) => { if (i) f.append(h('mark', { class: 'pend' }, 'Trocar')); if (p) f.append(p.replace(/^ /, i ? '' : ' ')); });
    n.replaceWith(f);
  });
  if (modoLimpo) document.title = limpo(document.title);
  const numPend = numeroPendente ? 1 : 0;
  const fotos = document.querySelectorAll('img[data-pendente]').length;
  if (total || fotos || numPend) {
    console.warn('[template] Pendências antes de publicar →', { textos: total, fotos, whatsapp: numPend });
    // Enquanto houver pendência, a página fica fora do Google (noindex). Some sozinho quando tudo for trocado.
    document.head.append(h('meta', { name: 'robots', content: 'noindex, nofollow' }));
  }
  if (previa) {
    let k = -1;
    const bt = h('button', { type: 'button', class: 'previa', 'aria-label': 'Prévia do template: ir para a próxima pendência' }, h('i'),
      h('span', null, 'Prévia: ' + total + ' [TROCAR] · ' + fotos + ' fotos' + (numPend ? ' · WhatsApp' : ''), h('span', { class: 'previa-longo' }, ' — toque para ir à próxima')));
    bt.addEventListener('click', () => {
      const m = [...document.querySelectorAll('mark.pend')]; if (!m.length) return;
      document.querySelectorAll('.pend-foco').forEach(x => x.classList.remove('pend-foco'));
      k = (k + 1) % m.length; const alvo = m[k];
      alvo.scrollIntoView({ block: 'center', behavior: reduzMovimento ? 'auto' : 'smooth' });
      alvo.parentElement && alvo.parentElement.classList.add('pend-foco');
      setTimeout(() => alvo.parentElement && alvo.parentElement.classList.remove('pend-foco'), 1800);
    });
    document.body.append(bt);
  }
}

/* ---------- montagem ---------- */
function montar() {
  aplicarTema(); seo();
  const main = $('#conteudo');
  const partes = [hero(), consultaRapida(), areas(), sobre(), primeiroAtendimento(), advogados(), galeria(), avaliacoes(), faq(), localizacao(), ctaFinal()].filter(Boolean);
  let alt = false;
  partes.forEach(p => { const t = p.dataset && p.dataset.tom; if (t === 'auto') { if (alt) p.classList.add('sec--tinta'); alt = !alt; } else if (t) alt = false; main.append(p); });
  const nav = [['areas', 'areas'], ['atendimento', 'atendimento'], ['advogados', 'advogados'], ['perguntas', 'faq']]
    .filter(([id]) => $('#' + id)).map(([id, k]) => ({ id, label: C.textos.nav[k] }));
  cabecalho(nav); rodape(); flutuante();
  if (lbItens.length) iniciarLb();
  refreshWa(); jsonld(); comportamentos(); pendencias();
}
if (numeroPendente) console.warn('[template] CONFIG.whatsapp.numero ainda é o número de exemplo.');
montar();
})();
