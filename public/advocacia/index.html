<script>

   Tokens aceitos nos textos: {nome} {cidade} {bairro} {uf}

   PUBLICIDADE NA ADVOCACIA (Código de Ética e Disciplina da OAB + Provimento 205/2021).
   O template já segue estes limites — mantenha nos textos do cliente:
   - caráter informativo, sóbrio e discreto;
   - nada de promessa de resultado, "causa ganha", "o melhor", urgência ou "ligue já";
   - nada de valores de honorários, desconto ou "consulta grátis" como atrativo;
   - nada de depoimentos de clientes nem citação de casos ou clientes atendidos;
   - rodapé sempre com nome e OAB do(a) responsável.
   Na dúvida sobre algum texto, confirme com o(a) próprio(a) advogado(a).

const CONFIG = {

  /* Prévia: mostra a etiqueta amarela [TROCAR] e o contador de pendências.
     Para mostrar ao cliente sem as etiquetas, abra o link com ?limpo no final. */

  negocio: {
    nome: "[TROCAR] Nome do Escritório",
    nicho: "Escritório de advocacia",
    tipoSchema: "LegalService",
    cidade: "[TROCAR] Cidade",
    uf: "[TROCAR] UF",
    bairro: "[TROCAR] Bairro",
    rua: "[TROCAR] Rua Exemplo, 000 — sala 00",
    cep: "[TROCAR] 00000-000",
    coordenadas: null                // opcional: { lat: -00.0000, lng: -00.0000 }

  /* OBRIGATÓRIO: advogado(a) responsável. Aparece no topo e no rodapé. */

    nome: "[TROCAR] Dr(a). Nome Sobrenome",
    oab: "[TROCAR] OAB/UF 000.000"
  },

  contato: {
    telefone: "[TROCAR] (00) 0000-0000",
    email: "[TROCAR] contato@seudominio.adv.br"
  },

  whatsapp: {
    numero: "5500000000000",         // [TROCAR] só dígitos, com 55 + DDD + número
    // {detalhes} recebe as escolhas do bloco "Sobre qual assunto?" (plano Completo). Nunca detalhes do caso.

    mensagemArea: "[TROCAR] Olá! Encontrei o site do escritório {nome} e gostaria de conversar sobre um assunto. Área: {area}.{detalhes}"

  /* Forma de atendimento, do jeito que o cliente confirmar (aparece no topo). "" = não mostra. */

  /* Opções que o visitante pode escolher no bloco "Sobre qual assunto?". */

  horarios: [
    { dias: "[TROCAR] Segunda a sexta", horas: "[TROCAR] 9h às 18h" }
  ],
  /* Opcional, só para o Google (JSON-LD). Dias em inglês: Monday … Sunday. */

  links: {
    instagram: "",                   // [TROCAR] (vazio = não mostra)
    linkedin: "",                    // [TROCAR] (vazio = não mostra)

  seo: {
    titulo: "[TROCAR] Nome do Escritório — Advocacia em {cidade}/{uf}",
    descricao: "[TROCAR] Escritório de advocacia em {bairro}, {cidade}/{uf}. Conheça as áreas de atuação e fale com o escritório pelo WhatsApp.",
    urlSite: "",                     // [TROCAR] https://www.dominio.adv.br/ (vazio = não altera o canonical)
    imagemOg: ""                     // [TROCAR] URL absoluta da imagem 1200x630
  },

  /* Cores em HEX. Sugestões (copie e cole):
     AZUL-MARINHO → primaria #15253D  secundaria #D8D2C6  fundo #FAFAF8  texto #1A2130
     VERDE-ESCURO → primaria #1E3A32  secundaria #D5D2C4  fundo #FAFAF8  texto #1B2420
     A primária dá origem à tinta escura e aos botões. A secundária é um neutro claro.
     destaque (opcional) colore filetes, índices e foco. Padrão: #B08D57. */

  textos: {
    /* Tom sóbrio e claro, sem juridiquês e sem promessa. */
    heroTitulo: "[TROCAR] Da dúvida\nà *clareza*.",
    heroSubtitulo: "[TROCAR] Orientação jurídica em {cidade}/{uf}. Conheça nosso trabalho e saiba como funciona o atendimento.",
    botaoPrincipal: "Falar com o escritório pelo WhatsApp",
    botaoCurto: "Falar no WhatsApp",
    botaoArea: "Falar sobre este assunto",
    verAreas: "Ver áreas de atuação",
    nav: { areas: "Áreas", atendimento: "Atendimento", advogados: "Advogados", faq: "Dúvidas" },

    consultaTitulo: "Sobre qual *assunto*?",
    consultaIntro: "Suas escolhas entram na mensagem do WhatsApp. Tudo é opcional.",

    areasTitulo: "Áreas de *atuação*",

    galeriaTitulo: "O *escritório*",
    galeriaIntro: "[TROCAR] Fotos do espaço de atendimento.",

    avaliacoesTitulo: "Depoimentos",
    avaliacoesIntro: "",

    faqTitulo: "Dúvidas *frequentes*",
    faqIntro: "Não encontrou sua dúvida? Pergunte pelo WhatsApp.",
    faqBotao: "Perguntar pelo WhatsApp",

    localTitulo: "Onde *atendemos*",

    ctaFinalTitulo: "Quer entender a sua *situação*?",
    ctaFinalTexto: "[TROCAR] Mande uma mensagem com um resumo do assunto. O escritório responde para marcar o atendimento."
  },

  /* Cena de abertura: video é o MP4 horizontal.
     videoMobile pode repetir video. Se for diferente, é preferido em telas horizontais menores.
     videoRetrato: MP4 vertical 1440×2560 para telas e conexões compatíveis.
     videoRetratoLeve: MP4 vertical 1080×1920, também usado se o maior falhar. Pode repetir videoRetrato.
     poster/posterRetrato: primeiro quadro, exibido durante o carregamento.
     final/finalRetrato: último quadro, usado no movimento reduzido e no fundo do contato.
     foco: [x, y] de 0 a 1, ponto de interesse no recorte horizontal. O retrato é centralizado.
     cena.ativa: false usa hero.foto (advogado(a) ou escritório, 1200×1500) ou só texto.
     Arquivos menores com a mesma qualidade, procurados ao lado de cada um (sem eles, vale o do CONFIG):
       nome.av1.mp4 e nome.hevc.mp4 para cada MP4 (usados quando o aparelho decodifica por hardware);
       nome.avif e nome.webp para cada JPG. codecsModernos: false ou formatosModernos: false desligam a busca. */
  hero: {
    foto: "",
    alt: "[TROCAR] Descreva a foto: ex. Dr(a). Nome no escritório",
    cena: {
      ativa: true,
      video: "/advocacia/assets/cena/cena.mp4",
      videoMobile: "/advocacia/assets/cena/cena.mp4",
      videoRetrato: "/advocacia/assets/cena/cena-retrato.mp4",
      videoRetratoLeve: "/advocacia/assets/cena/cena-retrato-leve.mp4",
      poster: "/advocacia/assets/cena/cena-poster.jpg",
      posterRetrato: "/advocacia/assets/cena/cena-poster-retrato.jpg",
      final: "/advocacia/assets/cena/cena-final.jpg",
      finalRetrato: "/advocacia/assets/cena/cena-final-retrato.jpg",
      foco: [0.77, 0.5]
    }
  },

  /* Áreas de atuação. atua: false esconde a área. Texto informativo, sem promessa. */
  areas: [
    { atua: true, nome: "Família e sucessões",  texto: "[TROCAR] Divórcio, guarda, pensão alimentícia, inventário e testamento." },
    { atua: true, nome: "Trabalhista",          texto: "[TROCAR] Questões de contrato, demissão, verbas rescisórias e jornada." },
    { atua: true, nome: "Previdenciário",       texto: "[TROCAR] Aposentadoria, auxílios e revisão de benefícios do INSS." },
    { atua: true, nome: "Direito do consumidor", texto: "[TROCAR] Problemas com compras, serviços, bancos e planos de saúde." },
    { atua: true, nome: "Cível",                texto: "[TROCAR] Contratos, cobranças, indenizações e questões de imóveis." },
    { atua: true, nome: "Empresarial",          texto: "[TROCAR] Contratos, abertura de empresa e orientação para o dia a dia do negócio." }
  ],

  sobre: {
    titulo: "[TROCAR] Sobre o *escritório*",
    paragrafos: [
      "[TROCAR] O primeiro passo é conversar sobre a situação e entender o que precisa ser esclarecido.",
      "[TROCAR] No atendimento, o escritório analisa os documentos pertinentes, explica as opções e combina com você como serão feitas as comunicações."
    ],
    foto: false,                     // "" = placeholder; URL = foto real; false = sem foto (mais sóbrio)
    alt: "[TROCAR] Descreva a foto: ex. sala de reunião do escritório"
  },

  /* "Como funciona o primeiro atendimento": você conta o caso → avaliamos a viabilidade → explicamos os próximos passos. */
  primeiroAtendimento: [
    { titulo: "Você conta o caso", texto: "Pelo WhatsApp ou em um horário marcado, você explica a situação com calma." },
    { titulo: "Avaliamos a viabilidade", texto: "[TROCAR] O escritório examina os documentos disponíveis, identifica os prazos e avalia as opções." },
    { titulo: "Explicamos os próximos passos", texto: "[TROCAR] Você recebe uma explicação das opções, das etapas previstas e das condições do atendimento." }
  ],

  /* Advogado(s). Lista vazia = a seção some (o rodapé continua com o responsável).
     foto: "" = placeholder; foto: false = cartão sem foto.
     areas e bio: só fatos que o(a) advogado(a) confirmar (formação, só se informada). */
  advogados: [
    { nome: "[TROCAR] Dr(a). Nome Sobrenome", oab: "[TROCAR] OAB/UF 000.000",
      areas: "[TROCAR] Família e sucessões, Cível", bio: "[TROCAR] Atuação em questões familiares, sucessórias e cíveis.",
      foto: "", alt: "[TROCAR] Foto de Dr(a). Nome Sobrenome" }
  ],

  /* Galeria: poucas fotos, todas reais (recepção, sala de reunião, fachada). Lista vazia = some. */
  galeria: [
    { src: "", alt: "[TROCAR] Descreva: recepção do escritório", rotulo: "Recepção", legenda: "" },
    { src: "", alt: "[TROCAR] Descreva: sala de reunião", rotulo: "Sala de reunião", legenda: "" },
    { src: "", alt: "[TROCAR] Descreva: fachada ou entrada do prédio", rotulo: "Fachada", legenda: "" }
  ],

  /* NÃO USE: o Provimento 205/2021 veda depoimentos de clientes na publicidade da advocacia.
     O módulo fica desligado em todos os planos. */
  avaliacoes: [],

  faq: [
    { p: "O atendimento pode ser online?",
      r: "[TROCAR] O escritório atende online com horário marcado e orienta sobre o envio de documentos na conversa inicial." },
    { p: "O que eu conto fica em sigilo?",
      r: "[TROCAR] As informações compartilhadas no atendimento são tratadas com sigilo profissional." },
    { p: "Quais documentos devo levar?",
      r: "[TROCAR] Tenha em mãos um documento com foto e os documentos relacionados ao assunto. O escritório orienta sobre o que mais pode ser necessário." },
    /* Não informe valores de honorários nem ofereça consulta gratuita como atrativo. */
    { p: "Como são combinados os honorários?",
      r: "[TROCAR] Os honorários são apresentados após a análise do assunto e combinados por escrito." }
  ],

  rodape: {
    frase: "[TROCAR] Advocacia com atendimento presencial e online, com horário marcado.",
    razaoSocial: "[TROCAR] Nome Sociedade de Advogados",
    cnpj: "[TROCAR] 00.000.000/0000-00",
    registroSociedade: "[TROCAR] Registro OAB/UF nº 0000",   // sociedade de advogados; "" se for advogado(a) autônomo(a)
    credito: "Site por JL Devs",     // "" remove
    creditoUrl: ""                   // [TROCAR] link do seu portfólio (vazio = só texto)
  },

  /* ---- PLANOS --------------------------------------------------------------
     planos.ativo escolhe o pacote. Cada módulo em "modulos" pode ser:
       null  = segue o plano ativo      true = força ligado      false = força desligado
     avaliacoes fica FALSE em todos os planos (vedado pela OAB).                  */
  planos: {
    ativo: "completo",               // "basico" | "intermediario" | "completo"
    presets: {
      basico:        { areas:true, linksArea:true, sobre:true, primeiroAtendimento:true, advogados:true, faq:true, localizacao:true, botaoFlutuante:true,
                       galeria:false, mapa:false, redes:false, lightbox:false, consultaRapida:false, jsonLdCompleto:false, avaliacoes:false },
      intermediario: { areas:true, linksArea:true, sobre:true, primeiroAtendimento:true, advogados:true, faq:true, localizacao:true, botaoFlutuante:true,
                       galeria:true, mapa:true, redes:true,
                       lightbox:false, consultaRapida:false, jsonLdCompleto:false, avaliacoes:false },
      completo:      { areas:true, linksArea:true, sobre:true, primeiroAtendimento:true, advogados:true, faq:true, localizacao:true, botaoFlutuante:true,
                       galeria:true, mapa:true, redes:true,
                       lightbox:true, consultaRapida:true, jsonLdCompleto:true, avaliacoes:false }
    },
    modulos: {
      areas: null, linksArea: null, sobre: null, primeiroAtendimento: null, advogados: null,
      galeria: null, lightbox: null, faq: null, localizacao: null, mapa: null, redes: null,
      consultaRapida: null, jsonLdCompleto: null, botaoFlutuante: null,
      avaliacoes: false
    }
  }
};

</script>

<!--
=====================================================================
CHECKLIST DE ADAPTAÇÃO POR CLIENTE — ADVOCACIA  (tudo no CONFIG, exceto o item 1)
=====================================================================
[ ] 1. <head> (estático, o WhatsApp/LinkedIn não rodam JS): <title>, meta description, canonical,
       og:title, og:description, og:url, og:image (1200x630 com URL absoluta).
       Na abertura de reserva antes do rodapé, atualize nome do escritório, link de WhatsApp, nome do responsável e OAB.
[ ] 2. CONFIG.negocio: nome, cidade, uf, bairro, rua, cep.
[ ] 3. CONFIG.responsavel: nome e OAB/UF — OBRIGATÓRIO.
[ ] 4. CONFIG.whatsapp.numero (55 + DDD + número) e as duas mensagens.
[ ] 5. CONFIG.contato, CONFIG.horarios (e horariosSchema, opcional), formaAtendimento, modalidades.
[ ] 6. CONFIG.links: Instagram, LinkedIn, Google Maps, mapaEmbed.
[ ] 7. CONFIG.cores: primaria escura, secundaria neutra clara, fundo e texto em HEX.
       destaque é opcional (padrão #B08D57).
[ ] 8. CONFIG.textos: heroTitulo, heroSubtitulo e os demais com [TROCAR]. Sem promessa, sem juridiquês.
[ ] 9. CONFIG.hero.cena: confirme video, videoMobile, videoRetrato e videoRetratoLeve,
       poster e posterRetrato (primeiro quadro), final e finalRetrato (último quadro), e foco.
       videoMobile pode usar o mesmo arquivo de video em tablets e celulares na horizontal.
       videoRetratoLeve pode usar o mesmo arquivo de videoRetrato.
       Use ativa: false para exibir hero.foto + alt (real, 1200x1500), ou deixe a foto vazia para só texto.
[ ] 10. CONFIG.areas: atua true/false e texto informativo de cada área.
[ ] 11. CONFIG.sobre (foto false por padrão), CONFIG.primeiroAtendimento (passos 2 e 3).
[ ] 12. CONFIG.advogados: nome, OAB/UF, áreas, bio factual, foto (ou false).
[ ] 13. CONFIG.galeria: poucas fotos reais do escritório (plano Intermediário em diante).
[ ] 14. CONFIG.faq: online, sigilo, documentos, honorários (sem valores).
[ ] 15. CONFIG.rodape: razão social, CNPJ, registro da sociedade na OAB (ou "" se autônomo), crédito.
[ ] 16. CONFIG.planos.ativo = "basico" | "intermediario" | "completo". avaliacoes continua false.
[ ] 17. Ctrl+F por "[TROCAR]": precisa dar ZERO resultados no CONFIG e no <head>.
[ ] 18. Mostre ao cliente com ?limpo no fim do link (esconde as etiquetas amarelas).
Obs.: enquanto houver [TROCAR], foto pendente ou WhatsApp de exemplo, a página se marca sozinha
como noindex. Quando tudo estiver trocado, ela volta a ser indexável sem você mexer em nada,
desde que você apague o <meta name="robots"> fixo do <head> (ele existe só no modelo demonstrativo).
=====================================================================
-->
